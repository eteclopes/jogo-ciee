  /* Uma faixa de casario. Larguras e alturas variam por um embaralhamento
     simples, então o olho não vê um padrão repetido passando — que é
     justamente o que cansa a vista numa paralaxe. */
  faixaPredios(g,cor,veloc,baseY,larg,vao,altMin,altVar,semente,telhado,detalhe){
    const off=Cam.ox*veloc;
    const passo=larg+vao;
    const i0=Math.floor((off-larg*2)/passo);
    const i1=i0+Math.ceil(Vista.larg/passo)+3;
    const emb=i=>{const k=Math.sin(i*semente*.017)*43758.5;return k-Math.floor(k);};
    g.fillStyle=cor;
    for(let i=i0;i<i1;i++){
      const r1=emb(i), r2=emb(i+91), r3=emb(i+317);
      const w=larg*(.62+r1*.86);
      const x=Cam.ox+(i*passo-off)+r2*vao*.5;
      const h=altMin+r3*altVar;
      const y=baseY-h;
      if(telhado==='casa'){
        g.beginPath();
        g.moveTo(x-w*.13,y);
        g.lineTo(x+w/2,y-w*(.2+r1*.14));
        g.lineTo(x+w*1.13,y);
        g.closePath();g.fill();
        g.fillRect(x,y,w,h);
        if(r2>.55){const cw=w*.22;g.fillRect(x+w*.62,y-w*(.2+r1*.14)-cw*1.1,cw,cw*1.1);}
      }else if(telhado==='torre'){
        g.fillRect(x,y,w,h);
        if(r1>.4)g.fillRect(x+w*.44,y-16-r2*18,4,20+r2*18);
        if(r3>.6)g.fillRect(x+w*.12,y-8,w*.26,8);
      }else{
        g.fillRect(x,y,w,h);
        if(r3>.62){const cw=w*.2;g.fillRect(x+w*.58,y-cw,cw,cw);}
      }
      if(detalhe&&r2>.35){
        g.save();
        g.strokeStyle=cor;g.globalAlpha=.55;g.lineWidth=2;
        g.beginPath();
        g.moveTo(x,y+h*.22);
        g.quadraticCurveTo(x+passo*.5,y+h*.22+16,x+passo,y+h*.16);
        g.stroke();
        g.restore();
      }
    }
  },

  ceuVivo(g){
    const f=this.faseAtual, cl=CLIMA[f.n]||{};
    /* 'menos movimento' congela o relógio do céu */
    const t=Jogo.menosMovimento?12:Jogo.tempoTotal;
    const base=Mundo.chaoY, topo=Cam.oy;
    /* O céu tem uma paralaxe MUITO leve em vez de ficar colado na tela.
       Sem isso o sol parece perseguir a jogadora. */
    const px=Cam.ox*.055;
    g.save();

    /* --- estrelas --- */
    if(cl.estrelas){
      for(let i=0;i<cl.estrelas;i++){
        const x=Cam.ox+((i*197-px)%(Vista.larg+240)+Vista.larg+240)%(Vista.larg+240)-120;
        const y=topo+((i*131)%Math.round(Vista.alt*.6));
        g.globalAlpha=.28+Math.abs(Math.sin(t*.26+i*1.7))*.3;
        g.fillStyle=i%7===0?f.detalhe:'#F4F1FF';
        const tm=i%9===0?2.6:1.6;
        g.fillRect(x,y,tm,tm);
      }
      g.globalAlpha=1;
    }

    /* --- sol ou lua --- */
    if(cl.astro){
      const sx=Cam.ox+Vista.larg*cl.ax-px, sy=topo+Vista.alt*cl.ay;
      const gr=g.createRadialGradient(sx,sy,10,sx,sy,200);
      gr.addColorStop(0,cl.halo);
      gr.addColorStop(.42,'rgba(255,180,120,.12)');
      gr.addColorStop(1,'rgba(255,180,120,0)');
      g.fillStyle=gr;g.beginPath();g.arc(sx,sy,200,0,Math.PI*2);g.fill();
      if(cl.astro==='sol'){
        g.globalAlpha=.07+Math.sin(t*.3)*.02;
        g.fillStyle=cl.cor;
        for(let i=0;i<8;i++){
          g.save();g.translate(sx,sy);g.rotate(i*(Math.PI/4));
          g.beginPath();g.moveTo(0,0);g.lineTo(340,-24);g.lineTo(340,24);g.closePath();g.fill();
          g.restore();
        }
        g.globalAlpha=1;
        g.fillStyle=cl.cor;
        g.beginPath();g.arc(sx,sy,36,0,Math.PI*2);g.fill();
      }else{
        g.fillStyle=cl.cor;
        g.beginPath();g.arc(sx,sy,30,0,Math.PI*2);g.fill();
        g.fillStyle=f.ceu[0];
        g.beginPath();g.arc(sx+12,sy-8,28,0,Math.PI*2);g.fill();
      }
    }

    /* --- arco-íris: fase 5, depois da tempestade --- */
    if(cl.arcoIris){
      const ax=Cam.ox+Vista.larg*.62-px, ay=base+Vista.alt*.12;
      const cores=['#FF8A8A','#FFC53D','#8FE6A0','#8FB6FF','#C99BFF'];
      g.save();g.globalAlpha=.16;g.lineWidth=11;
      cores.forEach((c,i)=>{
        g.strokeStyle=c;
        g.beginPath();g.arc(ax,ay,Vista.alt*.62-i*11,Math.PI*1.06,Math.PI*1.94);g.stroke();
      });
      g.restore();
    }

    /* --- nuvens em camadas --- */
    (cl.nuvens||[]).forEach(([vel,alt,esc,alpha,cor])=>{
      g.globalAlpha=alpha;
      g.fillStyle=cor;
      const passo=Math.round(430*esc);
      const off=((t*vel+px*1.7)%passo+passo)%passo;
      for(let i=-1;i<Math.ceil(Vista.larg/passo)+2;i++){
        const x=Cam.ox+i*passo-off;
        const y=topo+Vista.alt*alt+Math.sin(t*.18+i)*4;
        const r=26*esc;
        g.beginPath();
        g.arc(x,y,r,0,Math.PI*2);
        g.arc(x+r*.9,y-r*.34,r*.78,0,Math.PI*2);
        g.arc(x+r*1.8,y,r*.66,0,Math.PI*2);
        g.arc(x+r*.9,y+r*.3,r*.9,0,Math.PI*2);
        g.fill();
      }
      g.globalAlpha=1;
    });

    /* --- pássaros --- */
    for(let b=0;b<(cl.passaros||0);b++){
      const per=64+b*19;
      const p=((t+b*23)%per)/per;
      const bx=Cam.ox-90+p*(Vista.larg+180);
      const by=topo+Vista.alt*(.11+b*.07)+Math.sin(t*.4+b)*5;
      g.globalAlpha=.35;
      g.strokeStyle='#F4F1FF';g.lineWidth=2;g.lineCap='round';
      for(let k=0;k<3;k++){
        const x2=bx+k*17, y2=by+k*7, flap=Math.sin(t*5+k*.8)*4;
        g.beginPath();g.moveTo(x2-6,y2+flap);g.lineTo(x2,y2);g.lineTo(x2+6,y2+flap);g.stroke();
      }
      g.globalAlpha=1;
    }

    /* --- código parado da machosfera --- */
    if(cl.codigo){
      g.globalAlpha=.11;
      g.fillStyle=f.detalhe;
      for(let i=0;i<16;i++){
        const x=Cam.ox+((i*151-px)%(Vista.larg+160)+Vista.larg+160)%(Vista.larg+160)-80;
        const y=topo+((i*211)%Math.round(Vista.alt*.55));
        for(let k=0;k<5;k++)g.fillRect(x,y+k*13,3,7);
      }
      g.globalAlpha=1;
    }

    /* --- balões da rede de apoio --- */
    for(let i=0;i<(cl.baloes||0);i++){
      const per=84+i*15;
      const p=((t+i*17)%per)/per;
      const bx=Cam.ox+((i*263-px*2)%Vista.larg+Vista.larg)%Vista.larg;
      const by=base-p*(Vista.alt+130);
      g.globalAlpha=.4;
      g.fillStyle=['#C99BFF','#FFC53D','#43E098','#FF8FB0','#8FB6FF'][i%5];
      g.beginPath();g.ellipse(bx,by,11,14,0,0,Math.PI*2);g.fill();
      g.strokeStyle='rgba(244,241,255,.35)';g.lineWidth=1.4;
      g.beginPath();g.moveTo(bx,by+14);g.quadraticCurveTo(bx+5,by+26,bx,by+38);g.stroke();
      g.globalAlpha=1;
    }
    g.restore();
  },

  /* Tempestade: chuva e relâmpago. O clarão ilumina o cenário do fundo
     em vez de piscar a tela toda — dá o susto sem machucar os olhos. */
  tempestade(g){
    const f=this.faseAtual, cl=CLIMA[f.n]||{};
    if(!cl.chuva||Jogo.menosMovimento)return;
    const t=Jogo.tempoTotal;
    g.save();
    g.globalAlpha=.26;
    g.strokeStyle='#C4B8E8';g.lineWidth=1.7;
    for(let i=0;i<64;i++){
      const x=Cam.ox+((i*89+t*150)%Math.round(Vista.larg+140))-70;
      const y=Cam.oy+((i*137+t*420)%Math.round(Vista.alt+90))-45;
      g.beginPath();g.moveTo(x,y);g.lineTo(x-3,y+12);g.stroke();
    }
    g.restore();
  },
  clarao(g){
    const cl=CLIMA[this.faseAtual.n]||{};
    if(!cl.raios||Jogo.menosMovimento)return;
    const t=Jogo.tempoTotal;
    /* dois picos rápidos, como relâmpago de verdade */
    const ciclo=(t*.14)%1;
    let f2=0;
    if(ciclo<.03)f2=Math.max(0,1-ciclo/.03);
    else if(ciclo>.06&&ciclo<.085)f2=Math.max(0,1-(ciclo-.06)/.025)*.7;
    if(f2<=0)return;
    g.save();
    g.globalAlpha=f2*.3;
    const gr=g.createLinearGradient(0,Cam.oy,0,Cam.oy+Vista.alt*.8);
    gr.addColorStop(0,'#DDD3FF');
    gr.addColorStop(1,'rgba(221,211,255,0)');
    g.fillStyle=gr;
    g.fillRect(Cam.ox-10,Cam.oy,Vista.larg+20,Vista.alt);
    g.restore();
  },

  paralaxe(g){
    const f=this.faseAtual, cl=CLIMA[f.n]||{};
    const ceu=f.ceu[2];
    this.ceuVivo(g);
    /* O casario nasce na LINHA DO CHÃO, não no rodapé da tela. Ancorado
       na tela, ele ficava enterrado nas fases de mundo mais alto. */
    const base=Mundo.chaoY+10;
    const perfil=(f.n===1||f.n===4)?'casa':(f.n===3?'torre':'plano');

    /* Cada faixa é misturada com o CÉU, não com a cor do chão: quanto mais
       longe, mais ela some no ar. É o que tira o contraste que incomoda. */
    this.faixaPredios(g,this.mistura(ceu,f.chao,.3),.88,base-124,180,130,90,120,53,perfil);
    this.faixaPredios(g,this.mistura(ceu,f.chao,.56),.74,base-70, 158,104,140,160,97,perfil);

    /* névoa entre as camadas */
    const nv=g.createLinearGradient(0,base-330,0,base-30);
    nv.addColorStop(0,'rgba(0,0,0,0)');
    nv.addColorStop(1,this.mistura(ceu,'#ffffff',.1));
    g.save();g.globalAlpha=.4;g.fillStyle=nv;
    g.fillRect(Cam.ox-10,base-330,Vista.larg+20,302);
    g.restore();

    this.faixaPredios(g,this.mistura(ceu,f.chao,.84),.48,base-16,140,90,170,200,151,perfil,true);

    /* janelas acesas, discretas e sem cintilar forte */
    g.save();
    g.fillStyle=f.detalhe;
    g.globalAlpha=.16;
    const off=Cam.ox*.48, passo=230;
    const k0=Math.floor((off-140)/passo);
    const emb=i=>{const k=Math.sin(i*151*.017)*43758.5;return k-Math.floor(k);};
    for(let i=k0;i<k0+Math.ceil(Vista.larg/passo)+3;i++){
      const r1=emb(i), r3=emb(i+317);
      const w=140*(.62+r1*.86);
      const x=Cam.ox+(i*passo-off)+emb(i+91)*45;
      const h=170+r3*200;
      const cols=Math.max(1,Math.floor(w/44));
      for(let r=0;r<Math.floor(h/64);r++)
        for(let c=0;c<cols;c++){
          const sem=(i*31+r*7+c*13);
          if(sem%4===0)continue;
          if(sem%6===0&&Math.sin(Jogo.tempoTotal*.1+sem)<0)continue;
          g.fillRect(x+12+c*44,base-16-h+28+r*64,20,24);
        }
    }
    g.restore();

    /* subsolo: sem isso o buraco mostra o fundo claro e parece piso */
    const cy=Mundo.chaoY;
    if(cy<Cam.oy+Vista.alt){
      const gr=g.createLinearGradient(0,cy,0,cy+230);
      gr.addColorStop(0,this.mistura(f.chao,'#000000',.42));
      gr.addColorStop(1,this.mistura(f.ceu[0],'#000000',.62));
      g.fillStyle=gr;
      g.fillRect(Cam.ox-10,cy,Vista.larg+20,Cam.oy+Vista.alt-cy+20);
    }

    /* coloração: puxa a cena inteira para a luz da hora do dia */
    if(cl.tinta){
      g.save();
      g.fillStyle=cl.tinta;
      g.fillRect(Cam.ox-10,Cam.oy-10,Vista.larg+20,Vista.alt+20);
      g.restore();
    }

    if(f.n===3){
      /* grade digital da machosfera */
      g.save();
      g.globalAlpha=.12;
      g.strokeStyle=f.detalhe;g.lineWidth=1;
      const pas=64, ox=Cam.ox*.3%pas, oy=Cam.oy*.3%pas;
      for(let x=-ox;x<Vista.larg+pas;x+=pas){
        g.beginPath();g.moveTo(Cam.ox+x,Cam.oy);g.lineTo(Cam.ox+x,Cam.oy+Vista.alt);g.stroke();
      }
      for(let y=-oy;y<Vista.alt+pas;y+=pas){
        g.beginPath();g.moveTo(Cam.ox,Cam.oy+y);g.lineTo(Cam.ox+Vista.larg,Cam.oy+y);g.stroke();
      }
      g.restore();
    }
  },

  /* Partículas de ambiente: poeira em casa, folhas na rua, bits na
     machosfera. Custam pouco e tiram a sensação de cenário parado. */
  ambiente(g){
    const f=this.faseAtual, t=Jogo.tempoTotal;
    const cores={1:'#FFC53D',2:'#43E098',3:'#4D8BFF',4:'#FF5470',5:'#C99BFF'};
    const cor=cores[f.n]||'#FFFFFF';
    g.save();
    for(let i=0;i<26;i++){
      const semente=i*137.5;
      const vx=(f.n===3?90:34)+(i%5)*12;
      const x=((semente*7+t*vx)%(Vista.larg+120))-60+Cam.ox;
      const y=((semente*11+Math.sin(t*.6+i)*30)%(Vista.alt+60))-30+Cam.oy;
      const tam=f.n===3?3:2+(i%3);
      g.globalAlpha=.10+((i*37)%40)/220+Math.sin(t*1.6+i)*.05;
      g.fillStyle=cor;
      if(f.n===3)g.fillRect(x,y,2,tam*3);
      else g.beginPath(),g.arc(x,y,tam*.6,0,Math.PI*2),g.fill();
    }
    g.restore();
  },

  /* Silhuetas passando na frente da câmera: profundidade barata */
  frente(g){
    const f=this.faseAtual;
    g.save();
    g.globalAlpha=.2;
    g.fillStyle='#000';
    const o=Cam.ox*1.28;
    for(let i=0;i<8;i++){
      const bx=(i*620-o)%(Mundo.larg+900);
      g.fillRect(Cam.ox+bx-350,Cam.oy+Vista.alt-150,58,190);
    }
    g.restore();
  },

  /* Micro-tutoriais: texto grande e apagado pintado na parede do fundo,
     no lugar exato onde a mecânica aparece. Não pausa, não pede clique. */
  dicas(g){
    for(const d of Mundo.dicas){
      if(d.x<Cam.ox-260||d.x>Cam.ox+Vista.larg+260)continue;
      d.anim+=1/60;
      const perto=Math.abs((Jog.x+Jog.w/2)-d.x);
      const forca=clamp(1-(perto-120)/260,.22,1);
      g.save();
      g.globalAlpha=forca*.5;
      g.textAlign='center';
      g.fillStyle=this.faseAtual.detalhe;
      g.font='900 27px Arial Black,system-ui,sans-serif';
      g.fillText(d.titulo,d.x,d.y);
      g.globalAlpha=forca*.34;
      g.fillStyle='#F4F1FF';
      g.font='600 16px system-ui,sans-serif';
      g.fillText(d.linha,d.x,d.y+23);
      /* seta apontando pro chão */
      g.globalAlpha=forca*.3;
      g.strokeStyle=this.faseAtual.detalhe;
      g.lineWidth=3;g.lineCap='round';
      const bal=Math.sin(d.anim*2.4)*4;
      g.beginPath();
      g.moveTo(d.x,d.y+40);g.lineTo(d.x,d.y+70+bal);
      g.moveTo(d.x-8,d.y+62+bal);g.lineTo(d.x,d.y+70+bal);
      g.lineTo(d.x+8,d.y+62+bal);
      g.stroke();
      g.textAlign='left';
      g.restore();
    }
  },

  murais(g){
    for(const m of Mundo.murais){
      if(m.x+m.w<Cam.ox-80||m.x>Cam.ox+Vista.larg+80)continue;
      const lido=m.disparado;
      const x=m.x+6, y=m.y+34, w=m.w-12, h=m.h-46;
      g.save();
      /* painel de parede */
      g.fillStyle=lido?'rgba(20,12,44,.55)':'rgba(20,12,44,.8)';
      g.fillRect(x,y,w,h);
      g.strokeStyle=lido?'rgba(199,190,230,.3)':'#C99BFF';
      g.lineWidth=2.5;
      g.strokeRect(x+.5,y+.5,w-1,h-1);
      /* laço lilás pintado no alto */
      g.fillStyle=lido?'rgba(199,190,230,.4)':'#C99BFF';
      const lx=x+w/2, ly=y+22;
      g.beginPath();
      g.moveTo(lx,ly+4);
      g.bezierCurveTo(lx-13,ly-9,lx-13,ly-2,lx-2,ly+3);
      g.bezierCurveTo(lx-8,ly+11,lx-4,ly+14,lx,ly+5);
      g.bezierCurveTo(lx+4,ly+14,lx+8,ly+11,lx+2,ly+3);
      g.bezierCurveTo(lx+13,ly-2,lx+13,ly-9,lx,ly+4);
      g.fill();
      /* linhas de texto pintadas */
      g.fillStyle=lido?'rgba(199,190,230,.28)':'rgba(244,241,255,.62)';
      for(let i=0;i<4;i++){
        const lw=w-26-((i*29)%34);
        g.fillRect(x+13,y+46+i*15,lw,4);
      }
      g.restore();
      if(!lido){
        /* brilho discreto na moldura, só pra chamar o olho */
        const pu=Math.sin(m.anim*2.6)*.5+.5;
        g.save();
        g.globalAlpha=.18+pu*.22;
        g.strokeStyle='#FFC53D';
        g.lineWidth=4;
        g.strokeRect(x-3,y-3,w+6,h+6);
        g.restore();
      }
    }
  },

  enfeites(g){
    const f=this.faseAtual;
    for(const d of Mundo.enfeites){
      if(d.tipo==='onda')continue;
      if(d.x+(d.w||100)<Cam.ox-140||d.x>Cam.ox+Vista.larg+140)continue;
      switch(d.tipo){
        case 'mola':{
          const h=d.h*(1-d.carga*.55);
          g.fillStyle='#8C6A2A';
          g.fillRect(d.x,d.y+d.h-h,d.w,h);
          g.fillStyle='#FFC53D';
          g.fillRect(d.x-3,d.y+d.h-h-8,d.w+6,10);
          g.fillStyle='rgba(255,255,255,.35)';
          g.fillRect(d.x-3,d.y+d.h-h-8,d.w+6,3);
          break;
        }
        case 'casa':{
          const cp=this.mistura(f.ceu[2],f.chao,.9);
          g.fillStyle=cp;
          g.beginPath();g.moveTo(d.x-14,d.y);g.lineTo(d.x+d.w/2,d.y-52);g.lineTo(d.x+d.w+14,d.y);g.closePath();g.fill();
          g.fillRect(d.x,d.y,d.w,d.h);
          g.fillStyle='rgba(0,0,0,.22)';
          g.fillRect(d.x,d.y,d.w,6);
          g.fillStyle=f.detalhe;g.globalAlpha=.2;
          g.fillRect(d.x+26,d.y+42,40,40);g.fillRect(d.x+d.w-66,d.y+42,40,40);
          g.globalAlpha=1;
          g.fillStyle='rgba(0,0,0,.3)';
          g.fillRect(d.x+d.w/2-17,d.y+d.h-72,34,72);
          break;
        }
        case 'predio':{
          g.fillStyle=this.mistura(f.ceu[2],f.chao,.92);
          g.fillRect(d.x,d.y,d.w,d.h);
          g.fillStyle='rgba(0,0,0,.25)';g.fillRect(d.x,d.y,d.w,5);
          g.fillStyle=f.detalhe;g.globalAlpha=.18;
          for(let r=0;r<5;r++)for(let c=0;c<3;c++)
            if((r*3+c+Math.floor(d.x))%3!==0)g.fillRect(d.x+12+c*34,d.y+18+r*48,20,24);
          g.globalAlpha=1;
          break;
        }
        case 'poste':{
          g.fillStyle='rgba(255,255,255,.18)';g.fillRect(d.x,d.y,d.w,d.h);
          const gr=g.createRadialGradient(d.x+6,d.y,4,d.x+6,d.y,110);
          gr.addColorStop(0,'rgba(255,222,150,.38)');
          gr.addColorStop(1,'rgba(255,222,150,0)');
          g.fillStyle=gr;g.beginPath();g.arc(d.x+6,d.y,110,0,Math.PI*2);g.fill();
          break;
        }
        case 'varal':{
          g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=2;
          g.beginPath();g.moveTo(d.x,d.y);g.quadraticCurveTo(d.x+d.w/2,d.y+16,d.x+d.w,d.y);g.stroke();
          const cores=['#43E098','#FFC53D','#C99BFF','#FF8FB0'];
          for(let i=0;i<4;i++){
            g.fillStyle=cores[i];g.globalAlpha=.5;
            g.fillRect(d.x+20+i*32,d.y+8+Math.sin(Jogo.tempoTotal*2+i)*2,19,26);
          }
          g.globalAlpha=1;
          break;
        }
        case 'tela':{
          g.fillStyle=this.mistura(f.ceu[2],'#000000',.42);
          g.fillRect(d.x,d.y,d.w,d.h);
          g.fillStyle=f.detalhe;
          g.globalAlpha=.15+Math.sin(Jogo.tempoTotal*.5+d.anim)*.03;
          g.fillRect(d.x+6,d.y+6,d.w-12,d.h*.4);
          g.globalAlpha=.5;
          g.fillRect(d.x,d.y,d.w,3);
          g.globalAlpha=1;
          break;
        }
        case 'bit':
          g.fillStyle=f.detalhe;
          g.globalAlpha=.26;
          g.fillRect(d.x,d.y,d.w,d.h);
          g.globalAlpha=1;
          break;
        case 'janelaAcesa':{
          const tremula=.5+Math.sin(Jogo.tempoTotal*.4+d.anim)*.1;
          g.fillStyle='rgba(0,0,0,.4)';g.fillRect(d.x-4,d.y-4,d.w+8,d.h+8);
          g.globalAlpha=tremula;
          g.fillStyle=d.cor;g.fillRect(d.x,d.y,d.w,d.h);
          g.globalAlpha=1;
          g.fillStyle='rgba(0,0,0,.35)';
          g.fillRect(d.x+d.w/2-2,d.y,4,d.h);
          break;
        }
        case 'bandeira':{
          g.fillStyle='rgba(255,255,255,.22)';g.fillRect(d.x,d.y,4,d.h);
          g.fillStyle=d.cor;g.globalAlpha=.6;
          g.beginPath();g.moveTo(d.x+4,d.y);
          g.lineTo(d.x+4+d.w,d.y+12+Math.sin(Jogo.tempoTotal*2+d.anim)*5);
          g.lineTo(d.x+4,d.y+38);g.closePath();g.fill();
          g.globalAlpha=1;
          break;
        }
      }
    }
  },

  ondas(g){
    for(const d of Mundo.enfeites){
      if(d.tipo!=='onda')continue;
      const a=clamp(d.vida/.4,0,1);
      g.save();
      g.globalAlpha=a*.7;
      g.strokeStyle='#FFC53D';
      g.lineWidth=5*a+1;
      g.beginPath();g.ellipse(d.x,d.y,d.r,d.r*.34,0,Math.PI,0);g.stroke();
      g.restore();
    }
  },

  solidos(g){
    const f=this.faseAtual;
    for(const s of Mundo.solidos){
      if(s.removido)continue;
      if(s.x+s.w<Cam.ox-80||s.x>Cam.ox+Vista.larg+80)continue;
      if(s.ehMuro)continue;                        /* desenhado como inimigo */
      if(s.ehPortao){this.portao(g,s);continue;}
      if(s.quebrando&&s.sumiu){
        g.globalAlpha=.16;g.fillStyle=f.detalhe;
        g.fillRect(s.x,s.y,s.w,4);g.globalAlpha=1;
        continue;
      }
      if(s.pisca){
        /* o feed: aceso, avisando ou apagado */
        const saindo=s.t>.5&&s.t<.62;
        g.save();
        if(!s.ligado){
          g.globalAlpha=.22;
          g.strokeStyle=f.detalhe;g.lineWidth=2;g.setLineDash([7,7]);
          g.strokeRect(s.x+1,s.y+1,s.w-2,16);
          g.setLineDash([]);
          g.restore();
          continue;
        }
        if(saindo)g.globalAlpha=.55+Math.sin(Jogo.tempoTotal*34)*.35;
        g.fillStyle=f.detalhe;
        g.fillRect(s.x,s.y,s.w,7);
        g.globalAlpha*= .45;
        g.fillRect(s.x,s.y+7,s.w,9);
        g.restore();
        continue;
      }
      if(s.rede){
        const br=Math.max(0,s.brilho);
        g.save();
        g.fillStyle='#C99BFF';
        g.fillRect(s.x,s.y,s.w,6);
        g.globalAlpha=.45;
        g.fillRect(s.x,s.y+6,s.w,12);
        g.globalAlpha=.25+br*.5;
        g.fillStyle='#FFC53D';
        g.fillRect(s.x,s.y-2,s.w,3);
        /* mãos dadas: pontinhos ligando as pontas */
        g.globalAlpha=.5;
        g.fillStyle='#F4F1FF';
        for(let i=8;i<s.w-6;i+=18)g.fillRect(s.x+i,s.y+2,5,2);
        g.restore();
        continue;
      }
      if(s.elevador){
        g.fillStyle=s.carregado?'#43E098':(s.cor||f.chao);
        g.fillRect(s.x,s.y,s.w,s.h);
        g.fillStyle='#FFC53D';
        g.fillRect(s.x,s.y,s.w,5);
        g.fillStyle='rgba(0,0,0,.3)';
        for(let i=10;i<s.w-8;i+=20)g.fillRect(s.x+i,s.y+9,10,4);
        /* corda até o alto */
        g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=2;
        g.beginPath();
        g.moveTo(s.x+s.w/2,s.y);g.lineTo(s.x+s.w/2,s.oy-s.curso-40);
        g.stroke();
        /* seta indicando que sobe com peso */
        g.globalAlpha=s.carregado?.8:.35;
        g.fillStyle='#FFC53D';
        const sb=Math.sin(Jogo.tempoTotal*4)*3;
        g.beginPath();
        g.moveTo(s.x+s.w/2,s.y-16+sb);
        g.lineTo(s.x+s.w/2-7,s.y-6+sb);
        g.lineTo(s.x+s.w/2+7,s.y-6+sb);
        g.closePath();g.fill();
        g.globalAlpha=1;
        continue;
      }
      if(s.tipo==='passagem'){
        g.fillStyle=f.detalhe;g.globalAlpha=.85;
        g.fillRect(s.x,s.y,s.w,7);
        g.globalAlpha=.28;g.fillRect(s.x,s.y+7,s.w,4);
        g.globalAlpha=1;
        continue;
      }
      g.fillStyle=s.cor||f.chao;
      g.fillRect(s.x,s.y,s.w,s.h);
      /* faixa de luz no topo + degradê pra baixo, pra não ficar chapado */
      g.fillStyle=f.detalhe;
      g.globalAlpha=s.quebrando?(s.caindo?.5+Math.sin(Jogo.tempoTotal*30)*.3:.75):.9;
      g.fillRect(s.x,s.y,s.w,5);
      g.globalAlpha=.16;g.fillRect(s.x,s.y+5,s.w,9);
      g.globalAlpha=1;
      if(s.h>60){
        const gr=g.createLinearGradient(0,s.y,0,s.y+Math.min(s.h,150));
        gr.addColorStop(0,'rgba(0,0,0,0)');
        gr.addColorStop(1,'rgba(0,0,0,.34)');
        g.fillStyle=gr;
        g.fillRect(s.x,s.y,s.w,Math.min(s.h,150));
        /* pedrinhas: quebram a superfície lisa */
        g.fillStyle='rgba(255,255,255,.05)';
        for(let i=0;i<s.w;i+=37){
          const k=(s.x+i)|0;
          g.fillRect(s.x+i+(k%13),s.y+26+(k%41),13,4);
          g.fillRect(s.x+i+(k%23),s.y+62+(k%29),8,3);
        }
      }
      if(s.movel){
        g.fillStyle='rgba(255,255,255,.22)';
        for(let i=8;i<s.w-8;i+=22)g.fillRect(s.x+i,s.y+9,10,3);
      }
      if(!s.movel&&!s.quebrando&&s.h>60){
        g.fillStyle='rgba(0,0,0,.16)';
        for(let i=0;i<s.w;i+=48)g.fillRect(s.x+i,s.y+24,44,3);
      }
    }
  },

  portao(g,s){
    const pt=Mundo.portao;
    const selado=pt&&pt.selado;
    /* batente de pedra dos dois lados, como nas portas de fim de fase */
    g.fillStyle=this.mistura(this.faseAtual.chao,'#000000',.5);
    g.fillRect(s.x-12,s.y,12,s.h);
    g.fillRect(s.x+s.w,s.y,12,s.h);
    g.fillStyle='#1B1038';
    g.fillRect(s.x,s.y,s.w,s.h);
    /* grades */
    g.fillStyle=selado?'#FF5470':'#C99BFF';
    g.globalAlpha=.75;
    for(let i=0;i<3;i++)g.fillRect(s.x+7+i*13,s.y+10,5,s.h-20);
    g.globalAlpha=1;
    g.fillStyle=selado?'#FF5470':'#C99BFF';
    g.fillRect(s.x-6,s.y,s.w+12,10);
    for(let y=s.y+40;y<s.y+s.h;y+=70)g.fillRect(s.x-3,y,s.w+6,6);
    if(!selado){
      /* letras que faltam, na altura dos olhos */
      const base=s.y+s.h-190;
      g.font='900 15px Arial Black,system-ui,sans-serif';
      g.textAlign='center';
      for(let i=0;i<PALAVRA.length;i++){
        const lx=s.x+s.w/2, ly=base+i*30;
        const tem=Jogo.letras.has(i);
        g.fillStyle=tem?'#FFC53D':'rgba(199,190,230,.18)';
        g.beginPath();
        g.roundRect?g.roundRect(lx-12,ly-12,24,24,5):g.rect(lx-12,ly-12,24,24);
        g.fill();
        g.fillStyle=tem?'#1b0733':'rgba(199,190,230,.5)';
        g.textBaseline='middle';
        g.fillText(PALAVRA[i],lx,ly+1);
        g.textBaseline='alphabetic';
      }
      g.textAlign='left';
    }
  },

  perigos(g){
    for(const p of Mundo.perigos){
      if(p.x+p.w<Cam.ox-60||p.x>Cam.ox+Vista.larg+60)continue;
      g.fillStyle='#FF5470';
      for(let i=0;i<p.w;i+=20){
        g.beginPath();
        g.moveTo(p.x+i,p.y+p.h);g.lineTo(p.x+i+10,p.y);g.lineTo(p.x+i+20,p.y+p.h);
        g.closePath();g.fill();
      }
    }
  },

  checkpoints(g){
    for(const c of Mundo.checkpoints){
      if(c.x<Cam.ox-80||c.x>Cam.ox+Vista.larg+80)continue;
      g.fillStyle='rgba(255,255,255,.28)';
      g.fillRect(c.x+10,c.y,6,c.h);
      const on=c.ativo;
      g.fillStyle=on?'#43E098':'rgba(199,190,230,.35)';
      const ond=on?Math.sin(c.anim*3)*4:0;
      g.beginPath();
      g.moveTo(c.x+16,c.y+6);g.lineTo(c.x+62+ond,c.y+18);g.lineTo(c.x+16,c.y+34);
      g.closePath();g.fill();
      if(on){
        g.fillStyle='rgba(67,224,152,.18)';
        g.beginPath();g.arc(c.x+13,c.y+20,26+Math.sin(c.anim*2)*4,0,Math.PI*2);g.fill();
      }
    }
  },

  saida(g){
    const s=Mundo.saida;
    if(!s||s.x<Cam.ox-200||s.x>Cam.ox+Vista.larg+200)return;
    const f=this.faseAtual;
    const aberta=s.aberta;
    const pu=Math.sin(s.anim*2.6)*.5+.5;
    const cx=s.x+s.w/2, base=s.y+s.h;

    /* --- luz que escapa da fresta --- */
    if(aberta){
      const luz=g.createRadialGradient(cx,s.y+s.h*.45,10,cx,s.y+s.h*.45,150+pu*22);
      luz.addColorStop(0,'rgba(255,229,150,.5)');
      luz.addColorStop(.45,'rgba(255,197,61,.18)');
      luz.addColorStop(1,'rgba(255,197,61,0)');
      g.fillStyle=luz;
      g.beginPath();g.arc(cx,s.y+s.h*.45,150+pu*22,0,Math.PI*2);g.fill();
      /* facho no chão */
      g.globalAlpha=.3+pu*.14;
      g.fillStyle='#FFC53D';
      g.beginPath();
      g.moveTo(s.x+6,base);g.lineTo(s.x+s.w-6,base);
      g.lineTo(s.x+s.w+42,base+22);g.lineTo(s.x-42,base+22);
      g.closePath();g.fill();
      g.globalAlpha=1;
    }

    /* --- batente de pedra --- */
    const bx=s.x-13, bw=s.w+26;
    g.fillStyle=this.mistura(f.chao,'#000000',.45);
    g.fillRect(bx,s.y-16,bw,s.h+16);
    g.fillStyle=this.mistura(f.chao,'#ffffff',.1);
    g.fillRect(bx,s.y-16,bw,7);
    /* pilastras */
    g.fillStyle=this.mistura(f.chao,'#000000',.62);
    g.fillRect(bx,s.y-9,11,s.h+9);
    g.fillRect(bx+bw-11,s.y-9,11,s.h+9);
    /* vão da porta */
    g.fillStyle=aberta?'#1a1206':'#150C2C';
    g.fillRect(s.x,s.y-4,s.w,s.h+4);

    if(aberta){
      /* luz de dentro, com degradê para o alto */
      const dentro=g.createLinearGradient(0,base,0,s.y-4);
      dentro.addColorStop(0,'#FFE8A8');
      dentro.addColorStop(.55,'#FFC53D');
      dentro.addColorStop(1,'rgba(255,197,61,.25)');
      g.fillStyle=dentro;
      g.fillRect(s.x+4,s.y,s.w-8,s.h);
      /* silhueta de alguém esperando do outro lado */
      g.fillStyle='rgba(30,16,58,.5)';
      const bob=Math.sin(s.anim*1.6)*1.5;
      g.beginPath();g.arc(cx,base-40+bob,8,0,Math.PI*2);g.fill();
      g.fillRect(cx-9,base-32+bob,18,26);
      /* partículas subindo na luz */
      for(let i=0;i<5;i++){
        const t=(s.anim*.5+i*.2)%1;
        g.globalAlpha=(1-t)*.6;
        g.fillStyle='#FFF3CE';
        g.fillRect(s.x+9+((i*17)%(s.w-20)),base-t*s.h,3,3);
      }
      g.globalAlpha=1;
      /* placa SEGUIR */
      g.fillStyle='#160d2e';
      g.fillRect(cx-30,s.y-30,60,20);
      g.fillStyle='#FFC53D';
      g.font='700 12px system-ui,sans-serif';
      g.textAlign='center';
      g.fillText('SEGUIR',cx,s.y-16);
      g.textAlign='left';
    }else{
      /* fechada: duas folhas de madeira com as letras que faltam */
      g.fillStyle='#2E2140';
      g.fillRect(s.x+3,s.y,s.w/2-4,s.h-2);
      g.fillRect(s.x+s.w/2+1,s.y,s.w/2-4,s.h-2);
      g.fillStyle='rgba(0,0,0,.3)';
      for(let i=1;i<4;i++){
        g.fillRect(s.x+3,s.y+i*(s.h/4),s.w/2-4,3);
        g.fillRect(s.x+s.w/2+1,s.y+i*(s.h/4),s.w/2-4,3);
      }
      /* tranca com as quatro letras */
      g.fillStyle='#160d2e';
      g.fillRect(s.x-4,s.y+s.h*.42,s.w+8,30);
      g.font='900 12px Arial Black,system-ui,sans-serif';
      g.textAlign='center';g.textBaseline='middle';
      for(let i=0;i<PALAVRA.length;i++){
        const lx=s.x+9+i*((s.w-18)/3), ly=s.y+s.h*.42+15;
        const tem=Jogo.letras.has(i);
        g.fillStyle=tem?'#FFC53D':'#3A2C56';
        g.fillRect(lx-7,ly-9,14,18);
        g.fillStyle=tem?'#1b0733':'#6B5A8C';
        g.fillText(PALAVRA[i],lx,ly+1);
      }
      g.textAlign='left';g.textBaseline='alphabetic';
      /* aldrava */
      g.strokeStyle='#6B5A8C';g.lineWidth=3;
      g.beginPath();g.arc(cx,s.y+s.h*.72,7,0,Math.PI);g.stroke();
    }
  },

  itens(g){
    for(const it of Mundo.itens){
      if(it.x<Cam.ox-60||it.x>Cam.ox+Vista.larg+60)continue;
      const cx=it.x+it.w/2, cy=it.y+it.h/2;
      if(it.tipo==='letra'){
        const pulso=Math.sin(it.anim*3)*.5+.5;
        g.globalAlpha=.18+pulso*.22;
        g.fillStyle='#FFC53D';
        g.beginPath();g.arc(cx,cy,30+pulso*7,0,Math.PI*2);g.fill();
        g.globalAlpha=1;
        /* plaquinha com a letra */
        g.fillStyle='#1B4FD8';
        g.beginPath();
        g.roundRect?g.roundRect(it.x,it.y,it.w,it.h,7):g.rect(it.x,it.y,it.w,it.h);
        g.fill();
        g.fillStyle='#FFC53D';
        g.fillRect(it.x,it.y,it.w,5);
        g.fillStyle='#F4F1FF';
        g.font='900 26px '+'Arial Black,system-ui,sans-serif';
        g.textAlign='center';g.textBaseline='middle';
        g.fillText(it.letra,cx,cy+3);
        g.textAlign='left';g.textBaseline='alphabetic';
      }else{
        g.fillStyle='#43E098';
        this.coracao(g,cx,cy,12);
        g.fillStyle='rgba(255,255,255,.5)';
        g.beginPath();g.arc(cx-4,cy-4,2.6,0,Math.PI*2);g.fill();
      }
    }
  },

  coracao(g,x,y,r){
    g.beginPath();
    g.moveTo(x,y+r*.75);
    g.bezierCurveTo(x-r*1.3,y-r*.35,x-r*.42,y-r*1.15,x,y-r*.4);
    g.bezierCurveTo(x+r*.42,y-r*1.15,x+r*1.3,y-r*.35,x,y+r*.75);
    g.closePath();g.fill();
  },

  npcs(g){
    for(const n of Mundo.npcs){
      if(n.x<Cam.ox-120||n.x>Cam.ox+Vista.larg+120)continue;
      const v=n.visual||{tipo:'adulta',pele:'#E8B78F',cabelo:'#3A2016',roupa:'#43E098',roupa2:'#1E8C5C',extra:''};
      const bob=Math.sin(n.anim*1.9)*2.2;
      const gesto=Math.sin(n.anim*1.4);
      const cx=n.x+n.w/2, base=n.y+n.h;
      /* proporção por tipo */
      const alt={idosa:.9,adulta:1,jovem:.94,crianca:.78}[v.tipo]||1;
      const quad=base-24*alt-bob, omb=base-40*alt-bob, cabY=base-52*alt-bob;
      const rCab=9.2*(v.tipo==='crianca'?.94:1);

      g.fillStyle='rgba(0,0,0,.26)';
      g.beginPath();g.ellipse(cx,base+3,15,4.6,0,0,Math.PI*2);g.fill();

      /* pernas */
      g.fillStyle='#2B3A6B';
      g.fillRect(cx-8,quad,7,base-quad);
      g.fillRect(cx+1,quad,7,base-quad);
      g.fillStyle='#3A3348';
      g.fillRect(cx-9,base-4,9,4);g.fillRect(cx,base-4,9,4);

      /* braço de trás */
      const bx=v.tipo==='idosa'?.35:.8;
      this.membroEntre(g,cx-9,omb+2,cx-12,omb+15+gesto*2*bx,5.4,v.pele);

      /* tronco */
      g.fillStyle=v.roupa;
      g.beginPath();
      g.moveTo(cx-9,omb-1);g.lineTo(cx+9,omb-1);
      g.lineTo(cx+10.5,quad+2);g.lineTo(cx-10.5,quad+2);
      g.closePath();g.fill();
      g.fillStyle=v.roupa2;
      g.fillRect(cx-9,omb-1,18,3.4);
      g.fillRect(cx-10.5,quad-3,21,5);

      /* acessórios de roupa */
      if(v.extra==='avental'){
        g.fillStyle='#F4F1FF';
        g.fillRect(cx-6,omb+4,12,quad-omb-1);
        g.fillStyle=v.roupa2;
        g.fillRect(cx-6,omb+4,12,2);
      }
      if(v.extra==='jaleco'){
        g.fillStyle='#F4F1FF';
        g.beginPath();
        g.moveTo(cx-10,omb);g.lineTo(cx-3,omb);g.lineTo(cx-3,quad+3);g.lineTo(cx-11,quad+3);
        g.closePath();g.fill();
        g.beginPath();
        g.moveTo(cx+10,omb);g.lineTo(cx+3,omb);g.lineTo(cx+3,quad+3);g.lineTo(cx+11,quad+3);
        g.closePath();g.fill();
      }
      if(v.extra==='cracha'){
        g.strokeStyle='rgba(231,225,250,.85)';g.lineWidth=1.3;
        g.beginPath();g.moveTo(cx-3,omb+1);g.lineTo(cx-4,omb+9);g.stroke();
        g.fillStyle='#FFC53D';
        g.fillRect(cx-7,omb+9,7,5);
        g.fillStyle='#1B4FD8';g.fillRect(cx-7,omb+9,7,1.6);
      }

      /* cabeça */
      g.fillStyle=v.pele;
      g.beginPath();g.arc(cx,cabY,rCab,0,Math.PI*2);g.fill();
      /* cabelo por tipo */
      g.fillStyle=v.cabelo;
      if(v.tipo==='idosa'){
        g.beginPath();g.arc(cx,cabY-1,rCab+1.4,Math.PI,0);g.fill();
        g.beginPath();g.arc(cx,cabY-rCab-1,4.6,0,Math.PI*2);g.fill();   /* coque */
      }else if(v.tipo==='crianca'){
        g.beginPath();g.arc(cx,cabY-1,rCab+.8,Math.PI,0);g.fill();
        g.fillRect(cx-rCab-.8,cabY-3,rCab*2+1.6,4);
      }else{
        g.beginPath();g.arc(cx,cabY-1,rCab+1,Math.PI,0);g.fill();
        g.fillRect(cx-rCab-1,cabY-3,rCab*2+2,5);
        g.beginPath();g.arc(cx-rCab*.85,cabY+3,3.4,0,Math.PI*2);g.fill();
        g.beginPath();g.arc(cx+rCab*.85,cabY+3,3.4,0,Math.PI*2);g.fill();
      }
      if(v.extra==='lenco'){
        g.fillStyle=v.roupa2;
        g.beginPath();g.arc(cx,cabY-1,rCab+2,Math.PI,0);g.fill();
        g.beginPath();
        g.moveTo(cx+rCab,cabY-1);g.lineTo(cx+rCab+7,cabY+7);g.lineTo(cx+rCab-2,cabY+4);
        g.closePath();g.fill();
      }
      if(v.extra==='bone'){
        g.fillStyle=v.roupa2;
        g.beginPath();g.arc(cx,cabY-2,rCab+1,Math.PI,0);g.fill();
        g.fillRect(cx-2,cabY-3,rCab+9,3.4);
      }
      if(v.extra==='boina'){
        g.fillStyle=v.roupa2;
        g.beginPath();g.ellipse(cx,cabY-rCab+1,rCab+2,4,0,0,Math.PI*2);g.fill();
      }

      /* rosto */
      g.fillStyle='#120A2A';
      const p2=(Jogo.tempoTotal*1.3+n.anim)%4.2<.12;
      if(p2){
        g.fillRect(cx-4.6,cabY+1.4,3.2,1.5);
        g.fillRect(cx+1.4,cabY+1.4,3.2,1.5);
      }else{
        g.fillRect(cx-4.6,cabY-.4,3,3.6);
        g.fillRect(cx+1.6,cabY-.4,3,3.6);
      }
      g.fillStyle='#B5615E';
      g.beginPath();g.arc(cx,cabY+4.6,2.6,.2,Math.PI-.2);g.fill();
      if(v.extra==='oculos'){
        g.strokeStyle='rgba(20,14,40,.85)';g.lineWidth=1.5;
        g.beginPath();g.arc(cx-3,cabY+.8,4,0,Math.PI*2);g.stroke();
        g.beginPath();g.arc(cx+3.4,cabY+.8,4,0,Math.PI*2);g.stroke();
        g.beginPath();g.moveTo(cx+1,cabY+.8);g.lineTo(cx-.6,cabY+.8);g.stroke();
      }

      /* braço da frente, gesticulando enquanto fala */
      const g2=n.falou?gesto*.4:gesto;
      this.membroEntre(g,cx+9,omb+2,cx+13+g2*3,omb+14-Math.abs(g2)*5,5.8,v.pele);

      /* nome de quem é, quando você chega perto: sem isso ninguém sabe
         que aquele ali é o irmão dela */
      const dPerto=Math.abs((Jog.x+Jog.w/2)-cx);
      if(dPerto<230&&FALAS[n.id]){
        const nome=FALAS[n.id].quem.split('·')[0].trim();
        const fade=clamp(1-(dPerto-120)/110,0,1);
        g.save();
        g.globalAlpha=fade;
        g.font='700 12px system-ui,sans-serif';
        g.textAlign='center';
        const larg=g.measureText(nome).width+16;
        g.fillStyle='rgba(18,10,42,.88)';
        g.fillRect(cx-larg/2,cabY-rCab-42+bob,larg,17);
        g.fillStyle='#F4F1FF';
        g.fillText(nome,cx,cabY-rCab-30+bob);
        g.textAlign='left';
        g.restore();
      }
      /* balão de conversa */
      if(!n.falou){
        const pu=Math.sin(n.anim*3)*.5+.5;
        g.globalAlpha=.6+pu*.4;
        g.fillStyle='#FFC53D';
        g.beginPath();
        g.roundRect?g.roundRect(cx-13,cabY-rCab-26+bob*.4,26,17,6):g.rect(cx-13,cabY-rCab-26,26,17);
        g.fill();
        g.beginPath();
        g.moveTo(cx-4,cabY-rCab-10+bob*.4);g.lineTo(cx+1,cabY-rCab-4+bob*.4);g.lineTo(cx+5,cabY-rCab-10+bob*.4);
        g.closePath();g.fill();
        g.fillStyle='#120A2A';
        for(let i=0;i<3;i++)g.fillRect(cx-8+i*6,cabY-rCab-19+bob*.4,3.4,3.4);
        g.globalAlpha=1;
      }
    }
  },

  /* Vida em blocos: lê melhor que barra contínua em bichos de 1 a 4 pontos.
     Aparece ao levar dano, quando a guarda barra o golpe, ou o tempo todo
     em quem tem mais de um ponto de vida. */
  barraVida(g,e){
    const t=e.def;
    const guarda=(t.blindaFechado&&!e.aberto)||(t.protegido&&plateiaViva(e)>0)||
                 t.soVozForte||(t.fantasma&&e.solidez<.6)||
                 (e.tipo==='cobranca'&&e.estado!=='exposta');
    const vis=e.vidaMostra>0?1:(e.vidaMax>1?.62:.42);
    const n=e.vidaMax, larg=Math.max(26,Math.min(e.w+10,n*13));
    const bw=larg/n, bh=5;
    const bx=e.x+e.w/2-larg/2, by=e.y-15;
    g.save();
    g.globalAlpha=vis;
    g.fillStyle='rgba(12,8,26,.75)';
    g.beginPath();
    g.roundRect?g.roundRect(bx-2.5,by-2.5,larg+5,bh+5,3.5):g.rect(bx-2.5,by-2.5,larg+5,bh+5);
    g.fill();
    for(let i=0;i<n;i++){
      g.fillStyle=i<e.vida?(e.vida<=1?'#FF5470':(e.vida<=2?'#FFC53D':'#43E098')):'rgba(199,190,230,.2)';
      g.fillRect(bx+i*bw+1,by,bw-2,bh);
    }
    if(guarda){
      const gx=bx+larg+9, gy=by+bh/2;
      g.fillStyle='#C7BEE6';
      g.fillRect(gx-4,gy-1,8,7);
      g.strokeStyle='#C7BEE6';g.lineWidth=1.8;
      g.beginPath();g.arc(gx,gy-1,2.6,Math.PI,0);g.stroke();
    }
    g.restore();
  },

  inimigos(g){
    for(const e of Mundo.inimigos){
      if(e.x+e.w<Cam.ox-140||e.x>Cam.ox+Vista.larg+140)continue;
      g.save();
      if(!e.vivo){
        g.globalAlpha=Math.max(0,e.morte/.5);
        g.translate(0,(1-e.morte/.5)*24);
      }
      this.corpoInimigo(g,e);
      g.restore();
      if(e.vivo)this.barraVida(g,e);
    }
  },

  /* O desenho de um inimigo, isolado do laço — assim o mesmo código
     serve para o jogo e para os retratos da Cartilha. */
  corpoInimigo(g,e){
    const pisca=e.piscar>0&&Math.floor(e.piscar*40)%2===0;
    const c1=pisca?'#FFFFFF':e.def.cor;
    const c2=pisca?'#FFFFFF':e.def.cor2;
    const x=e.x,y=e.y,w=e.w,h=e.h,cx=x+w/2,cy=y+h/2;
    if(e.squash!==1){
      g.translate(cx,y+h);
      g.scale(1/Math.max(.5,e.squash),e.squash);
      g.translate(-cx,-(y+h));
    }
    if(!e.def.voa&&e.tipo!=='muro'&&!e.semSombra){
      g.fillStyle='rgba(0,0,0,.24)';
      g.beginPath();g.ellipse(cx,y+h+3,w*.45,5,0,0,Math.PI*2);g.fill();
    }
    if(e.atordoado>0){
      g.globalAlpha*=.85;
      for(let i=0;i<3;i++){
        const a=e.anim*7+i*2.1;
        g.fillStyle='#FFC53D';
        g.fillRect(cx+Math.cos(a)*20-2,y-12+Math.sin(a)*5,4,4);
      }
    }
      switch(e.tipo){
        case 'piada':{
          const bal=Math.sin(e.anim*9)*2;
          const pas=Math.sin(e.anim*9);
          const bh=h-12;                       /* altura do balão */
          /* perninhas embaixo do balão */
          g.strokeStyle='#7A4A18';g.lineWidth=3.4;g.lineCap='round';
          for(const sg of[-1,1]){
            g.beginPath();
            g.moveTo(cx+sg*8,y+bh-2+bal);
            g.lineTo(cx+sg*8+pas*sg*4,y+h+2);
            g.stroke();
          }
          g.save();
          g.translate(0,bal);
          /* rabinho do balão, desenhado antes pra encostar direito */
          g.fillStyle=c1;
          g.beginPath();
          g.moveTo(cx-e.dir*4,y+bh-8);
          g.lineTo(cx-e.dir*15,y+bh+9);
          g.lineTo(cx+e.dir*7,y+bh-4);
          g.closePath();g.fill();
          /* corpo do balão */
          g.beginPath();
          g.roundRect?g.roundRect(x,y,w,bh,13):g.rect(x,y,w,bh);
          g.fillStyle=c1;g.fill();
          g.strokeStyle='#7A3F0C';g.lineWidth=2.6;g.stroke();
          /* "HÁ HÁ" escrito dentro, é isso que faz ler como piada */
          g.fillStyle=c2;
          g.font='900 15px Arial Black,system-ui,sans-serif';
          g.textAlign='center';g.textBaseline='middle';
          g.fillText('HÁ HÁ',cx,y+bh*.42+Math.abs(bal)*.5);
          g.textAlign='left';g.textBaseline='alphabetic';
          /* boca rindo pequena embaixo do texto */
          g.fillStyle='#7A3F0C';
          g.beginPath();
          g.ellipse(cx,y+bh*.76,8,3.4+Math.abs(bal)*.5,0,0,Math.PI*2);
          g.fill();
          g.restore();
          break;
        }
        case 'rotulo':{
          const ab=e.aberto, tp=e.tampa;
          /* caixa */
          g.fillStyle=c1;
          g.fillRect(x+3,y+12,w-6,h-12);
          g.fillStyle='rgba(0,0,0,.22)';
          g.fillRect(x+3,y+12,w-6,4);
          g.fillStyle='rgba(0,0,0,.14)';
          g.fillRect(x+3,y+h-9,w-6,6);
          /* tampa: gira em vez de pular de estado */
          g.save();
          g.translate(x+3,y+13);
          g.rotate(-1.05*tp);
          g.fillStyle=c2;
          g.fillRect(0,-11,w-6,12);
          g.fillStyle='rgba(255,255,255,.22)';
          g.fillRect(0,-11,w-6,3);
          g.restore();
          /* etiqueta */
          g.fillStyle=ab?'rgba(244,241,255,.9)':'#F4F1FF';
          g.fillRect(x+9,y+24,w-18,13);
          g.fillStyle='#5A3A1A';
          for(let i=0;i<3;i++)g.fillRect(x+12,y+27+i*4,w-24-(i===2?8:0),2);
          if(!ab){
            g.strokeStyle='#FFC53D';g.lineWidth=2.4;
            g.beginPath();g.arc(cx,y+8,7,0,Math.PI*2);g.stroke();
          }
          break;
        }
        case 'comentario':{
          const mergulha=e.estado==='mergulha';
          const esticaY=mergulha?1.2:1, esticaX=mergulha?.85:1;
          g.save();
          g.translate(cx,cy);g.scale(esticaX,esticaY);g.translate(-cx,-cy);
          g.fillStyle=c1;
          g.beginPath();
          g.roundRect?g.roundRect(x,y,w,h-8,10):g.rect(x,y,w,h-8);
          g.fill();
          g.beginPath();
          g.moveTo(cx-8,y+h-9);g.lineTo(cx-1,y+h);g.lineTo(cx+6,y+h-9);
          g.closePath();g.fill();
          /* cara raivosa */
          g.fillStyle=c2;
          for(const s of[-1,1]){
            g.save();
            g.translate(cx+s*9,y+16);g.rotate(s*.42);
            g.fillRect(-5,-2,10,4);
            g.restore();
          }
          g.strokeStyle=c2;g.lineWidth=3;g.lineCap='round';
          g.beginPath();g.arc(cx,y+32,8,Math.PI*1.15,Math.PI*1.85);g.stroke();
          g.restore();
          if(e.alerta>0){
            const f=e.alerta/.45;
            g.globalAlpha=f;
            g.fillStyle='#FF5470';
            g.font='900 22px Arial Black,system-ui,sans-serif';
            g.textAlign='center';
            g.fillText('!',cx,y-14-(1-f)*10);
            g.textAlign='left';
            g.globalAlpha=1;
          }
          if(mergulha){
            g.strokeStyle='rgba(255,84,112,.5)';g.lineWidth=2;g.setLineDash([5,6]);
            g.beginPath();g.moveTo(cx,y+h);g.lineTo(cx,y+h+60);g.stroke();
            g.setLineDash([]);
          }
          break;
        }
        case 'seguidor':{
          g.fillStyle=c1;
          g.beginPath();g.arc(cx,cy,w/2,0,Math.PI*2);g.fill();
          g.fillStyle=c2;
          g.beginPath();g.arc(cx,cy-2,w/2-4,0,Math.PI*2);g.fill();
          g.fillStyle='#0B1030';
          g.fillRect(cx-6,cy-3,3,4);g.fillRect(cx+3,cy-3,3,4);
          g.fillRect(cx-4,cy+4,8,2);
          break;
        }
        case 'alfa':{
          const plateia=plateiaViva(e);
          g.fillStyle=c1;
          g.fillRect(x+6,y+20,w-12,h-20);
          /* ombros exagerados */
          g.fillStyle=c2;
          g.fillRect(x,y+22,w,10);
          /* cabeça */
          g.fillStyle='#C99070';
          g.beginPath();g.arc(cx,y+14,14,0,Math.PI*2);g.fill();
          /* boné */
          g.fillStyle=c1;
          g.beginPath();g.arc(cx,y+12,14,Math.PI,Math.PI*2);g.fill();
          g.fillRect(cx-14+(e.dir>0?12:-12),y+10,16,4);
          /* óculos escuros */
          g.fillStyle='#0B1030';
          g.fillRect(cx-12,y+13,24,6);
          if(plateia){
            g.strokeStyle='rgba(255,197,61,.75)';g.lineWidth=2;
            g.beginPath();g.arc(cx,cy,46+Math.sin(e.anim*3)*4,0,Math.PI*2);g.stroke();
          }else if(!e.emRetrato){
            g.fillStyle='rgba(255,84,112,.9)';
            g.font='700 11px system-ui,sans-serif';
            g.textAlign='center';
            g.fillText('sozinho',cx,y-8);
            g.textAlign='left';
          }
          break;
        }
        case 'ciume':{
          const cego=e.estado==='cego';
          const pulsa=cego?1+Math.sin(e.anim*11)*.07:1;
          g.save();
          g.translate(cx,cy);g.scale(pulsa,pulsa);g.translate(-cx,-cy);
          /* espinhos no topo: aviso de que não dá pra pisar */
          g.fillStyle=cego?'#FF5470':c2;
          for(let i=0;i<5;i++){
            const sx=x+5+i*((w-10)/4);
            g.beginPath();
            g.moveTo(sx-5,y+13);g.lineTo(sx,y-4);g.lineTo(sx+5,y+13);
            g.closePath();g.fill();
          }
          g.fillStyle=cego?'#8C1F42':c1;
          g.beginPath();
          g.moveTo(cx,y+10);
          g.bezierCurveTo(x+w+6,y+22,x+w-4,y+h,cx,y+h);
          g.bezierCurveTo(x+4,y+h,x-6,y+22,cx,y+10);
          g.closePath();g.fill();
          /* olho grande */
          g.fillStyle='#F4F1FF';
          g.beginPath();g.ellipse(cx,y+h*.52,12,cego?12:9,0,0,Math.PI*2);g.fill();
          g.fillStyle=cego?'#FF5470':'#3A0F22';
          g.beginPath();g.arc(cx+(cego?sign(Jog.x-e.x)*3:0),y+h*.52,cego?7:5,0,Math.PI*2);g.fill();
          g.restore();
          if(cego){
            g.globalAlpha=.2;g.fillStyle='#FF5470';
            g.beginPath();g.arc(cx,cy,38+Math.sin(e.anim*9)*6,0,Math.PI*2);g.fill();
            g.globalAlpha=1;
          }
          break;
        }
        case 'cobranca':{
          const exp=e.estado==='exposta', mira=e.estado==='mira';
          const tr=mira?Math.sin(e.anim*22)*2:0;
          /* prancheta */
          g.fillStyle=exp?'#7A3A22':c1;
          g.fillRect(x+4+tr,y+12,w-8,h-12);
          g.fillStyle='#F4F1FF';
          g.fillRect(x+9+tr,y+20,w-18,h-26);
          g.fillStyle='#9A9AB0';
          for(let i=0;i<3;i++)g.fillRect(x+13+tr,y+26+i*8,w-26-(i===2?9:0),2.6);
          g.fillStyle=c2;
          g.fillRect(x+11+tr,y+7,w-22,8);
          /* dedo em riste */
          g.save();
          g.translate(cx+e.dir*(w*.42)+tr,y+8);
          g.rotate(e.dir>0?(mira?-.5:-.2):(mira?.5:.2));
          g.fillStyle='#E8B78F';
          g.beginPath();
          g.roundRect?g.roundRect(-4,-16,8,18,4):g.rect(-4,-16,8,18);
          g.fill();
          g.restore();
          /* sobrancelha brava */
          g.strokeStyle='#3A1B08';g.lineWidth=3;g.lineCap='round';
          g.beginPath();
          g.moveTo(cx-11,y+2);g.lineTo(cx-2,y+6);
          g.moveTo(cx+11,y+2);g.lineTo(cx+2,y+6);
          g.stroke();
          if(mira){
            g.fillStyle='#FF5470';
            g.font='900 20px Arial Black,system-ui,sans-serif';
            g.textAlign='center';
            g.fillText('!',cx,y-10);
            g.textAlign='left';
          }
          if(exp){
            g.globalAlpha=.35+Math.sin(e.anim*10)*.2;
            g.fillStyle='#43E098';
            g.beginPath();g.arc(cx,cy,30,0,Math.PI*2);g.fill();
            g.globalAlpha=1;
          }
          break;
        }
        case 'turma':{
          const bal=Math.sin(e.anim*11)*2;
          const corr=e.pressa>0;
          const cb=corr?'#FF5470':c1;
          /* pernas */
          g.strokeStyle=cb;g.lineWidth=3.2;g.lineCap='round';
          for(const sg of[-1,1]){
            g.beginPath();
            g.moveTo(cx+sg*5,y+h-9);
            g.lineTo(cx+sg*5+Math.sin(e.anim*11+sg)*3,y+h);
            g.stroke();
          }
          /* corpo */
          g.fillStyle=cb;
          g.beginPath();
          g.roundRect?g.roundRect(x+6,y+15+bal,w-12,h-24,5):g.rect(x+6,y+15+bal,w-12,h-24);
          g.fill();
          /* bracinhos apontando */
          g.strokeStyle=cb;g.lineWidth=3;
          g.beginPath();
          g.moveTo(x+6,y+19+bal);g.lineTo(x-1+e.dir*3,y+25+bal);
          g.moveTo(x+w-6,y+19+bal);g.lineTo(x+w+1+e.dir*3,y+25+bal);
          g.stroke();
          /* cabeça rindo */
          g.fillStyle=c2;
          g.beginPath();g.arc(cx,y+11+bal,9.5,0,Math.PI*2);g.fill();
          g.fillStyle='#1B2A22';
          g.beginPath();g.arc(cx-3.6,y+9+bal,1.8,0,Math.PI*2);g.fill();
          g.beginPath();g.arc(cx+3.6,y+9+bal,1.8,0,Math.PI*2);g.fill();
          g.strokeStyle='#1B2A22';g.lineWidth=2;
          g.beginPath();g.arc(cx,y+12+bal,4.2,.18,Math.PI-.18);g.stroke();
          if(corr){
            g.globalAlpha=.55;
            g.fillStyle='#FF5470';
            for(let i=1;i<=2;i++)g.fillRect(cx-e.dir*(12+i*7),y+20,6,3);
            g.globalAlpha=1;
          }
          break;
        }
        case 'bot':{
          const gira=Math.sin(e.anim*3)*.16;
          g.save();
          g.translate(cx,cy);g.rotate(gira);
          g.fillStyle=c1;
          g.beginPath();
          g.roundRect?g.roundRect(-w/2,-h/2,w,h,7):g.rect(-w/2,-h/2,w,h);
          g.fill();
          g.strokeStyle=c2;g.lineWidth=2;
          g.beginPath();
          g.roundRect?g.roundRect(-w/2+3,-h/2+3,w-6,h-6,5):g.rect(-w/2+3,-h/2+3,w-6,h-6);
          g.stroke();
          /* carinha de tela */
          g.fillStyle=c2;
          g.fillRect(-8,-5,4,4);g.fillRect(4,-5,4,4);
          g.fillRect(-6,4,12,2.4);
          /* setas de repetição */
          g.strokeStyle='rgba(127,196,255,.8)';g.lineWidth=2;
          g.beginPath();g.arc(0,0,w*.62,-1.1,1.1);g.stroke();
          g.beginPath();g.arc(0,0,w*.62,Math.PI-1.1,Math.PI+1.1);g.stroke();
          g.restore();
          /* barra de quanto falta pra copiar */
          if(e.copias<2&&!e.emRetrato){
            const f2=1-clamp(e.timer/5,0,1);
            g.fillStyle='rgba(12,8,26,.6)';
            g.fillRect(x,y+h+3,w,3);
            g.fillStyle='#FF5470';
            g.fillRect(x,y+h+3,w*f2,3);
          }
          break;
        }
        case 'ameaca':{
          const sol=e.solidez;
          g.globalAlpha=sol;
          /* vulto */
          g.fillStyle=c1;
          g.beginPath();
          g.moveTo(cx,y);
          g.bezierCurveTo(x+w+8,y+h*.3,x+w-2,y+h,cx+Math.sin(e.anim*3)*4,y+h);
          g.bezierCurveTo(x+2,y+h,x-8,y+h*.3,cx,y);
          g.closePath();g.fill();
          /* mão erguida */
          if(sol>.7){
            g.fillStyle=this.mistura(c1,'#FFFFFF',.22);
            g.save();
            g.translate(cx+e.dir*15,y+20);g.rotate(e.dir*.5);
            g.beginPath();
            g.roundRect?g.roundRect(-5,-16,10,20,5):g.rect(-5,-16,10,20);
            g.fill();
            g.restore();
          }
          /* olhos */
          g.fillStyle=c2;
          g.globalAlpha=sol*(sol>.7?1:.5);
          g.beginPath();g.arc(cx-6+e.dir*2,y+20,3.6,0,Math.PI*2);g.fill();
          g.beginPath();g.arc(cx+6+e.dir*2,y+20,3.6,0,Math.PI*2);g.fill();
          g.globalAlpha=1;
          if(sol<.6){
            g.globalAlpha=.4;
            g.strokeStyle=c2;g.lineWidth=2;g.setLineDash([4,5]);
            g.strokeRect(x+2,y+2,w-4,h-4);
            g.setLineDash([]);
            g.globalAlpha=1;
          }
          break;
        }
        case 'muro':{
          g.fillStyle=c1;
          g.fillRect(x,y,w,h);
          /* tijolos */
          g.fillStyle='rgba(0,0,0,.22)';
          for(let r=0;r<Math.floor(h/18);r++){
            g.fillRect(x,y+r*18+16,w,2.5);
            const off=(r%2)?0:w/2;
            g.fillRect(x+off,y+r*18,2.5,18);
          }
          g.fillStyle=c2;
          g.fillRect(x,y,w,5);
          /* cara fechada, lá em cima */
          g.fillStyle='#1B1524';
          g.fillRect(x+12,y+30,10,5);g.fillRect(x+w-22,y+30,10,5);
          g.fillRect(x+14,y+52,w-28,4);
          /* rachaduras crescem com o dano */
          const dnv=1-e.vida/e.vidaMax;
          if(dnv>0){
            g.strokeStyle='rgba(255,255,255,.45)';
            g.lineWidth=2.2;g.lineCap='round';
            const n=Math.ceil(dnv*5);
            for(let i=0;i<n;i++){
              const yy=y+70+i*((h-90)/5);
              g.beginPath();
              g.moveTo(x+6,yy);
              g.lineTo(x+w*.45,yy+((i%2)?18:-16));
              g.lineTo(x+w-6,yy+((i%2)?-8:12));
              g.stroke();
            }
          }
          break;
        }
      }
  },

  /* Tira com o ciclo de corrida da Manu, em PNG. O menu anima essa tira
     com steps() no CSS — é a própria personagem do jogo, correndo na capa. */
  _folha:null,
  folhaManu(alt){
    if(this._folha)return this._folha;
    try{
      const N=10, esc=alt/72, larg=Math.round(50*esc);
      const cv=document.createElement('canvas');
      cv.width=larg*N;cv.height=alt;
      const g=cv.getContext('2d');
      const bak={};
      ['x','y','vx','vy','dir','noChao','animCaminho','esticaX','esticaY','rabo',
       'invul','vivo','vozCarga','quedaDe','piscar','semSombra'].forEach(k=>bak[k]=Jog[k]);
      const poseBak=this._pose, tBak=Jogo.tempoTotal;
      this._pose='corre';
      Object.assign(Jog,{x:0,y:0,vx:330,vy:0,dir:1,noChao:true,esticaX:1,esticaY:1,
        rabo:-10,invul:0,vivo:true,vozCarga:0,quedaDe:null,piscar:0,semSombra:true});
      for(let i=0;i<N;i++){
        Jog.animCaminho=(i/N)*(2*Math.PI/13);
        Jogo.tempoTotal=1.2+i*.04;             /* longe do instante da piscada */
        g.save();
        g.translate(i*larg+larg/2,alt-3);
        g.scale(esc,esc);
        g.translate(-(Jog.x+Jog.w/2),-(Jog.y+Jog.h));
        this.manu(g);
        g.restore();
      }
      Object.assign(Jog,bak);this._pose=poseBak;Jogo.tempoTotal=tBak;
      return this._folha={src:cv.toDataURL('image/png'),n:N,larg,alt};
    }catch(e){return null;}
  },

  /* Retrato de um inimigo em PNG, para a Cartilha. Fica em cache. */
  _retratos:{},
  retrato(tipo,lado){
    lado=lado||96;
    const k=tipo+'@'+lado;
    if(this._retratos[k])return this._retratos[k];
    try{
      const cv=document.createElement('canvas');
      cv.width=lado;cv.height=lado;
      const g2=cv.getContext('2d');
      const e=criaInimigo(tipo,0,0,{});
      if(tipo==='rotulo')e.aberto=true,e.tampa=1;
      if(tipo==='ciume')e.estado='anda';
      if(tipo==='cobranca')e.estado='mira';
      /* o muro tem 460px: no retrato mostramos só a parte de cima, onde está a cara */
      if(tipo==='muro')e.h=150;
      e.anim=1.1;e.solidez=1;e.squash=1;e.semSombra=true;e.emRetrato=true;
      /* margem generosa: vários bichos desenham fora da própria caixa
         (o dedo da Cobrança, o "HÁ HÁ" da piada) */
      const esc=Math.min((lado-34)/e.w,(lado-30)/e.h);
      e.x=0;e.y=0;
      g2.save();
      g2.translate(lado/2-e.w*esc/2,lado/2-e.h*esc/2+6);
      g2.scale(esc,esc);
      this.corpoInimigo(g2,e);
      g2.restore();
      return this._retratos[k]=cv.toDataURL('image/png');
    }catch(err){return '';}
  },

  chefe(g,b){
    if(!b.vivo)return;
    const CORES={1:['#4A2A7A','#C99BFF','#1E1038'],
                 2:['#8C2A3E','#FF5470','#3A0E1A'],
                 3:['#8C4A6B','#FF8FB0','#3A1626']};
    const [c1,c2,esc]=CORES[b.fase];
    const caido=b.estado==='caido';
    const pisca=b.piscar>0&&Math.floor(b.piscar*40)%2===0;
    const cx=b.x+b.w/2, cy=b.y+b.h/2;
    const tr=b.tremeu||0;

    /* --- marca no chão antes do baque: dá pra sair de baixo --- */
    if(b.marca!==null&&b.marca!==undefined){
      const pu=Math.sin(Jogo.tempoTotal*16)*.5+.5;
      g.save();
      g.globalAlpha=.35+pu*.35;
      g.strokeStyle='#FF5470';g.lineWidth=4;
      g.beginPath();g.ellipse(b.marca,b.chaoY-3,58,14,0,0,Math.PI*2);g.stroke();
      g.globalAlpha=.18+pu*.14;
      g.fillStyle='#FF5470';
      g.beginPath();g.ellipse(b.marca,b.chaoY-3,58,14,0,0,Math.PI*2);g.fill();
      g.restore();
    }

    /* --- a roda das três voltas: é o ciclo, desenhado --- */
    g.save();
    g.translate(cx+tr,cy);
    g.rotate(b.anel);
    const R=b.w*.78;
    for(let i=0;i<3;i++){
      const a0=-Math.PI/2+i*(Math.PI*2/3)+.11;
      const a1=a0+(Math.PI*2/3)-.22;
      const ativa=i===(b.fase-1);
      const passada=i<(b.fase-1);
      g.beginPath();
      g.arc(0,0,R,a0,a1);
      /* volta já cumprida fica marcada: dá pra ver o ciclo andando */
      g.strokeStyle=ativa?c2:(passada?'rgba(255,197,61,.5)':'rgba(199,190,230,.34)');
      g.lineWidth=ativa?9:5;
      g.stroke();
      /* bolinha em cada emenda: mostra que são três voltas */
      g.fillStyle=ativa?c2:(passada?'rgba(255,197,61,.6)':'rgba(199,190,230,.4)');
      g.beginPath();g.arc(Math.cos(a0-.11)*R,Math.sin(a0-.11)*R,4.5,0,Math.PI*2);g.fill();
      if(ativa){
        const am=(a0+a1)/2;
        g.beginPath();g.arc(Math.cos(am)*R,Math.sin(am)*R,8,0,Math.PI*2);g.fill();
        g.fillStyle='#F4F1FF';
        g.beginPath();g.arc(Math.cos(am)*R,Math.sin(am)*R,3.4,0,Math.PI*2);g.fill();
      }
    }
    g.restore();

    /* --- mãos de sombra durante os ataques --- */
    if(!caido&&(b.estado==='mira'||b.estado==='prepara'||b.estado==='investe')){
      g.save();
      g.globalAlpha=.55;
      g.fillStyle=esc;
      for(const sg of[-1,1]){
        const ex=cx+sg*(b.w*.52)+tr, ey=cy+Math.sin(b.anim*7+sg)*8;
        g.beginPath();
        g.ellipse(ex,ey,17,25,sg*.4,0,Math.PI*2);
        g.fill();
        for(let d=0;d<3;d++){
          g.beginPath();
          g.ellipse(ex+sg*(9+d*5),ey-16+d*11,5,13,sg*.7,0,Math.PI*2);
          g.fill();
        }
      }
      g.restore();
    }

    /* --- a máscara --- */
    g.save();
    g.translate(tr,0);
    g.beginPath();
    g.moveTo(cx,b.y);                                     /* topo */
    g.bezierCurveTo(b.x+b.w*1.02,b.y+b.h*.12, b.x+b.w*.94,b.y+b.h*.52, b.x+b.w*.72,b.y+b.h*.78);
    g.bezierCurveTo(b.x+b.w*.6,b.y+b.h*.95, b.x+b.w*.4,b.y+b.h*.95, b.x+b.w*.28,b.y+b.h*.78);
    g.bezierCurveTo(b.x+b.w*.06,b.y+b.h*.52, b.x-b.w*.02,b.y+b.h*.12, cx,b.y);
    g.closePath();
    g.fillStyle=pisca?'#FFFFFF':(caido?'#6B5687':c1);
    g.fill();
    g.strokeStyle=caido?'#FFC53D':esc;
    g.lineWidth=caido?5:4;
    g.stroke();
    /* volume: claro em cima, escuro embaixo */
    g.save();g.clip();
    const vol=g.createLinearGradient(0,b.y,0,b.y+b.h);
    vol.addColorStop(0,'rgba(255,255,255,.18)');
    vol.addColorStop(.5,'rgba(255,255,255,0)');
    vol.addColorStop(1,'rgba(0,0,0,.32)');
    g.fillStyle=vol;g.fillRect(b.x-10,b.y,b.w+20,b.h);
    /* maçãs do rosto */
    g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=3;
    for(const sg of[-1,1]){
      g.beginPath();
      g.moveTo(cx+sg*b.w*.3,b.y+b.h*.4);
      g.quadraticCurveTo(cx+sg*b.w*.26,b.y+b.h*.58,cx+sg*b.w*.14,b.y+b.h*.68);
      g.stroke();
    }
    g.restore();

    /* --- rosto: cada volta tem o seu --- */
    const oy=b.y+b.h*(caido?.4:.36);
    if(caido){
      g.strokeStyle='#FFC53D';g.lineWidth=6;g.lineCap='round';
      for(const sg of[-1,1]){
        g.beginPath();
        g.moveTo(cx+sg*17,oy-9);g.lineTo(cx+sg*37,oy+9);
        g.moveTo(cx+sg*17,oy+9);g.lineTo(cx+sg*37,oy-9);
        g.stroke();
      }
      g.strokeStyle='#FFC53D';g.lineWidth=6;
      g.beginPath();g.arc(cx,b.y+b.h*.78,22,Math.PI+.3,-.3);g.stroke();
      const sb=Math.sin(b.anim*9)*5;
      g.fillStyle='#FFC53D';
      g.beginPath();
      g.moveTo(cx,b.y-16+sb);g.lineTo(cx-12,b.y-34+sb);g.lineTo(cx+12,b.y-34+sb);
      g.closePath();g.fill();
    }else if(b.fase===1){
      /* TENSÃO: olhos em fenda, sobrancelha franzida, boca reta */
      g.fillStyle=esc;
      for(const sg of[-1,1]){
        g.save();
        g.translate(cx+sg*26,oy);g.rotate(sg*.26);
        g.beginPath();g.ellipse(0,0,17,5,0,0,Math.PI*2);g.fill();
        g.restore();
      }
      g.fillStyle=c2;
      for(const sg of[-1,1]){
        g.save();
        g.translate(cx+sg*26,oy);g.rotate(sg*.26);
        g.beginPath();g.ellipse(0,0,7,3.4,0,0,Math.PI*2);g.fill();
        g.restore();
      }
      g.strokeStyle=esc;g.lineWidth=6;g.lineCap='round';
      for(const sg of[-1,1]){
        g.beginPath();
        g.moveTo(cx+sg*10,oy-16);g.lineTo(cx+sg*40,oy-9);
        g.stroke();
      }
      g.strokeStyle=c2;g.lineWidth=5;
      g.beginPath();g.moveTo(cx-24,b.y+b.h*.7);g.lineTo(cx+24,b.y+b.h*.7);g.stroke();
    }else if(b.fase===2){
      /* EXPLOSÃO: olhos arregalados e boca aberta com dentes */
      for(const sg of[-1,1]){
        g.fillStyle='#F4F1FF';
        g.beginPath();g.arc(cx+sg*27,oy,14,0,Math.PI*2);g.fill();
        g.fillStyle=esc;
        g.beginPath();g.arc(cx+sg*27+sign(Jog.x-b.x)*3,oy+1,7,0,Math.PI*2);g.fill();
      }
      g.strokeStyle=esc;g.lineWidth=7;g.lineCap='round';
      for(const sg of[-1,1]){
        g.beginPath();
        g.moveTo(cx+sg*11,oy-22);g.lineTo(cx+sg*44,oy-6);
        g.stroke();
      }
      g.fillStyle=esc;
      g.beginPath();
      g.moveTo(cx-30,b.y+b.h*.63);
      g.quadraticCurveTo(cx,b.y+b.h*.93,cx+30,b.y+b.h*.63);
      g.quadraticCurveTo(cx,b.y+b.h*.72,cx-30,b.y+b.h*.63);
      g.closePath();g.fill();
      g.fillStyle='#F4F1FF';
      for(let i=0;i<4;i++){
        const tx=cx-22+i*15;
        g.beginPath();
        g.moveTo(tx,b.y+b.h*.665);g.lineTo(tx+7,b.y+b.h*.665);g.lineTo(tx+3.5,b.y+b.h*.73);
        g.closePath();g.fill();
      }
    }else{
      /* LUA DE MEL: olhos caídos de desculpa, sorriso largo e uma lágrima */
      g.strokeStyle=esc;g.lineWidth=6;g.lineCap='round';
      for(const sg of[-1,1]){
        g.beginPath();
        g.arc(cx+sg*27,oy+4,14,Math.PI*1.08,Math.PI*1.92);
        g.stroke();
      }
      g.fillStyle=c2;
      for(const sg of[-1,1]){
        g.beginPath();g.arc(cx+sg*27,oy+2,5,0,Math.PI*2);g.fill();
      }
      /* sobrancelhas subindo no meio: cara de "me perdoa" */
      g.strokeStyle=esc;g.lineWidth=5;
      for(const sg of[-1,1]){
        g.beginPath();
        g.moveTo(cx+sg*12,oy-20);g.lineTo(cx+sg*42,oy-12);
        g.stroke();
      }
      g.strokeStyle=esc;g.lineWidth=6;
      g.beginPath();g.arc(cx,b.y+b.h*.6,30,.3,Math.PI-.3);g.stroke();
      /* lágrima */
      const lg=(b.anim*40)%b.h*.3;
      g.fillStyle='#8FD6FF';
      g.beginPath();
      g.ellipse(cx-27,oy+22+lg,4,7,0,0,Math.PI*2);g.fill();
    }
    /* rachaduras conforme apanha */
    const dano=1-b.vida/b.vidaMax;
    if(dano>.1){
      g.strokeStyle='rgba(255,255,255,.42)';g.lineWidth=2.4;g.lineCap='round';
      for(let i=0;i<Math.floor(dano*8);i++){
        g.beginPath();
        g.moveTo(cx-40+i*12,b.y+12);
        g.lineTo(cx-32+i*12,b.y+40+((i*19)%34));
        g.lineTo(cx-40+i*12,b.y+66+((i*13)%26));
        g.stroke();
      }
    }
    g.restore();

    /* --- barra: três blocos, um por volta --- */
    if(b.estado==='entrada')return;
    const lg2=Math.min(Vista.larg*.6,540);
    const bx=Cam.ox+(Vista.larg-lg2)/2, by=Cam.oy+24;
    g.fillStyle='rgba(18,10,42,.9)';
    g.fillRect(bx-5,by-5,lg2+10,30);
    g.strokeStyle='#160d2e';g.lineWidth=3;
    g.strokeRect(bx-5,by-5,lg2+10,30);
    const porBloco=lg2/3;
    for(let i=0;i<3;i++){
      const cheio=clamp((b.vida-i*3)/3,0,1);
      g.fillStyle='rgba(255,255,255,.1)';
      g.fillRect(bx+i*porBloco+2,by,porBloco-4,20);
      g.fillStyle=CORES[i+1][1];
      g.fillRect(bx+i*porBloco+2,by,(porBloco-4)*cheio,20);
    }
    g.fillStyle='#F4F1FF';
    g.font='700 12px system-ui,sans-serif';
    g.textAlign='center';
    g.fillText('O CICLO — '+['','TENSÃO','EXPLOSÃO','LUA DE MEL'][b.fase],bx+lg2/2,by+14);
    g.textAlign='left';
  },

  projeteis(g){
    for(const p of Mundo.projeteis){
      if(p.x<Cam.ox-80||p.x>Cam.ox+Vista.larg+80)continue;
      const cx=p.x+p.w/2, cy=p.y+p.h/2;
      if(p.dono==='jogador'){
        const r=p.raio*(1+Math.sin(p.anim*22)*.12);
        g.globalAlpha=.3;
        g.fillStyle=p.forte?'#A855F7':'#C99BFF';
        g.beginPath();g.arc(cx,cy,r*1.7,0,Math.PI*2);g.fill();
        g.globalAlpha=1;
        g.strokeStyle=p.forte?'#FFC53D':'#F4F1FF';
        g.lineWidth=p.forte?4:3;
        const dir=p.vx>0?1:-1;
        for(let k=1;k<=(p.forte?4:3);k++){
          g.beginPath();
          g.arc(cx-dir*k*5,cy,r*(k/2.4),dir>0?-.85:Math.PI-.85,dir>0?.85:Math.PI+.85);
          g.stroke();
        }
        continue;
      }
      g.globalAlpha=.28;
      g.fillStyle='#FF5470';
      g.beginPath();g.arc(cx,cy,p.raio*1.8,0,Math.PI*2);g.fill();
      g.globalAlpha=1;
      g.fillStyle='#FF8FB0';
      if(p.presente){
        g.fillRect(cx-p.raio,cy-p.raio,p.raio*2,p.raio*2);
        g.fillStyle='#FFC53D';
        g.fillRect(cx-2.5,cy-p.raio,5,p.raio*2);
        g.fillRect(cx-p.raio,cy-2.5,p.raio*2,5);
      }else{
        g.beginPath();
        g.moveTo(cx-p.raio,cy+p.raio);g.lineTo(cx,cy-p.raio);g.lineTo(cx+p.raio,cy+p.raio);
        g.closePath();g.fill();
      }
    }
    g.globalAlpha=1;
  },

  /* --- qual pose a Manu está fazendo agora --- */
  _pose:'parado',_animT:0,_quadro:0,
  poseDaManu(){
    const p=Jog;
    if(!p.vivo)return 'caido';
    if(p.invul>1.05)return 'dano';
    if(p.vozCarga>0||p.vozRecarga>.16)return 'voz';
    if(!p.noChao)return p.vy<0?'pulo':'caindo';
    if(Math.abs(p.vx)>34)return 'corre';
    return 'parado';
  },
  animaManu(dt){
    const nova=this.poseDaManu();
    if(nova!==this._pose){this._pose=nova;this._animT=0;this._quadro=0;}
    const cfg=FOLHA_MANU.poses[this._pose]||FOLHA_MANU.poses.parado;
    this._animT+=dt;
    const passo=1/(cfg.fps||8);
    while(this._animT>=passo){this._animT-=passo;this._quadro++;}
  },

  /* --- A Manu ---
     Desenhada com um esqueleto simples: os membros são cápsulas
     giradas a partir da articulação. É o que dá o ciclo de corrida. */
  /* cápsula ligando dois pontos: o membro se estica e encolhe sozinho,
     então o pé pode ficar cravado no chão enquanto o quadril sobe */
  membroEntre(g,x1,y1,x2,y2,larg,cor){
    const dx=x2-x1,dy=y2-y1;
    const comp=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    g.save();
    g.translate(x1,y1);
    g.rotate(Math.atan2(dy,dx));
    g.fillStyle=cor;
    g.beginPath();
    g.roundRect?g.roundRect(0,-larg/2,comp,larg,larg/2):g.rect(0,-larg/2,comp,larg);
    g.fill();
    g.restore();
  },

  membro(g,x,y,comp,larg,ang,cor){
    g.save();
    g.translate(x,y);
    g.rotate(ang);
    g.fillStyle=cor;
    g.beginPath();
    g.roundRect?g.roundRect(-larg/2,0,larg,comp,larg/2):g.rect(-larg/2,0,larg,comp);
    g.fill();
    g.restore();
  },

  manu(g){
    const p=Jog;
    if(!p.vivo&&p.morrendoTimer<=0)return;
    if(p.invul>0&&p.vivo&&Math.floor(p.piscar)%2===0)return;
    const cx=p.x+p.w/2, base=p.y+p.h;

    /* sombra encolhe conforme ela sobe */
    if(p.vivo&&!p.semSombra){
      const alto=p.noChao?0:clamp((p.quedaDe!==null?p.y-p.quedaDe:70)/170,0,1);
      g.globalAlpha=.3-alto*.15;
      g.fillStyle='#000';
      g.beginPath();g.ellipse(cx,base+3,15-alto*5,4.6-alto*1.5,0,0,Math.PI*2);g.fill();
      g.globalAlpha=1;
    }
    if(p.impactoBrilho>0){
      g.globalAlpha=p.impactoBrilho*.5;
      g.fillStyle='#FFC53D';
      g.beginPath();g.ellipse(cx,base,44,12,0,0,Math.PI*2);g.fill();
      g.globalAlpha=1;
    }

    g.save();
    g.translate(cx,base);
    g.scale(p.esticaX,p.esticaY);
    g.translate(-cx,-base);

    if(Sprites.pronto){
      const cfg=FOLHA_MANU;
      const pose=cfg.poses[this._pose]||cfg.poses.parado;
      const qi=pose.q[this._quadro%pose.q.length];
      const h=cfg.alturaMundo, w=cfg.larg*(h/cfg.alt);
      g.save();
      g.translate(cx,base);
      g.scale(p.dir<0?-1:1,1);
      g.drawImage(Sprites.img,qi*cfg.larg,0,cfg.larg,cfg.alt,-w/2,-h+(cfg.desloqueY||0),w,h);
      g.restore();
      g.restore();
      this.efeitosManu(g,p,cx);
      return;
    }

    /* ---- proporções ----
       pés na base · quadril -22 · ombro -37 · cabeça -49 */
    const t=Jogo.tempoTotal;
    const anda=Math.abs(p.vx)>34&&p.noChao;
    const noAr=!p.noChao;
    const ciclo=p.animCaminho*13;
    const vel=clamp(Math.abs(p.vx)/330,0,1);
    const bob=anda?Math.abs(Math.sin(ciclo))*2.2*vel:Math.sin(t*2)*.9;
    const quad=base-27-bob, omb=base-41-bob, cabY=base-52-bob;
    const D=p.dir>0?1:-1;
    const PELE='#E8B78F', PELE2='#D9A87F', CABELO='#3A2016',
          CALCA='#2B3A6B', CALCA2='#1E2A4E', BLUSA='#C99BFF', BLUSA2='#A855F7';

    /* --- passada: o pé anda numa elipse; a perna liga quadril ao pé --- */
    const passada=anda?13*vel:0, altura=anda?8*vel:0;
    const faseA=ciclo, faseB=ciclo+Math.PI;
    const peDe=(fase,dx)=>{
      if(noAr){
        /* subindo dobra as pernas; caindo estica pra frente */
        const sobe=p.vy<0;
        const atras=(dx*D)<0;
        return [cx+dx+(sobe?(atras?-7*D:2*D):(atras?-2*D:9*D)),
                base-(sobe?(atras?16:9):(atras?6:1))];
      }
      const lift=Math.max(0,Math.cos(fase))*altura;
      return [cx+dx+Math.sin(fase)*passada, base-lift];
    };
    const pePos=[peDe(faseB,-3.5*D),peDe(faseA,3.5*D)];

    const desenhaPerna=(pe,dx,corPerna,corTenis)=>{
      const hx=cx+dx;
      this.membroEntre(g,hx,quad,pe[0],pe[1]-3,8,corPerna);
      g.save();
      g.translate(pe[0],pe[1]);
      g.fillStyle=corTenis;
      g.beginPath();
      g.roundRect?g.roundRect(-4.5+D*1.5,-5,10,5.5,2.4):g.rect(-4.5,-5,10,5.5);
      g.fill();
      g.fillStyle=BLUSA2;
      g.fillRect(-4.5+D*1.5,-5,10,1.6);
      g.restore();
    };

    /* --- braços: a mão orbita o ombro --- */
    const maoDe=(ang,dx)=>[cx+dx-15*Math.sin(ang),omb+15*Math.cos(ang)];
    let angA,angB;
    if(noAr){
      angA=(p.vy<0?-2.2:-1.7)*D; angB=(p.vy<0?-2.6:-2.1)*D;
    }else if(anda){
      angA=Math.sin(faseB)*.85; angB=Math.sin(faseA)*.85;
    }else{
      angA=Math.sin(t*2)*.09+.05; angB=Math.sin(t*2+1)*.09-.05;
    }
    if(this._pose==='voz')angB=-1.45*D;

    /* ordem: tudo que fica atrás primeiro */
    desenhaPerna(pePos[0],-3.5*D,CALCA2,'#D8D2EE');
    const moA=maoDe(angA,-8*D);
    this.membroEntre(g,cx-8*D,omb+1,moA[0],moA[1],5.6,PELE2);

    /* tronco */
    g.fillStyle=BLUSA;
    g.beginPath();
    g.moveTo(cx-8.5,omb-2);
    g.lineTo(cx+8.5,omb-2);
    g.lineTo(cx+10,quad);
    g.lineTo(cx-10,quad);
    g.closePath();g.fill();
    g.fillStyle=BLUSA2;
    g.fillRect(cx-8.5,omb-2,17,3.4);

    /* saia em A */
    const sw=anda?Math.sin(ciclo)*2.4*vel:0;
    g.fillStyle=BLUSA2;
    g.beginPath();
    g.moveTo(cx-10,quad-6);
    g.lineTo(cx+10,quad-6);
    g.lineTo(cx+14+sw,quad+3);
    g.lineTo(cx-14+sw,quad+3);
    g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,.14)';
    g.fillRect(cx-14+sw,quad,28,2);

    desenhaPerna(pePos[1],3.5*D,CALCA,'#F4F1FF');

    /* crachá do CIEE, pequeno e no cordão */
    const bal=clamp(-p.vx*.016,-3,3)+(noAr?-1.5:0);
    g.strokeStyle='rgba(231,225,250,.8)';g.lineWidth=1.2;
    g.beginPath();g.moveTo(cx-2*D,omb+1);g.lineTo(cx-3*D+bal,omb+8);g.stroke();
    g.save();
    g.translate(cx-3*D+bal,omb+8);g.rotate(bal*.06);
    g.fillStyle='#FFC53D';
    g.beginPath();
    g.roundRect?g.roundRect(-3.4,0,6.8,5,1.4):g.rect(-3.4,0,6.8,5);
    g.fill();
    g.fillStyle='#1B4FD8';g.fillRect(-3.4,0,6.8,1.6);
    g.restore();

    /* ---- cabeça ---- */
    const hx=cx+clamp(p.vx*.012,-2.5,2.5)*D*0+D*1.5;
    /* rabo de cavalo atrás */
    g.save();
    g.translate(hx-8*D,cabY-2);
    g.rotate((p.rabo/30)*D+(noAr?-.35:Math.sin(ciclo)*.13)+D*.35);
    g.fillStyle=CABELO;
    g.beginPath();
    g.moveTo(0,0);
    g.quadraticCurveTo(-11*D,10,-9*D,24);
    g.quadraticCurveTo(-2*D,14,0,3);
    g.closePath();g.fill();
    g.restore();
    g.fillStyle=BLUSA;
    g.beginPath();g.arc(hx-8*D,cabY-2,3,0,Math.PI*2);g.fill();

    g.fillStyle=PELE;
    g.beginPath();g.arc(hx,cabY,9.4,0,Math.PI*2);g.fill();
    /* cabelo por cima */
    g.fillStyle=CABELO;
    g.beginPath();g.arc(hx,cabY-1.5,9.8,Math.PI,0);g.fill();
    g.beginPath();
    g.moveTo(hx-9.8,cabY-1.5);
    g.quadraticCurveTo(hx-2*D,cabY+3.4,hx+8.4*D,cabY-3);
    g.lineTo(hx+9.8,cabY-4);
    g.lineTo(hx-9.8,cabY-4);
    g.closePath();g.fill();

    /* rosto, voltado para a direção da corrida */
    const ox=D*2.5;
    const pisca=(t%3.7)<.11;
    g.fillStyle='#120A2A';
    if(pisca||this._pose==='dano'){
      g.fillRect(hx+ox-4.5,cabY+1.5,3.4,1.5);
      g.fillRect(hx+ox+1.6,cabY+1.5,3.4,1.5);
    }else{
      g.fillRect(hx+ox-4.5,cabY-.5,3.2,4);
      g.fillRect(hx+ox+1.6,cabY-.5,3.2,4);
      g.fillStyle='rgba(255,255,255,.8)';
      g.fillRect(hx+ox-4.1,cabY-.1,1.2,1.3);
      g.fillRect(hx+ox+2,cabY-.1,1.2,1.3);
    }
    g.fillStyle='#C4756E';
    if(this._pose==='voz'){
      g.beginPath();g.ellipse(hx+ox,cabY+6,3,2.8,0,0,Math.PI*2);g.fill();
    }else if(noAr){
      g.fillRect(hx+ox-2,cabY+5.5,4.5,2);
    }else{
      g.beginPath();g.arc(hx+ox,cabY+4.4,2.8,.15,Math.PI-.15);g.fill();
    }

    const moB=maoDe(angB,8*D);
    this.membroEntre(g,cx+8*D,omb+1,moB[0],moB[1],6,PELE);
    g.fillStyle=PELE;
    g.beginPath();g.arc(moB[0],moB[1],3.4,0,Math.PI*2);g.fill();

    g.restore();
    this.efeitosManu(g,p,cx);
  },

  efeitosManu(g,p,cx){
    /* carga da voz */
    if(p.vozCarga>0){
      const f=p.vozCarga/.55;
      g.fillStyle='rgba(18,10,42,.6)';
      g.fillRect(p.x-4,p.y-16,p.w+8,6);
      g.fillStyle=f>=1?'#FFC53D':'#A855F7';
      g.fillRect(p.x-4,p.y-16,(p.w+8)*Math.min(1,f),6);
      if(f>=1){
        g.globalAlpha=.35+Math.sin(Jogo.tempoTotal*18)*.2;
        g.fillStyle='#FFC53D';
        g.beginPath();g.arc(cx,p.y+22,30,0,Math.PI*2);g.fill();
        g.globalAlpha=1;
      }
    }

    /* aviso de queda forte carregada */
    if(p.quedaDe!==null&&!p.noChao&&(p.y-p.quedaDe)>QUEDA_FORTE*.72){
      const f=clamp((p.y-p.quedaDe-QUEDA_FORTE*.72)/60,0,1);
      g.globalAlpha=.35+f*.4;
      g.fillStyle='#FFC53D';
      for(let i=0;i<3;i++)
        g.fillRect(p.x-3+i*13,p.y+p.h+6+i*4,8,3);
      g.globalAlpha=1;
    }
  },

  /* Tinta da fase por cima de tudo, mais vinheta nas bordas.
     É o que faz o quadro parecer uma cena e não peças soltas. */
  tinta(g){
    const cl=CLIMA[this.faseAtual.n]||{};
    if(cl.tinta){
      g.save();
      g.fillStyle=cl.tinta;
      g.fillRect(Cam.ox-10,Cam.oy-10,Vista.larg+20,Vista.alt+20);
      g.restore();
    }
    const gr=g.createRadialGradient(
      Cam.ox+Vista.larg/2,Cam.oy+Vista.alt/2,Math.min(Vista.larg,Vista.alt)*.5,
      Cam.ox+Vista.larg/2,Cam.oy+Vista.alt/2,Math.max(Vista.larg,Vista.alt)*.78);
    gr.addColorStop(0,'rgba(0,0,0,0)');
    gr.addColorStop(1,'rgba(8,4,20,.2)');
    g.fillStyle=gr;
    g.fillRect(Cam.ox-10,Cam.oy-10,Vista.larg+20,Vista.alt+20);
  },

  /* Vinheta vermelha quando a vida está no fim: dá pra sentir sem
     precisar olhar para o crachá no canto. */
  /* Escurece de leve os cantos: dá profundidade e ajuda a vista a
     descansar no meio da tela, onde está a ação. */
  vinheta(g){
    const k='v'+Math.round(Vista.cssL)+'x'+Math.round(Vista.cssA);
    if(this._vk!==k){
      const gr=g.createRadialGradient(
        Vista.cssL/2,Vista.cssA*.52,Math.min(Vista.cssL,Vista.cssA)*.42,
        Vista.cssL/2,Vista.cssA*.52,Math.max(Vista.cssL,Vista.cssA)*.78);
      gr.addColorStop(0,'rgba(0,0,0,0)');
      gr.addColorStop(1,'rgba(6,3,16,.42)');
      this._vg=gr;this._vk=k;
    }
    g.fillStyle=this._vg;
    g.fillRect(0,0,Vista.cssL,Vista.cssA);
  },

  perigo(g){
    if(!Jog.vivo||Jog.vida>1)return;
    const pulso=.5+Math.sin(Jogo.tempoTotal*4.2)*.5;
    const a=.16+pulso*.16;
    const gr=g.createRadialGradient(
      Vista.cssL/2,Vista.cssA/2,Math.min(Vista.cssL,Vista.cssA)*.32,
      Vista.cssL/2,Vista.cssA/2,Math.max(Vista.cssL,Vista.cssA)*.72);
    gr.addColorStop(0,'rgba(255,84,112,0)');
    gr.addColorStop(1,'rgba(255,84,112,'+a.toFixed(3)+')');
    g.fillStyle=gr;
    g.fillRect(0,0,Vista.cssL,Vista.cssA);
  },

  hud(g){
    if(this._margemTopo===null){
      const v=getComputedStyle(document.documentElement).getPropertyValue('--safe-t');
      this._margemTopo=parseFloat(v)||0;
    }
    const e=Math.min(1.25,Math.max(.78,Vista.escala*.72));
    g.save();
    g.scale(e,e);
    const L0=14, T0=14+this._margemTopo/e;
    g.strokeStyle='rgba(168,85,247,.75)';g.lineWidth=5;
    g.beginPath();g.moveTo(L0+26,T0);g.lineTo(L0+54,T0+16);g.moveTo(L0+82,T0);g.lineTo(L0+54,T0+16);g.stroke();
    const cw=196, ch=68, cy=T0+18;
    g.fillStyle='rgba(18,10,42,.86)';
    g.beginPath();
    g.roundRect?g.roundRect(L0,cy,cw,ch,10):g.rect(L0,cy,cw,ch);
    g.fill();
    g.strokeStyle='rgba(199,190,230,.28)';g.lineWidth=1.5;g.stroke();
    g.fillStyle=this.faseAtual.detalhe;
    g.fillRect(L0,cy,cw,4);
    for(let i=0;i<Jog.vidaMax;i++){
      const hx=L0+18+i*23, hy=cy+22;
      g.fillStyle=i<Jog.vida?'#FF5470':'rgba(199,190,230,.2)';
      this.coracao(g,hx,hy,9.5);
      if(i<Jog.vida){
        g.fillStyle='rgba(255,255,255,.45)';
        g.beginPath();g.arc(hx-3,hy-3,2,0,Math.PI*2);g.fill();
      }
    }
    /* as letras do CIEE */
    g.font='900 13px Arial Black,system-ui,sans-serif';
    g.textAlign='center';
    for(let i=0;i<PALAVRA.length;i++){
      const lx=L0+16+i*21, ly=cy+42;
      const tem=Jogo.letras.has(i);
      g.fillStyle=tem?'#FFC53D':'rgba(199,190,230,.14)';
      g.beginPath();
      g.roundRect?g.roundRect(lx-9,ly,18,18,4):g.rect(lx-9,ly,18,18);
      g.fill();
      g.fillStyle=tem?'#1b0733':'rgba(199,190,230,.45)';
      g.textBaseline='middle';
      g.fillText(PALAVRA[i],lx,ly+10);
      g.textBaseline='alphabetic';
    }
    g.textAlign='left';
    g.font='700 10px ui-monospace,monospace';
    g.fillStyle='#C7BEE6';
    g.fillText('FASE '+this.faseAtual.n,L0+104,cy+54);
    g.font='700 13px ui-monospace,monospace';
    g.textAlign='right';
    g.fillText(String(Jog.pontos).padStart(6,'0'),(Vista.cssL/e)-14,cy+ch+18);
    g.textAlign='left';
    g.restore();
  }
};

const Interface={
  faixaTimer:0,
  faixa(txt,tipo){
    const el=$('#faixa');
    el.textContent=txt;
    el.className='on'+(tipo?' '+tipo:'');
    this.faixaTimer=tipo==='mural'?4.2:3.2;
  },
  atualizaFaixa(dt){
    if(this.faixaTimer>0){
      this.faixaTimer-=dt;
      if(this.faixaTimer<=0)$('#faixa').className='';
    }
  },
  mostra(id){
    document.querySelectorAll('.camada').forEach(c=>c.classList.remove('on'));
    if(id)$(id).classList.add('on');
    const jogando=!id&&(Jogo.estado==='jogando'||Jogo.estado==='dialogo');
    $('#topo').classList.toggle('on',jogando);
    $('#toques').classList.toggle('on',jogando&&Jogo.toqueLigado);
  },
  alternaSom(){
    const on=Som.alterna();
    this.faixa(on?'Som ligado':'Som desligado',on?'verde':'sol');
    $('#b-som').style.opacity=on?'1':'.42';
  },
  telaCheia(){
    const el=document.documentElement;
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){
      (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
      if(screen.orientation&&screen.orientation.lock)
        screen.orientation.lock('landscape').catch(()=>{});
    }else{
      (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
    }
  },
  checaOrientacao(){
    const precisa=Vista.retrato&&Vista.cssL<560&&Jogo.estado==='jogando'&&!Jogo.girarDispensado;
    $('#girar').classList.toggle('on',precisa);
  },

  /* Anima um número de 0 até o valor: dá peso ao resultado. */
  conta(el,alvo,dur){
    if(!el)return;
    const t0=Date.now(), d=dur||900;
    const passo=()=>{
      const k=Math.min(1,(Date.now()-t0)/d);
      const suave=1-Math.pow(1-k,3);
      el.textContent=Math.round(alvo*suave);
      if(k<1)requestAnimationFrame(passo);
    };
    passo();
  },

        <button class="btn" id="q-prox" style="display:none;margin-top:14px">Continuar</button>
      </div></div>`;
    this.mostra('#c-quiz');
    const botoes=[...document.querySelectorAll('#c-quiz .opcao')];
    botoes.forEach(b=>{
      b.onclick=()=>{
        const ok=(+b.dataset.k)===q.c;
        botoes.forEach(x=>{x.disabled=true;x.style.cursor='default';});
        botoes[q.c].classList.add('certa');
        if(!ok)b.classList.add('errada');
        Som.quiz(ok);
        const fb=$('#q-fb');
        fb.className='feedback on '+(ok?'ok':'nao');
        fb.innerHTML=(ok?'<b>Isso.</b> ':'<b>Não é bem assim.</b> ')+esc(q.e);
        $('#q-prox').style.display='block';
        $('#q-prox').onclick=()=>aoFim(ok);
      };
    });
  },

    const verbetes=MURAIS[aba].map(m=>{
      const tem=Jogo.vistos.has(m.id);
      return `<div class="verbete${tem?'':' travado'}">
        <h4>${tem?esc(m.titulo):'Ainda não encontrado'}</h4>
        <p>${tem?esc(m.texto):'Passe pelo mural desta fase para desbloquear.'}</p>
