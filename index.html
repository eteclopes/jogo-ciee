      const img=tem&&id!=='ciclo'?Arte.retrato(id,104):'';
      return `<div class="bicho${tem?'':' travado'}">
        <div class="retrato">${img?`<img src="${img}" alt="">`:'<span>?</span>'}</div>
        <div class="dados">
          <h4>${tem?esc(nome):'Ainda não encontrado'}</h4>
          ${tem?`<p>${esc(b.txt)}</p><div class="como"><b>Como se derruba</b> ${esc(b.como)}</div>`
               :'<p>Continue jogando para desbloquear.</p>'}
        </div>
      </div>`;
    }).join('');
  },
  cartilhaBichos(voltar){
    $('#c-cartilha').innerHTML=`
      <div class="rolar"><div class="cartilha anima">
        <div class="olho">${Jogo.conhecidos.size} de 12 encontrados</div>
        <h2 class="sec">Quem é quem</h2>
        <p class="linha-fina">Cada criatura do jogo é uma coisa que existe fora dele. Aqui está o que cada uma representa.</p>
        <div class="abas">${[1,2,3,4,5].map(i=>`<button class="aba" data-a="${i}">${esc(FASES[i-1].nome)}</button>`).join('')}<button class="aba on" data-a="bichos">Quem é quem</button></div>
        <div class="bichos">${this.cardsBichos()}</div>
        <button class="btn" id="ct-volta">Voltar</button>
      </div></div>`;
    this.mostra('#c-cartilha');
    document.querySelectorAll('#c-cartilha .aba').forEach(b=>{
      b.onclick=()=>this.cartilha(voltar,b.dataset.a==='bichos'?'bichos':+b.dataset.a);
    });
    $('#ct-volta').onclick=voltar;
  },

  dialogo(id,aoFim){
    const f=FALAS[id];
    if(!f){aoFim();return null;}
    let i=0;
    const el=$('#dialogo');
    const passa=()=>{
      if(i>=f.t.length){el.classList.remove('on');aoFim();return;}
      $('#d-quem').textContent=f.quem;
      $('#d-fala').textContent=f.t[i];
      el.classList.add('on');
      i++;
    };
    passa();
    return passa;
  }
};

/* ============================================================
   18. JOGO
   ============================================================ */
const Jogo={
  estado:'abertura',
  fase:1,faseMax:1,
  tempoTotal:0,
  toqueLigado:false,
  girarDispensado:false,
  dialogoPassa:null,
  ultimoCheck:null,
  letras:new Set(),          /* C-I-E-E da fase atual */
  letrasFase:0,
  vistos:new Set(),          /* murais lidos, vão pra Cartilha */
  conhecidos:new Set(),      /* inimigos já encontrados */
  assistido:false,              /* modo tranquilo */
  ouvidos:new Set(),         /* conversas já tidas */
  transicao:0,
  travaEntrada:0,
  congela:0,
  vitrine:false,   /* cenário rodando atrás do menu */
  palestra:false,  /* libera todas as fases para apresentação */
  menosMovimento:false,  /* desliga tremor, zoom e o que se mexe no céu */

  inicia(){
    this.faseMax=clamp(Guarda.ler('faseMax',1),1,5);
    Jog.pontos=Guarda.ler('pontos',0)||0;
    const v=Guarda.ler('vistos',[]);
    if(Array.isArray(v))v.forEach(id=>{if(MURAL_POR_ID[id])this.vistos.add(id);});
    const o=Guarda.ler('ouvidos',[]);
    if(Array.isArray(o))o.forEach(id=>{if(FALAS[id])this.ouvidos.add(id);});
    const b=Guarda.ler('conhecidos',[]);
    if(Array.isArray(b))b.forEach(id=>{if(BESTIARIO[id])this.conhecidos.add(id);});
    this.assistido=!!Guarda.ler('assistido',false);
    this.palestra=!!Guarda.ler('palestra',false);
    this.menosMovimento=!!Guarda.ler('menosMovimento',false);
    this.assistido=!!Guarda.ler('assistido',false);
    const toque=('ontouchstart' in window)||navigator.maxTouchPoints>0;
    this.toqueLigado=Guarda.ler('toque',toque);
    $('#b-som').style.opacity=Som.ligado?'1':'.42';
    this.abreMenu();
  },

  /* O menu não é uma tela parada: monta uma fase de verdade e passeia
     a câmera por ela, com inimigos andando e poeira no ar. */
  abreMenu(){
    this.estado='menu';
    this.vitrine=true;
    const n=clamp(this.faseMax,1,5);
    Arte.faseAtual=FASES[n-1];
    montaFase(n);
    Jog.x=-99999;Jog.vivo=true;
    Cam.zoom=1;Cam.zoomAlvo=1;Cam.tremor=0;
    /* começa onde tem gente e bicho, não num trecho vazio */
    const pontos=Mundo.npcs.map(n=>n.x).concat(Mundo.inimigos.filter(e=>e.tipo!=='muro').map(e=>e.x));
    const alvo=pontos.length?pick(pontos):Mundo.larg/3;
    Cam.x=clamp(alvo-Vista.larg*.55,40,Math.max(40,Mundo.larg-Vista.larg-40));
    this.vitrineY=0;
    this.transicao=0;
    Interface.menu();
  },
  zera(){
    this.faseMax=1;this.ultimoCheck=null;
    Guarda.gravar('teo',false);
    Jog.pontos=0;Jog.quedas=0;Jog.vida=4;
    Guarda.gravar('faseMax',1);Guarda.gravar('pontos',0);
  },
  salva(){
    Guarda.gravar('faseMax',this.faseMax);
    Guarda.gravar('pontos',Jog.pontos);
    Guarda.gravar('vistos',[...this.vistos]);
    Guarda.gravar('ouvidos',[...this.ouvidos]);
    Guarda.gravar('conhecidos',[...this.conhecidos]);
    Guarda.gravar('assistido',this.assistido);
    Guarda.gravar('palestra',this.palestra);
    Guarda.gravar('menosMovimento',this.menosMovimento);
    Guarda.gravar('assistido',this.assistido);
  },

  alternaAssistido(){
    this.assistido=!this.assistido;
    Jog.vidaMax=this.assistido?7:5;
    Jog.vida=Math.min(Jog.vida,Jog.vidaMax);
    if(this.assistido)Jog.vida=Jog.vidaMax;
    this.salva();
  },
  faseLiberada(n){return this.palestra||n<=this.faseMax;},

  /* --- letras do CIEE --- */
  pegaLetra(i){
    if(this.letras.has(i))return;
    this.letras.add(i);
    Jog.ganha(300);
    Som.moeda();
    const faltam=PALAVRA.length-this.letras.size;
    if(faltam===0){
      Som.fase();
      Interface.faixa('C-I-E-E completo! A saída abriu.','verde');
    }else{
      Interface.faixa('Letra '+PALAVRA[i]+' · faltam '+faltam,'sol');
    }
  },

  /* O Téo fala enquanto você fica perto — em faixa, sem parar a partida. */


  /* --- primeiro encontro: apresenta a criatura sem parar o jogo --- */
  conhece(tipo){
    if(this.conhecidos.has(tipo)||!BESTIARIO[tipo])return;
    this.conhecidos.add(tipo);
    Jog.ganha(100);
    const nome=(TIPOS[tipo]&&TIPOS[tipo].nome)||'O Ciclo';
    Interface.faixa(nome.toUpperCase()+' — '+BESTIARIO[tipo].curto,'quemé');
    Som.nota(430,.1,'triangle',.07);
    setTimeout(()=>Som.nota(620,.12,'triangle',.06),90);
    this.salva();
  },

  /* --- mural lido: faixa rápida agora, verbete na Cartilha depois --- */
  leMural(dados){
    if(!dados)return;
    Interface.faixa(dados.linha,'mural');
    if(!this.vistos.has(dados.id)){
      this.vistos.add(dados.id);
      Jog.ganha(80);
      this.salva();
    }
  },
  alternaToque(){
    this.toqueLigado=!this.toqueLigado;
    Guarda.gravar('toque',this.toqueLigado);
  },

  iniciaFase(n){
    this.vitrine=false;
    Jog.vidaMax=this.assistido?7:5;
    n=clamp(n,1,5);
    if(this.letrasFase!==n){this.letras=new Set();this.letrasFase=n;}
    this.fase=n;
    this.faseMax=Math.max(this.faseMax,this.fase);
    Arte.faseAtual=FASES[this.fase-1];
    Som.mPasso=0;Som.mTimer=0;
    montaFase(this.fase);
    if(this.ultimoCheck&&this.ultimoCheck.fase===this.fase){
      const c=Mundo.checkpoints.find(k=>Math.abs(k.x-this.ultimoCheck.x)<6);
      if(c){
        c.ativo=true;
        Mundo.nascer={x:c.x-4,y:c.y+8};
        Jog.reinicia(Mundo.nascer);
        Cam.segue(Jog,Mundo,0,true);
      }
    }
    Jog.vida=Math.max(this.assistido?Jog.vidaMax:4,Jog.vida);
    this.estado='jogando';
    this.transicao=.55;
    this.travaEntrada=.25;
    Interface.mostra(null);
    Interface.checaOrientacao();
    Interface.faixa('Fase '+this.fase+' · '+Arte.faseAtual.tema);
    setTimeout(()=>{
      if(this.estado==='jogando')Interface.faixa(Arte.faseAtual.dica,'sol');
    },3400);
    this.salva();
    Som.inicia();Som.acorda();
  },

  reviveJogador(){
    Jog.reinicia(Mundo.nascer);
    if(Jog.vida<=0){
      this.estado='fim';
      Interface.gameOver();
      Jog.vida=4;
      return;
    }
    Cam.segue(Jog,Mundo,0,true);
  },

  abreDialogo(id){
    if(this.estado!=='jogando')return;
    this.estado='dialogo';
    this.travaEntrada=.3;
    if(!this.ouvidos.has(id)){this.ouvidos.add(id);Jog.ganha(60);this.salva();}
    this.dialogoPassa=Interface.dialogo(id,()=>{
      this.estado='jogando';
      this.dialogoPassa=null;
      this.travaEntrada=.2;
    });
  },

  completaFase(){
    if(this.estado!=='jogando')return;
    this.estado='fim';
    Som.fase();
    Part.solta(Jog.x+15,Jog.y+20,30,['#43E098','#C99BFF','#FFFFFF'],{vel:300,vida:1,tam:7});
    const f=this.fase;
    this.faseMax=Math.max(this.faseMax,Math.min(5,f+1));
    this.ultimoCheck=null;
    this.salva();
    setTimeout(()=>Interface.fimDeFase(f),620);
  },

  venceChefe(){
    this.estado='fim';
    Som.fase();
    Interface.faixa('O silêncio rachou.','verde');
    setTimeout(()=>this.perguntaFinal(),1800);
  },

  perguntaFinal(){
    this.estado='quiz';
    Interface.pergunta(ok=>{
      if(ok)Jog.ganha(1500);
      this.faseMax=5;
      this.salva();
      this.estado='fim';
      Interface.final(ok);
    });
  },

  pedePausa(){
    if(this.estado==='jogando')this.abrePausa();
    else if(this.estado==='pausado')this.fechaPausa();
  },
  abrePausa(){this.estado='pausado';Interface.pausa();},
  fechaPausa(){this.estado='jogando';this.travaEntrada=.2;Interface.mostra(null);},

  /* Congela o quadro por alguns milissegundos. É o que dá peso ao golpe. */
  trava(t){this.congela=Math.min(.13,Math.max(this.congela,t));},

  atualiza(dt){
    this.tempoTotal+=dt;
    Ent.atualiza();
    Interface.atualizaFaixa(dt);
    if(this.travaEntrada>0)this.travaEntrada-=dt;
    if(this.transicao>0)this.transicao-=dt;

    /* vitrine do menu: cenário anda sozinho, sem jogabilidade */
    if(this.vitrine&&this.estado==='menu'){
      atualizaSolidos(dt);
      for(const e of Mundo.inimigos){
        if(!e.vivo&&e.morte<=0)continue;
        if(e.tipo==='ameaca'||e.tipo==='bot')continue;   /* dependem do jogador */
        if(e.x<Cam.x-300||e.x>Cam.x+Vista.larg+300)continue;
        atualizaInimigo(e,dt);
      }
      for(const c of Mundo.checkpoints)c.anim+=dt;
      for(const n of Mundo.npcs)n.anim+=dt;
      for(const m of Mundo.murais)m.anim+=dt;
      if(Mundo.saida)Mundo.saida.anim+=dt;
      for(const it of Mundo.itens){it.anim+=dt;it.y=it.baseY+Math.sin(it.anim*2.6)*5;}
      Part.atualiza(dt);
      if(!Jogo.menosMovimento){
        Cam.x+=22*dt;
        const limite=Math.max(0,Mundo.larg-Vista.larg-40);
        if(Cam.x>limite)Cam.x=40;
      }
      /* enquadra mais céu que chão, com uma respiração vertical lenta */
      Cam.y=clamp(Mundo.chaoY-Vista.alt*.70,0,Math.max(0,Mundo.alt-Vista.alt));
      return;
    }

    if(this.estado==='dialogo'){
      if((Ent.qualquerNova||Ent.puloNovo)&&this.travaEntrada<=0&&this.dialogoPassa){
        this.travaEntrada=.22;
        this.dialogoPassa();
      }
      Part.atualiza(dt);
      return;
    }
    if(this.estado!=='jogando')return;

    /* hitstop: o mundo para, mas as fagulhas continuam devagar */
    if(this.congela>0){
      this.congela-=dt;
      Part.atualiza(dt*.22);
      Cam.segue(Jog,Mundo,dt*.4,false);
      return;
    }

    const f=Arte.faseAtual;
    Som.tocaMusica(dt,f.escala,f.bpm);

    atualizaSolidos(dt);
    Jog.atualiza(dt);
    Arte.animaManu(dt);
    if(this.toqueLigado){
      const bv=$('#t-voz');
      const cheio=Jog.vozCarga>=.5;
      if(cheio!==this._vozCheia){this._vozCheia=cheio;bv.classList.toggle('carregando',cheio);}
    }
    for(const e of Mundo.inimigos){
      if(!e.vivo&&e.morte<=0)continue;
      if(e.tipo!=='seguidor'&&(e.x<Cam.ox-750||e.x>Cam.ox+Vista.larg+750))continue;
      /* entrou no quadro pela primeira vez: apresenta */
      if(e.vivo&&!this.conhecidos.has(e.tipo)&&
         e.x+e.w>Cam.ox&&e.x<Cam.ox+Vista.larg&&Math.abs(e.x-Jog.x)<Vista.larg*.6)
        this.conhece(e.tipo);
      atualizaInimigo(e,dt);
    }
    for(let i=Mundo.inimigos.length-1;i>=0;i--)
      if(!Mundo.inimigos[i].vivo&&Mundo.inimigos[i].morte<=0)Mundo.inimigos.splice(i,1);
    if(Mundo.chefe){
      if(Mundo.chefe.vivo&&Mundo.chefe.estado!=='entrada')this.conhece('ciclo');
      atualizaChefe(Mundo.chefe,dt);
    }
    atualizaProjeteis(dt);
    atualizaItens(dt);
    atualizaCenario(dt);
    Part.atualiza(dt);
    Cam.segue(Jog,Mundo,dt,false);
  },

  desenha(){
    Arte.quadro();
    if(this.transicao>0){
      ctx.save();
      ctx.setTransform(Vista.dpr,0,0,Vista.dpr,0,0);
      ctx.globalAlpha=clamp(this.transicao/.55,0,1);
      ctx.fillStyle='#120A2A';
      ctx.fillRect(0,0,Vista.cssL,Vista.cssA);
      ctx.restore();
      ctx.globalAlpha=1;
    }
  }
};

/* ============================================================
   19. ARRANQUE
   ============================================================ */
Ent.inicia();
Sprites.carrega(FOLHA_MANU);
Vista.redimensiona();
addEventListener('resize',()=>Vista.redimensiona());
addEventListener('orientationchange',()=>setTimeout(()=>Vista.redimensiona(),160));
document.addEventListener('fullscreenchange',()=>setTimeout(()=>Vista.redimensiona(),120));

$('#b-pausa').onclick=()=>Jogo.pedePausa();
$('#b-som').onclick=()=>Interface.alternaSom();
$('#b-tela').onclick=()=>Interface.telaCheia();
$('#b-girar-ok').onclick=()=>{Jogo.girarDispensado=true;$('#girar').classList.remove('on');};

function passaDialogo(){
  if(Jogo.estado==='dialogo'&&Jogo.dialogoPassa&&Jogo.travaEntrada<=0){
    Jogo.travaEntrada=.22;
    Jogo.dialogoPassa();
  }
}
$('#dialogo').addEventListener('pointerdown',passaDialogo);
tela.addEventListener('pointerdown',()=>{Som.inicia();Som.acorda();passaDialogo();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&Jogo.estado==='jogando')Jogo.abrePausa();
});
addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('#toques'))e.preventDefault();});

let ultimo=performance.now();
function laco(agora){
  let dt=(agora-ultimo)/1000;
  ultimo=agora;
  if(dt>.05)dt=.05;
  if(dt>0)Jogo.atualiza(dt);
  Jogo.desenha();
  requestAnimationFrame(laco);
}

Jogo.inicia();
requestAnimationFrame(laco);
setTimeout(()=>{
  const ab=$('#abertura');
  ab.classList.add('sai');
  setTimeout(()=>ab.remove(),600);
},420);

})();
