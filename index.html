    $('#c-fim').innerHTML=`
      <div class="rolar"><div class="painel">
        <div class="olho">Fase ${Jogo.fase} · ${esc(FASES[Jogo.fase-1].tema)}</div>
        <h2 class="sec">Dessa vez não deu</h2>
        <p style="color:var(--papel-2);font-size:14.5px">Você volta no último ponto de retorno com a vida cheia. A cartilha continua com você — o que já foi aprendido não se perde.</p>
        <div class="linha-btn" style="margin-top:18px">
          <button class="btn verde" id="go-tenta">Tentar de novo</button>
          <button class="btn vazio" id="go-menu">Início</button>
        </div>
      </div></div>`;
    this.mostra('#c-fim');
    $('#go-tenta').onclick=()=>Jogo.iniciaFase(Jogo.fase);
    $('#go-menu').onclick=()=>{Jogo.estado='menu';this.menu();};
  },

  /* ---------- Pausa ---------- */
  pausa(){
    $('#c-pausa').innerHTML=`
      <div class="rolar"><div class="painel">
        <div class="olho">Fase ${Jogo.fase} · ${esc(FASES[Jogo.fase-1].tema)}</div>
        <h2 class="sec">Pausa</h2>
        <div class="placar">
          <div><div class="n">${Jog.selos}</div><div class="r">selos</div></div>
          <div><div class="n">${Jogo.fichas.size}</div><div class="r">fichas</div></div>
          <div><div class="n">${Jog.pontos}</div><div class="r">pontos</div></div>
        </div>
        <div class="menu-botoes">
          <button class="btn verde" id="p-volta">Continuar jogando</button>
          <button class="btn roxo" id="p-cart">Abrir a cartilha</button>
          <div class="linha-btn">
            <button class="btn vazio" id="p-toque">${Jogo.toqueLigado?'Ocultar controles':'Mostrar controles'}</button>
            <button class="btn vazio" id="p-som">${Som.ligado?'Desligar som':'Ligar som'}</button>
          </div>
          <button class="btn vazio" id="p-menu">Sair para o início</button>
        </div>
      </div></div>`;
    this.mostra('#c-pausa');
    $('#p-volta').onclick=()=>Jogo.fechaPausa();
    $('#p-cart').onclick=()=>this.cartilha();
    $('#p-toque').onclick=()=>{Jogo.alternaToque();this.pausa();};
    $('#p-som').onclick=()=>{this.alternaSom();this.pausa();};
    $('#p-menu').onclick=()=>{Jogo.estado='menu';this.menu();};
  },

  /* ---------- Diálogo ---------- */
  dialogo(id,aoFim){
    const f=FALAS[id];
    if(!f){aoFim();return;}
    let i=0;
    const el=$('#dialogo');
    const passa=()=>{
      if(i>=f.t.length){el.classList.remove('on');aoFim();return;}
      $('#d-quem').textContent=f.quem;
      $('#d-fala').textContent=f.t[i];
      el.classList.add('on');
      i++;
    };
    passa();
    return passa;
  }
};

/* ============================================================
   17. JOGO — estados e laço principal
   ============================================================ */
const Jogo={
  estado:'abertura',           /* abertura | menu | jogando | pausado | ficha | quiz | dialogo | fim */
  fase:1,faseMax:1,
  fichas:new Set(),
  tempoTotal:0,
  toqueLigado:false,
  girarDispensado:false,
  dialogoPassa:null,
  ultimoCheck:null,
  transicao:0,
  travaEntrada:0,

  inicia(){
    this.faseMax=clamp(Guarda.ler('faseMax',1),1,5);
    const salvas=Guarda.ler('fichas',[]);
    if(Array.isArray(salvas))salvas.forEach(f=>{if(FICHAS[f])this.fichas.add(f);});
    Jog.pontos=Guarda.ler('pontos',0)||0;
    /* controles de toque ligados por padrão em telas sensíveis ao toque */
    const toque=('ontouchstart' in window)||navigator.maxTouchPoints>0;
    this.toqueLigado=Guarda.ler('toque',toque);
    $('#b-som').style.opacity=Som.ligado?'1':'.42';
    this.estado='menu';
    Interface.menu();
  },
  zera(){
    this.fichas.clear();this.faseMax=1;
    Jog.pontos=0;Jog.selos=0;Jog.mortes=0;Jog.vida=3;
    Guarda.gravar('faseMax',1);Guarda.gravar('fichas',[]);Guarda.gravar('pontos',0);
  },
  salva(){
    Guarda.gravar('faseMax',this.faseMax);
    Guarda.gravar('fichas',[...this.fichas]);
    Guarda.gravar('pontos',Jog.pontos);
  },
  alternaToque(){
    this.toqueLigado=!this.toqueLigado;
    Guarda.gravar('toque',this.toqueLigado);
  },

  iniciaFase(n){
    this.fase=clamp(n,1,5);
    this.faseMax=Math.max(this.faseMax,this.fase);
    Arte.faseAtual=FASES[this.fase-1];
    Som.mPasso=0;Som.mTimer=0;
    montaFase(this.fase);
    /* volta ao último ponto de retorno se estiver repetindo a mesma fase */
    if(this.ultimoCheck&&this.ultimoCheck.fase===this.fase){
      const c=Mundo.checkpoints.find(k=>Math.abs(k.x-this.ultimoCheck.x)<6);
      if(c){
        c.ativo=true;
        Mundo.nascer={x:c.x-4,y:c.y+8};
        Jog.reinicia(Mundo.nascer);
        Cam.segue(Jog,Mundo,0,true);
      }
    }
    Jog.vida=Math.max(3,Jog.vida);
    Jog.selos=0;
    this.estado='jogando';
    this.transicao=.55;
    this.travaEntrada=.25;
    Interface.mostra(null);
    Interface.checaOrientacao();
    Interface.faixa('Fase '+this.fase+' · '+Arte.faseAtual.tema,'roxo');
    setTimeout(()=>{
      if(this.estado==='jogando')Interface.faixa(Arte.faseAtual.poder,'verde');
    },3400);
    this.salva();
    Som.inicia();Som.acorda();
    /* atualiza os botões de toque conforme os poderes liberados */
    $('#t-corr').classList.toggle('oculto',this.fase<3);
  },

  reviveJogador(){
    Jog.reinicia(Mundo.nascer);
    if(Jog.vida<=0){
      this.estado='fim';
      Interface.gameOver();
      Jog.vida=3;
      return;
    }
    Cam.segue(Jog,Mundo,0,true);
  },

  abreFicha(id){
    this.fichas.add(id);
    this.salva();
    this.estado='ficha';
    Interface.ficha(id,()=>{
      this.estado='jogando';
      this.travaEntrada=.2;
      Interface.mostra(null);
    });
  },

  abreDialogo(id){
    if(this.estado!=='jogando')return;
    this.estado='dialogo';
    this.dialogoPassa=Interface.dialogo(id,()=>{
      this.estado='jogando';
      this.dialogoPassa=null;
      this.travaEntrada=.2;
      Interface.mostra(null);
    });
  },

  completaFase(){
    if(this.estado!=='jogando')return;
    this.estado='quiz';
    Som.fase();
    Part.solta(Jog.x+16,Jog.y+20,30,['#43E098','#FFC53D','#FFFFFF'],{vel:300,vida:1,tam:7});
    const f=this.fase;
    this.faseMax=Math.max(this.faseMax,Math.min(5,f+1));
    this.salva();
    setTimeout(()=>{
      Interface.quiz(f,(acertos,total)=>{
        if(acertos===total)Jog.cura(2);
        else if(acertos>0)Jog.cura(1);
        this.estado='fim';
        Interface.fimDeFase(f,acertos,total);
      });
    },520);
  },

  venceChefe(){
    this.estado='quiz';
    Som.fase();
    Interface.faixa('Falar quebrou o ciclo.','verde');
    const f=this.fase;
    setTimeout(()=>{
      Interface.quiz(f,(acertos,total)=>{
        if(acertos>0)Jog.cura(2);
        this.estado='fim';
        Interface.fimDeFase(f,acertos,total);
      });
    },1600);
  },

  final(){
    this.faseMax=5;
    this.salva();
    this.estado='fim';
    Interface.final();
  },

  pedePausa(){
    if(this.estado==='jogando')this.abrePausa();
    else if(this.estado==='pausado')this.fechaPausa();
  },
  abrePausa(){
    this.estado='pausado';
    Interface.pausa();
  },
  fechaPausa(){
    this.estado='jogando';
    this.travaEntrada=.2;
    Interface.mostra(null);
  },

  /* ---------- laço ---------- */
  atualiza(dt){
    this.tempoTotal+=dt;
    Ent.atualiza();
    Interface.atualizaFaixa(dt);
    if(this.travaEntrada>0)this.travaEntrada-=dt;
    if(this.transicao>0)this.transicao-=dt;

    if(this.estado==='dialogo'){
      if((Ent.qualquerNova||Ent.puloNovo||Ent.vozNova)&&this.travaEntrada<=0&&this.dialogoPassa){
        this.travaEntrada=.22;
        this.dialogoPassa();
      }
      Part.atualiza(dt);
      return;
    }
    if(this.estado!=='jogando')return;

    const f=Arte.faseAtual;
    Som.tocaMusica(dt,f.escala,f.bpm);

    atualizaSolidos(dt);
    Jog.atualiza(dt);
    for(const e of Mundo.inimigos){
      if(!e.vivo&&e.morte<=0)continue;
      if(e.x<Cam.ox-700||e.x>Cam.ox+Vista.larg+700)continue;
      atualizaInimigo(e,dt);
    }
    for(let i=Mundo.inimigos.length-1;i>=0;i--)
      if(!Mundo.inimigos[i].vivo&&Mundo.inimigos[i].morte<=0)Mundo.inimigos.splice(i,1);
    if(Mundo.chefe)atualizaChefe(Mundo.chefe,dt);
    atualizaProjeteis(dt);
    atualizaItens(dt);
    atualizaCenario(dt);
    Part.atualiza(dt);
    Cam.segue(Jog,Mundo,dt,false);
  },

  desenha(){
    Arte.quadro();
    if(this.transicao>0){
      ctx.save();
      ctx.setTransform(Vista.dpr,0,0,Vista.dpr,0,0);
      ctx.globalAlpha=clamp(this.transicao/.55,0,1);
      ctx.fillStyle='#0C1226';
      ctx.fillRect(0,0,Vista.cssL,Vista.cssA);
      ctx.restore();
      ctx.globalAlpha=1;
    }
  }
};

/* ============================================================
   18. ARRANQUE
   ============================================================ */
Ent.inicia();
Vista.redimensiona();
addEventListener('resize',()=>Vista.redimensiona());
addEventListener('orientationchange',()=>setTimeout(()=>Vista.redimensiona(),160));
document.addEventListener('fullscreenchange',()=>setTimeout(()=>Vista.redimensiona(),120));

$('#b-pausa').onclick=()=>Jogo.pedePausa();
$('#b-som').onclick=()=>Interface.alternaSom();
$('#b-tela').onclick=()=>Interface.telaCheia();
$('#b-girar-ok').onclick=()=>{Jogo.girarDispensado=true;$('#girar').classList.remove('on');};
$('#dialogo').addEventListener('pointerdown',()=>{
  if(Jogo.estado==='dialogo'&&Jogo.dialogoPassa&&Jogo.travaEntrada<=0){
    Jogo.travaEntrada=.22;
    Jogo.dialogoPassa();
  }
});
tela.addEventListener('pointerdown',()=>{
  Som.inicia();Som.acorda();
  if(Jogo.estado==='dialogo'&&Jogo.dialogoPassa&&Jogo.travaEntrada<=0){
    Jogo.travaEntrada=.22;
    Jogo.dialogoPassa();
  }
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&Jogo.estado==='jogando')Jogo.abrePausa();
});
addEventListener('contextmenu',e=>{if(e.target.closest('#toques'))e.preventDefault();});

let ultimo=performance.now();
function laco(agora){
  let dt=(agora-ultimo)/1000;
  ultimo=agora;
  if(dt>.05)dt=.05;              /* trava o passo em quedas de quadro */
  if(dt>0)Jogo.atualiza(dt);
  Jogo.desenha();
  requestAnimationFrame(laco);
}

Jogo.inicia();
requestAnimationFrame(laco);
setTimeout(()=>{
  const ab=$('#abertura');
  ab.classList.add('sai');
  setTimeout(()=>ab.remove(),600);
},420);

})();
</script></body></html>
