<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120A2A">
<meta name="description" content="Se Liga Moçada — jogo do CIEE com o Programa Bem Querer Mulher sobre cultura machista e prevenção da violência de gênero e intrafamiliar.">
<title>Se Liga Moçada — O Caminho da Manu</title>
<style>
/* ============================================================
   SE LIGA MOÇADA — O CAMINHO DA MANU
   CIEE + Programa Bem Querer Mulher
   ============================================================ */
:root{
  --tinta:#120A2A;
  --tinta-2:#1D1140;
  --lilas:#A855F7;
  --lilas-claro:#C99BFF;
  --lilas-fundo:#6D28D9;
  --sol:#FFC53D;
  --verde:#19B36B;
  --verde-claro:#43E098;
  --azul:#4D8BFF;
  --alerta:#FF5470;
  --papel:#F4F1FF;
  --papel-2:#C7BEE6;
  --display:"Arial Black","Archivo Black",Impact,"Haettenschweiler",system-ui,sans-serif;
  --corpo:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--tinta);color:var(--papel);font-family:var(--corpo);overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
#palco{position:absolute;inset:0;overflow:hidden}

.camada{position:absolute;inset:0;display:none;z-index:20}
.camada.on{display:flex}
.camada.escura{background:rgba(14,8,32,.93);
  align-items:center;justify-content:center;
  padding:calc(18px + var(--safe-t)) clamp(14px,3.4vw,34px) calc(18px + var(--safe-b))}
/* o menu deixa o cenário do jogo aparecer, sem borrar nada */
#c-menu.escura{background:linear-gradient(100deg,rgba(14,8,32,.94) 0%,rgba(14,8,32,.9) 44%,rgba(14,8,32,.6) 76%,rgba(14,8,32,.78) 100%)}
@media (max-width:760px){
  #c-menu.escura{background:linear-gradient(180deg,rgba(14,8,32,.93) 0%,rgba(14,8,32,.88) 52%,rgba(14,8,32,.94) 100%)}
}
.rolar{position:relative;z-index:1;max-height:100%;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;width:100%;display:flex;align-items:flex-start;justify-content:flex-start}
/* margin:auto centraliza quando cabe e NÃO corta o topo quando não cabe —
   com align-items:center o começo da Cartilha ficava inalcançável */
.rolar>*{margin:auto;padding:2px 0}

.display{font-family:var(--display);letter-spacing:-.02em;line-height:.92;text-transform:uppercase}
.olho{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lilas-claro);
  display:inline-flex;align-items:center;gap:8px}
.olho::before{content:'';width:14px;height:5px;background:var(--lilas);display:inline-block}
.linha-fina{color:var(--papel-2);font-size:13.5px;line-height:1.6;margin:0 0 4px;max-width:60ch}
.cartao{background:#1B1036;border:3px solid #2F1F58;border-radius:6px;
  padding:18px 18px 16px;position:relative;overflow:hidden}
.cartao::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--lilas)}
.divisor{height:3px;background:#2F1F58;margin:16px 0 13px}

/* --- entrada em cascata: cada bloco sobe com um atraso --- */
@keyframes sobe{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes surge{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.anima>*{animation:sobe .52s cubic-bezier(.2,.85,.3,1) backwards}
.anima>*:nth-child(1){animation-delay:.02s}
.anima>*:nth-child(2){animation-delay:.08s}
.anima>*:nth-child(3){animation-delay:.14s}
.anima>*:nth-child(4){animation-delay:.2s}
.anima>*:nth-child(5){animation-delay:.26s}
.anima>*:nth-child(6){animation-delay:.32s}
.anima>*:nth-child(7){animation-delay:.38s}
.camada.on .painel,.camada.on .cartilha,.camada.on .quiz{animation:surge .26s cubic-bezier(.2,.9,.3,1.1)}


/* --- fita lilás decorativa --- */
.fita{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.fita i{display:block;height:5px;background:var(--lilas);flex:1;max-width:110px}
.fita svg{width:26px;height:26px;fill:var(--lilas-claro);animation:balanca 5s ease-in-out infinite}
@keyframes balanca{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

/* --- barra de progresso --- */
.trilho{height:10px;border-radius:2px;background:#120A2A;overflow:hidden;margin-top:9px;box-shadow:0 0 0 3px #2F1F58}
.trilho span{display:block;height:100%;background:var(--sol);
  animation:enche 1s cubic-bezier(.2,.85,.3,1) backwards}
@keyframes enche{from{width:0 !important}}
h1.titulo{font-family:var(--display);font-size:clamp(34px,8.4vw,70px);line-height:.86;margin:0;text-transform:uppercase;letter-spacing:-.035em;
  text-shadow:5px 5px 0 #160d2e}
h1.titulo .lilas{display:inline-block;color:var(--lilas-claro);
  animation:respira 4.5s ease-in-out infinite}
@keyframes respira{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
h2.sec{position:relative;padding-left:16px}
h2.sec::before{content:'';position:absolute;left:0;top:.12em;bottom:.18em;width:6px;background:var(--lilas)}
h2.sec{font-family:var(--display);font-size:clamp(20px,4.6vw,32px);margin:0 0 10px;text-transform:uppercase;letter-spacing:-.02em}
p{line-height:1.55;margin:0 0 12px}

.btn{font-family:var(--display);text-transform:uppercase;font-size:clamp(15px,3.4vw,19px);letter-spacing:.005em;
  border:0;border-radius:5px;padding:15px 22px;cursor:pointer;color:#1b0733;
  background:var(--sol);
  box-shadow:0 0 0 3px #160d2e, 0 5px 0 0 #160d2e, 0 5px 0 3px #160d2e, inset 0 -4px 0 rgba(0,0,0,.24);
  transition:transform .06s,box-shadow .06s;width:100%;display:block;position:relative}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 3px #160d2e, inset 0 -2px 0 rgba(0,0,0,.24)}
.btn:focus-visible{outline:3px solid var(--lilas-claro);outline-offset:3px}
.btn.roxo{background:var(--lilas-claro);color:#1b0733}
.btn.verde{background:var(--verde-claro);color:#042315}
.btn.vazio{background:#241640;color:var(--papel);
  box-shadow:0 0 0 3px #160d2e, 0 5px 0 0 #160d2e, 0 5px 0 3px #160d2e, inset 0 -4px 0 rgba(0,0,0,.3)}
.btn.vazio:hover{background:#2E1C52}
.linha-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.menu-caixa{width:min(1120px,100%);text-align:left;display:grid;gap:clamp(12px,2.2vw,26px);
  grid-template-columns:1fr;align-content:center;
  grid-template-areas:"heroi" "esq" "prog"}
.menu-esq{grid-area:esq;min-width:0}
.palco-heroi{grid-area:heroi}
.cartao-prog{grid-area:prog}
/* telas largas: texto à esquerda, Manu e progresso à direita */
@media (min-width:880px){
  .menu-caixa{grid-template-columns:1.12fr .88fr;align-items:center;
    grid-template-areas:"esq heroi" "esq prog"}
}
/* celular deitado: três colunas para caber tudo sem rolar */
@media (min-width:640px) and (max-height:560px){
  .menu-caixa{grid-template-columns:1.15fr auto .85fr;gap:16px;align-items:center;
    grid-template-areas:"esq heroi prog"}
  .menu-caixa .sub{margin:7px 0 9px}
  .menu-caixa .aviso{margin-top:9px;font-size:11px}
}

/* ---------- a Manu correndo na capa ----------
   A tira de quadros é gerada pelo próprio código de desenho do jogo e
   animada com steps(): é a personagem de verdade, não uma ilustração. */
.palco-heroi{position:relative;display:flex;justify-content:center;align-items:flex-end;isolation:isolate}
.palco-heroi .luz{display:none}
/* plataforma igual às do jogo: corpo escuro e faixa clara em cima */
.palco-heroi .piso{position:absolute;z-index:0;bottom:0;left:50%;transform:translateX(-50%);
  width:72%;height:18px;border-radius:3px;background:#3D1B70;
  box-shadow:0 0 0 3px #160d2e, inset 0 5px 0 var(--lilas-claro)}
.heroi{position:relative;z-index:1;overflow:hidden;height:clamp(128px,20vh,180px);margin-bottom:13px}
.heroi img{position:absolute;left:0;top:0;height:100%;width:800%;max-width:none;
  animation:correr .68s steps(8) infinite}
@media (min-width:880px){.heroi{height:clamp(180px,30vh,290px)}}
@media (min-width:640px) and (max-height:560px){.heroi{height:clamp(120px,42vh,190px)}}
@keyframes correr{from{transform:translateX(0)}to{transform:translateX(-100%)}}


/* ---------- fagulhas lilás subindo no fundo do menu ---------- */
.faiscas{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.faiscas i{position:absolute;bottom:-24px;width:7px;height:7px;border-radius:2px;
  background:var(--lilas-claro);opacity:0;animation:sobeFaisca linear infinite}
@keyframes sobeFaisca{
  0%{opacity:0;transform:translateY(0) rotate(0) scale(.6)}
  12%{opacity:.6}
  88%{opacity:.2}
  100%{opacity:0;transform:translateY(-96vh) rotate(260deg) scale(1)}}
.marca{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.marca .selo{font-family:var(--display);font-size:11.5px;background:var(--lilas-fundo);color:#fff;padding:7px 11px;border-radius:4px;
  letter-spacing:.04em;box-shadow:0 0 0 3px #160d2e}
.marca .selo.azul{background:#1B4FD8}
.sub{color:var(--papel-2);font-size:clamp(13px,1.9vw,16.5px);line-height:1.62;margin:14px 0 18px;max-width:46ch}
.menu-botoes{display:flex;flex-direction:column;gap:clamp(8px,1.4vw,11px)}
.aviso{margin-top:18px;font-size:12.5px;color:var(--papel-2);border-left:3px solid var(--lilas);padding:8px 0 8px 12px;line-height:1.5}
.aviso b{color:var(--lilas-claro)}

.painel{max-width:620px;width:100%}
.placar{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}
.placar div{background:#1B1036;border-radius:6px;padding:13px 10px;text-align:center;border:3px solid #2F1F58}
.placar .n{font-family:var(--display);font-size:clamp(21px,5vw,30px);color:var(--sol);line-height:1;text-shadow:2px 2px 0 #160d2e}
.placar .r{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--papel-2);margin-top:6px}
.canais{background:#241148;border:3px solid var(--lilas);border-radius:6px;padding:16px;margin:16px 0}
.canais h4{font-family:var(--display);font-size:15px;margin:0 0 10px;text-transform:uppercase;color:var(--lilas-claro)}
.canais ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.75}
.canais b{color:var(--sol);font-family:var(--mono)}

.quiz{max-width:640px;width:100%}
.quiz .pergunta{font-family:var(--display);font-size:clamp(19px,4.6vw,28px);text-transform:none;line-height:1.15;margin:8px 0 18px;letter-spacing:-.01em}
.opcoes{display:flex;flex-direction:column;gap:9px}
.opcao{text-align:left;background:#1B1036;border:3px solid #2F1F58;color:var(--papel);
  padding:14px 16px;border-radius:6px;font-size:15px;font-family:var(--corpo);cursor:pointer;line-height:1.35;width:100%;transition:.12s}
.opcao:hover{border-color:var(--lilas-claro);background:rgba(168,85,247,.12)}
.opcao:focus-visible{outline:3px solid var(--lilas-claro);outline-offset:2px}
.opcao.certa{border-color:var(--verde-claro);background:rgba(67,224,152,.16)}
.opcao.errada{border-color:var(--alerta);background:rgba(255,84,112,.14)}
.opcao b{font-family:var(--mono);margin-right:8px;color:var(--papel-2)}
.feedback{margin-top:16px;padding:14px 16px;border-radius:11px;font-size:14.5px;line-height:1.55;display:none}
.feedback.on{display:block}
.feedback.ok{background:rgba(25,179,107,.16);border-left:4px solid var(--verde-claro)}
.feedback.nao{background:rgba(255,84,112,.14);border-left:4px solid var(--alerta)}

.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px;margin:16px 0 20px}
.verbete{background:#1B1036;border:3px solid #2F1F58;border-radius:6px;padding:13px 14px;border-left:6px solid var(--lilas)}
.verbete h4{font-family:var(--display);font-size:14px;margin:0 0 6px;text-transform:uppercase;line-height:1.1}
.verbete p{font-size:12.8px;color:var(--papel-2);margin:0;line-height:1.45}
.verbete.travado{border-left-color:rgba(199,190,230,.2);opacity:.4}
.verbete .fonte{font-family:var(--mono);font-size:10px;color:var(--lilas-claro);margin-top:8px;letter-spacing:.04em}
.cartilha{max-width:860px;width:100%}
.fases-lista{display:grid;gap:9px;margin:16px 0 18px}
.fase-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;cursor:pointer;
  background:#1B1036;border:3px solid #2F1F58;border-radius:6px;padding:12px 14px;color:var(--papel);transition:.12s}
.fase-card:hover{border-color:var(--lilas);background:#241548}
.fase-card.travado{opacity:.38;cursor:default}
.fase-card .num{font-family:var(--display);font-size:24px;color:var(--sol);min-width:30px;text-align:center}
.fase-card .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.fase-card .txt b{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.01em}
.fase-card .txt i{font-style:normal;font-size:12.2px;color:var(--papel-2)}
.bichos{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin:16px 0 20px}
.bicho{display:flex;gap:14px;background:#1B1036;border:3px solid #2F1F58;border-radius:6px;padding:13px;align-items:flex-start}
.bicho.travado{opacity:.42}
.bicho .retrato{flex:0 0 76px;height:76px;border-radius:5px;background:#120A2A;
  border:3px solid #2F1F58;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bicho .retrato img{width:100%;height:100%;object-fit:contain;image-rendering:auto}
.bicho .retrato span{font-family:var(--display);font-size:26px;color:rgba(199,190,230,.4)}
.bicho .dados{flex:1;min-width:0}
.bicho h4{font-family:var(--display);font-size:14.5px;margin:2px 0 7px;text-transform:uppercase;line-height:1.1;color:var(--papel)}
.bicho p{font-size:12.8px;color:var(--papel-2);margin:0;line-height:1.5}
.bicho .como{margin-top:9px;font-size:12.2px;color:var(--verde-claro);border-top:1px dashed rgba(199,190,230,.22);padding-top:8px;line-height:1.45}
.bicho .como b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--papel-2);margin-bottom:3px}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.aba{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;border-radius:5px;
  background:#1B1036;border:3px solid #2F1F58;color:var(--papel-2);cursor:pointer;transition:.12s}
.aba:hover{border-color:var(--lilas);color:var(--papel)}
.aba.on{background:var(--lilas);border-color:var(--lilas);color:#fff}
.palavra{display:flex;gap:6px;margin:10px 0 0}
.palavra span{font-family:var(--display);font-size:15px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;background:rgba(255,255,255,.06);border:1.5px solid rgba(199,190,230,.25);color:var(--papel-2)}
.palavra span.tem{background:var(--sol);border-color:var(--sol);color:#1b0733}
/* seletor de fases */
.fases{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0 0}
.fases button{background:#1B1036;border:3px solid #2F1F58;border-radius:5px;color:var(--papel-2);
  padding:9px 4px;cursor:pointer;font-family:var(--display);font-size:15px;line-height:1;transition:.12s}
.fases button b{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.08em;
  margin-top:5px;font-weight:400;opacity:.75}
.fases button:hover:not(:disabled){border-color:var(--lilas);color:var(--papel)}
.fases button.atual{background:var(--lilas);border-color:var(--lilas);color:#fff}
.fases button:disabled{opacity:.32;cursor:default}
/* chave liga/desliga */
.chave{display:flex;align-items:center;gap:11px;width:100%;background:#1B1036;border:3px solid #2F1F58;
  border-radius:5px;padding:11px 13px;cursor:pointer;color:var(--papel);text-align:left;font-family:var(--corpo)}
.chave:hover{border-color:var(--lilas)}
.chave i{flex:0 0 42px;height:22px;border-radius:3px;background:#120A2A;position:relative;transition:.14s}
.chave i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:2px;
  background:#5A4C7A;transition:.14s}
.chave.on i{background:var(--verde)}
.chave.on i::after{left:23px;background:#F4F1FF}
.chave span{font-size:13px;line-height:1.35}
.chave span b{display:block;font-family:var(--display);font-size:12.5px;text-transform:uppercase;margin-bottom:2px}
.chave span em{font-style:normal;color:var(--papel-2);font-size:11.5px}

#dialogo{position:absolute;left:50%;bottom:calc(122px + var(--safe-b));transform:translateX(-50%);width:min(700px,calc(100% - 24px));
  background:rgba(18,10,42,.97);border:2px solid var(--lilas);border-radius:14px;padding:15px 17px;z-index:15;display:none;
  box-shadow:0 14px 40px rgba(0,0,0,.55)}
#dialogo.on{display:block}
#dialogo .quem{font-family:var(--display);font-size:12px;letter-spacing:.09em;color:var(--lilas-claro);text-transform:uppercase;margin-bottom:6px}
#dialogo .fala{font-size:15px;line-height:1.5}
#dialogo .toque{font-family:var(--mono);font-size:10.5px;color:var(--papel-2);margin-top:9px;letter-spacing:.09em}

#faixa{position:absolute;top:calc(86px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:14;
  background:var(--lilas);color:#fff;font-family:var(--display);font-size:13px;padding:10px 18px;
  border-radius:10px;text-transform:uppercase;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center;max-width:90vw;letter-spacing:.02em}
#faixa.on{opacity:1;transform:translateX(-50%) translateY(4px)}
#faixa.verde{background:var(--verde)}
#faixa.sol{background:var(--sol);color:#1b0733}
#faixa.quemé{background:linear-gradient(180deg,rgba(18,10,42,.96),rgba(30,16,58,.96));border:2px solid var(--sol);
  color:var(--sol);text-transform:none;font-family:var(--corpo);font-weight:700;font-size:14.5px;letter-spacing:0}
#faixa.mural{background:rgba(18,10,42,.94);border:2px solid var(--lilas-claro);color:var(--lilas-claro);text-transform:none;font-family:var(--corpo);font-weight:600;font-size:14px}

/* CONTROLES: só esquerda, direita e pular */
#toques{position:absolute;inset:0;z-index:12;display:none;pointer-events:none}
#toques.on{display:block}
.tecla{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:rgba(244,241,255,.14);border:2.5px solid rgba(244,241,255,.4);
  color:var(--papel);user-select:none;-webkit-user-select:none;backdrop-filter:blur(3px);transition:background .08s,transform .08s}
.tecla.press{background:rgba(255,197,61,.6);border-color:var(--sol);transform:scale(.93)}
.tecla svg{width:50%;height:50%;fill:currentColor;pointer-events:none}
#t-esq,#t-dir{width:82px;height:82px;bottom:calc(22px + var(--safe-b))}
#t-esq{left:calc(18px + var(--safe-l))}
#t-dir{left:calc(114px + var(--safe-l))}
#t-pulo{width:98px;height:98px;right:calc(18px + var(--safe-r));bottom:calc(20px + var(--safe-b));
  background:rgba(67,224,152,.26);border-color:rgba(67,224,152,.66)}
#t-voz{width:80px;height:80px;right:calc(126px + var(--safe-r));bottom:calc(54px + var(--safe-b));

<script>
/* ============================================================
   SE LIGA MOÇADA — A JORNADA
   Jogo de plataforma sobre direitos no estágio, assédio
   e enfrentamento à violência contra a mulher.
   Um único arquivo, sem dependências externas.
   ============================================================ */
(function(){
'use strict';

/* ---------- 1. Utilidades ---------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sign=v=>v<0?-1:(v>0?1:0);
const aprox=(v,alvo,passo)=>v<alvo?Math.min(v+passo,alvo):Math.max(v-passo,alvo);
function bate(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function dist(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- 2. Guardar progresso (com reserva em memória) ---------- */
const Memoria={};
const Guarda={
  ler(chave,padrao){
    try{const v=window.localStorage.getItem('slm_'+chave);if(v!==null)return JSON.parse(v);}catch(e){}
    return (chave in Memoria)?Memoria[chave]:padrao;
  },
  gravar(chave,valor){
    Memoria[chave]=valor;
    try{window.localStorage.setItem('slm_'+chave,JSON.stringify(valor));}catch(e){}
  }
};

/* ---------- 3. Som (sintetizado, sem arquivos) ---------- */
const Som={
  ctx:null,ligado:Guarda.ler('som',true),ganho:null,musicaAtiva:false,mTimer:0,mPasso:0,mEscala:[],
  inicia(){
    if(this.ctx)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      this.ctx=new AC();
      this.ganho=this.ctx.createGain();
      this.ganho.gain.value=this.ligado?.5:0;
      this.ganho.connect(this.ctx.destination);
    }catch(e){this.ctx=null;}
  },
  acorda(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  alterna(){
    this.ligado=!this.ligado;
    Guarda.gravar('som',this.ligado);
    if(this.ganho)this.ganho.gain.value=this.ligado?.5:0;
    return this.ligado;
  },
  nota(freq,dur,tipo='square',vol=.18,desafina=0){
    if(!this.ctx||!this.ligado)return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=tipo;o.frequency.setValueAtTime(freq,t);
    if(desafina)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+desafina),t+dur);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(this.ganho);o.start(t);o.stop(t+dur+.02);
  },
  ruido(dur,vol=.14,corte=900){
    if(!this.ctx||!this.ligado)return;
    const t=this.ctx.currentTime,n=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource();s.buffer=buf;
    const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=corte;
    const g=this.ctx.createGain();g.gain.value=vol;
    s.connect(f);f.connect(g);g.connect(this.ganho);s.start(t);
  },
  pulo(){this.nota(340,.13,'square',.13,220);},
  impacto(){this.nota(110,.3,'sawtooth',.17,-45);this.ruido(.22,.16,420);},
  voz(){this.nota(720,.1,'sawtooth',.08,-300);},
  bloqueado(){this.nota(160,.14,'square',.1);},
  acerto(){this.nota(200,.09,'square',.14,-110);this.ruido(.09,.1,1400);},
  morte(){this.nota(150,.3,'sawtooth',.13,-110);},
  moeda(){this.nota(880,.06,'square',.1);setTimeout(()=>this.nota(1320,.09,'square',.09),55);},
  vida(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.nota(f,.13,'triangle',.11),i*70));},
  dano(){this.nota(180,.22,'sawtooth',.16,-90);this.ruido(.14,.12,600);},
  quiz(ok){
    if(ok)[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.nota(f,.15,'square',.1),i*90));
    else{this.nota(300,.18,'sawtooth',.12);setTimeout(()=>this.nota(200,.28,'sawtooth',.12),160);}
  },
  fase(){[392,523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>this.nota(f,.2,'triangle',.11),i*95));},
  chefe(){this.nota(90,.5,'sawtooth',.16,-30);},
  /* trilha ambiente simples: arpejo lento que muda por fase */
  tocaMusica(dt,escala,bpm){
    if(!this.ctx||!this.ligado)return;
    this.mTimer-=dt;
    if(this.mTimer<=0){
      this.mTimer=60/bpm;
      const n=escala[this.mPasso%escala.length];
      this.nota(n,.34,'triangle',.038);
      if(this.mPasso%4===0)this.nota(n/2,.5,'sine',.05);
      this.mPasso++;
    }
  }
};

/* ---------- 3b. Folha de sprites (opcional) ----------
   Se não houver folha configurada, ou se ela falhar em carregar,
   o jogo continua com a Manu desenhada por código. Nunca quebra. */
const Sprites={
  img:null,pronto:false,erro:false,cfg:null,
  carrega(cfg){
    this.cfg=cfg;
    if(!cfg||!cfg.fonte)return;
    const im=new Image();
    im.onload=()=>{
      if(!cfg.larg||!cfg.alt){
        let maior=0;
        for(const k in cfg.poses)for(const q of cfg.poses[k].q)if(q>maior)maior=q;
        cfg.larg=cfg.larg||Math.round(im.width/(maior+1));
        cfg.alt=cfg.alt||im.height;
      }
      this.img=im;this.pronto=true;
    };
    im.onerror=()=>{
      this.erro=true;
      if(window.console)console.warn('Folha de sprites não carregou; usando a Manu desenhada.');
    };
    im.src=cfg.fonte;
  }
};

/* ---------- 4. Entrada: teclado, toque e gamepad ---------- */
const Ent={
  esq:false,dir:false,baixo:false,pulo:false,puloNovo:false,
  voz:false,vozNova:false,qualquer:false,qualquerNova:false,
  _mapa:{
    'ArrowLeft':'esq','KeyA':'esq','ArrowRight':'dir','KeyD':'dir',
    'ArrowDown':'baixo','KeyS':'baixo',
    'Space':'pulo','KeyZ':'pulo','KeyW':'pulo','ArrowUp':'pulo',
    'KeyX':'voz','KeyK':'voz','KeyF':'voz','Enter':'voz'
  },
  _antes:{},
  inicia(){
    addEventListener('keydown',e=>{
      const a=this._mapa[e.code];
      if(a){this[a]=true;e.preventDefault();}
      this.qualquer=true;
      if(e.code==='Escape'||e.code==='KeyP')Jogo.pedePausa();
      if(e.code==='KeyM')Interface.alternaSom();
      Som.inicia();Som.acorda();
    },{passive:false});
    addEventListener('keyup',e=>{
      const a=this._mapa[e.code];
      if(a){this[a]=false;e.preventDefault();}
      this.qualquer=false;
    },{passive:false});
    addEventListener('blur',()=>{this.esq=this.dir=this.baixo=this.pulo=this.voz=false;});
    this.iniciaToques();
  },
  iniciaToques(){
    const liga=(id,acao)=>{
      const el=document.getElementById(id);
      if(!el)return;
      const on=e=>{e.preventDefault();this[acao]=true;this.qualquer=true;el.classList.add('press');Som.inicia();Som.acorda();};
      const off=e=>{e.preventDefault();this[acao]=false;this.qualquer=false;el.classList.remove('press');};
      el.addEventListener('pointerdown',on);
      el.addEventListener('pointerup',off);
      el.addEventListener('pointercancel',off);
      el.addEventListener('pointerleave',off);
      el.addEventListener('contextmenu',e=>e.preventDefault());
    };
    liga('t-esq','esq');liga('t-dir','dir');liga('t-pulo','pulo');liga('t-voz','voz');
  },
  gamepad(){
    if(!navigator.getGamepads)return;
    const gs=navigator.getGamepads();
    for(const g of gs){
      if(!g)continue;
      const eixo=g.axes[0]||0;
      if(eixo<-.35)this.esq=true;
      if(eixo>.35)this.dir=true;
      if(g.buttons[14]&&g.buttons[14].pressed)this.esq=true;
      if(g.buttons[15]&&g.buttons[15].pressed)this.dir=true;
      if(g.buttons[0]&&g.buttons[0].pressed)this.pulo=true;
      if(g.buttons[12]&&g.buttons[12].pressed)this.pulo=true;
      if(g.buttons[2]&&g.buttons[2].pressed)this.voz=true;
      break;
    }
  },
  atualiza(){
    this.gamepad();
    this.puloNovo=this.pulo&&!this._antes.pulo;
    this.vozNova=this.voz&&!this._antes.voz;
    this.qualquerNova=this.qualquer&&!this._antes.qualquer;
    this._antes.pulo=this.pulo;
    this._antes.voz=this.voz;
    this._antes.qualquer=this.qualquer;
  }
};

/* ---------- 5. Tela e câmera ---------- */
const tela=document.getElementById('tela');
const ctx=tela.getContext('2d',{alpha:false});
const Vista={
  larg:1024,alt:576,escala:1,dpr:1,cssL:0,cssA:0,retrato:false,
  redimensiona(){
    const l=window.innerWidth,a=window.innerHeight;
    this.cssL=l;this.cssA=a;
    this.retrato=a>l;
    this.dpr=Math.min(window.devicePixelRatio||1,2);
    tela.width=Math.floor(l*this.dpr);
    tela.height=Math.floor(a*this.dpr);
    tela.style.width=l+'px';tela.style.height=a+'px';
    const minL=this.retrato?760:1060, minA=this.retrato?520:560;
    this.escala=Math.min(l/minL,a/minA);
    this.escala=Math.min(this.escala,2.4);
    this.larg=l/this.escala;
    this.alt=a/this.escala;
    Interface.checaOrientacao();
  }
};
const Cam={
  x:0,y:0,alvoX:0,alvoY:0,tremor:0,tremorX:0,tremorY:0,zoom:1,zoomAlvo:1,
  segue(p,mundo,dt,instantaneo){
    const olhar=clamp(p.vx*.45,-140,140);
    this.alvoX=p.x+p.w/2-Vista.larg/2+olhar;
    this.alvoY=p.y+p.h/2-Vista.alt*.56;
    const maxX=Math.max(0,mundo.larg-Vista.larg);
    const maxY=Math.max(0,mundo.alt-Vista.alt);
    this.alvoX=clamp(this.alvoX,0,maxX);
    this.alvoY=Vista.alt>=mundo.alt?(mundo.alt-Vista.alt)/2:clamp(this.alvoY,0,maxY);
    if(instantaneo){this.x=this.alvoX;this.y=this.alvoY;}
    else{
      const k=1-Math.pow(.0006,dt);
      this.x=lerp(this.x,this.alvoX,k);
      this.y=lerp(this.y,this.alvoY,k);
    }
    if(this.tremor>0){
      this.tremor=Math.max(0,this.tremor-dt*2.6);
      const f=this.tremor*this.tremor*16;
      this.tremorX=rnd(-f,f);this.tremorY=rnd(-f,f);
    }else{this.tremorX=this.tremorY=0;}
    /* soco de zoom: estica rápido e volta devagar */
    this.zoomAlvo=aprox(this.zoomAlvo,1,dt*.9);
    this.zoom=lerp(this.zoom,this.zoomAlvo,1-Math.pow(.0001,dt));
  },
  sacode(f){if(Jogo.menosMovimento)return;this.tremor=Math.max(this.tremor,f*.6);},
  soco(f){if(Jogo.menosMovimento)return;f*=.45;this.zoomAlvo=Math.max(this.zoomAlvo,1+f);this.zoom=Math.max(this.zoom,1+f*.7);},
  get ox(){return this.x+this.tremorX;},
  get oy(){return this.y+this.tremorY;}
};

/* ---------- 6. Partículas ---------- */
const Part={
  lista:[],
  solta(x,y,n,cor,op={}){
    const vel=op.vel||160,vida=op.vida||.6,tam=op.tam||4,grav=op.grav===undefined?900:op.grav;
    for(let i=0;i<n;i++){
      const a=op.ang!==undefined?op.ang+rnd(-.7,.7):rnd(0,Math.PI*2);
      const v=rnd(vel*.35,vel);
      this.lista.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(op.sobe||0),
        vida:rnd(vida*.6,vida),max:vida,cor:Array.isArray(cor)?pick(cor):cor,
        tam:rnd(tam*.5,tam),grav,quad:op.quad!==false});
    }
    if(this.lista.length>460)this.lista.splice(0,this.lista.length-460);
  },
  texto(x,y,txt,cor){
    this.lista.push({x,y,vx:0,vy:-58,vida:1.05,max:1.05,cor,tam:0,grav:0,txt});
  },
  atualiza(dt){
    for(let i=this.lista.length-1;i>=0;i--){
      const p=this.lista[i];
      p.vida-=dt;
      if(p.vida<=0){this.lista.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;
      if(p.grav>0)p.vx*=.985;
    }
  },
  desenha(g){
    for(const p of this.lista){
      const a=clamp(p.vida/p.max,0,1);
      g.globalAlpha=a;
      if(p.txt){
        g.fillStyle=p.cor;
        g.font='700 17px '+'system-ui,sans-serif';
        g.textAlign='center';
        g.fillText(p.txt,p.x,p.y);
        g.textAlign='left';
      }else{
        g.fillStyle=p.cor;
        const t=p.tam*(.4+a*.6);
        g.fillRect(p.x-t/2,p.y-t/2,t,t);
      }
    }
    g.globalAlpha=1;
  },
  limpa(){this.lista.length=0;}
};
/* ============================================================

/* ============================================================
   8. MUNDO E FÍSICA
   ============================================================ */
const GRAV=2250, GRAV_MAX=1250;
/* Gravidade assimétrica: sobe leve, desce pesado. */
const GRAV_SOBE=2000, GRAV_DESCE=2750, VEL_PULO=790;
const QUEDA_FORTE=165;   /* cair mais que isso vira impacto */

const Mundo={
  larg:4000,alt:1100,chaoY:900,solidos:[],inimigos:[],itens:[],projeteis:[],perigos:[],
  enfeites:[],npcs:[],murais:[],dicas:[],checkpoints:[],saida:null,nascer:{x:120,y:400},chefe:null,portao:null,
  limpa(){
    this.solidos=[];this.inimigos=[];this.itens=[];this.projeteis=[];this.perigos=[];
    this.enfeites=[];this.npcs=[];this.murais=[];this.dicas=[];this.checkpoints=[];this.saida=null;this.chefe=null;this.portao=null;
  }
};

function ativo(s){return !s.removido && !(s.quebrando&&s.sumiu);}

/* Acha um ponto livre de paredes perto de (x,y). Usado por quem reaparece
   ou se copia: sem isso, o bicho nasce dentro do cenário. */
function lugarLivre(x,y,w,h,raioX,raioY,precisaChao){
  for(let t=0;t<12;t++){
    const tx=clamp(x+(t?rnd(-raioX,raioX):0),20,Mundo.larg-w-20);
    const ty=y+(t?rnd(-raioY,raioY):0);
    const caixa={x:tx,y:ty,w,h};
    let livre=true;
    for(const s of Mundo.solidos){
      if(!ativo(s)||s.tipo==='passagem')continue;
      if(bate(caixa,s)){livre=false;break;}
    }
    /* quem anda no chão não pode reaparecer sobre um buraco */
    if(livre&&precisaChao&&!chaoEm(tx+w/2,ty+h+2,90))livre=false;
    if(livre)return{x:tx,y:ty};
  }
  return null;
}

/* Existe chão logo abaixo deste ponto? (impede que inimigos caiam nos buracos) */
function chaoEm(x,y,alcance){
  alcance=alcance||46;
  const sonda={x:x-3,y:y,w:6,h:alcance};
  for(const s of Mundo.solidos){
    if(!ativo(s))continue;
    if(s.tipo==='passagem'&&s.y<y)continue;
    if(bate(sonda,s))return true;
  }
  return false;
}
function paredeEm(x,y,h){
  const sonda={x:x-4,y:y-h+6,w:8,h:h-10};
  for(const s of Mundo.solidos){
    if(!ativo(s)||s.tipo==='passagem')continue;
    if(bate(sonda,s))return true;
  }
  return false;
}

function moveCorpo(e,dt){
  e.noChao=false;e.encostouParede=false;e.bateuTeto=false;e.plataforma=null;
  const passos=Math.max(1,Math.ceil(Math.max(Math.abs(e.vx*dt),Math.abs(e.vy*dt))/12));
  const sdt=dt/passos;
  for(let p=0;p<passos;p++){
    e.x+=e.vx*sdt;
    for(const s of Mundo.solidos){
      if(!ativo(s)||s.tipo==='passagem')continue;
      if(!bate(e,s))continue;
      if(e.vx>0){e.x=s.x-e.w;e.encostouParede=true;}
      else if(e.vx<0){e.x=s.x+s.w;e.encostouParede=true;}
      e.vx=0;
    }
    const antesBaixo=e.y+e.h;
    e.y+=e.vy*sdt;
    for(const s of Mundo.solidos){
      if(!ativo(s))continue;
      if(s.tipo==='passagem'){
        if(e.vy<0)continue;
        if(e.descendo)continue;
        if(antesBaixo>s.y+8)continue;
      }
      if(!bate(e,s))continue;
      if(e.vy>0){
        e.y=s.y-e.h;e.vy=0;e.noChao=true;e.plataforma=s;
        if(s.quebrando&&!s.caindo){s.caindo=true;s.timer=.45;}
      }else if(e.vy<0){e.y=s.y+s.h;e.vy=0;e.bateuTeto=true;}
    }
  }
  /* a Manu já foi carregada em atualizaSolidos, antes da física dela */
  if(e!==Jog&&e.plataforma&&e.plataforma.movel){
    e.x+=e.plataforma.dx;
    e.y+=e.plataforma.dy;
  }
}

/* ============================================================
   9. MANU — só anda e pula. Tudo o mais nasce disso.
   ============================================================ */
const Jog={
  x:0,y:0,w:30,h:52,vx:0,vy:0,dir:1,noChao:false,plataforma:null,
  vida:4,vidaMax:5,invul:0,piscar:0,
  coyote:0,bufferPulo:0,
  animCaminho:0,esticaX:1,esticaY:1,descendo:false,rabo:0,
  vivo:true,morrendoTimer:0,
  quedaDe:null,impactoBrilho:0,combo:0,comboT:0,
  vozRecarga:0,vozCarga:0,podeCarregar:false,
  pontos:0,quedas:0,

  reinicia(nasce){
    this.x=nasce.x;this.y=nasce.y;this.vx=0;this.vy=0;
    this.invul=1.1;this.vivo=true;this.morrendoTimer=0;
    this.quedaDe=null;this.combo=0;this.vozCarga=0;this.vozRecarga=0;
  },
  novaFase(n){this.podeCarregar=n>=3;},

  atualiza(dt){
    if(!this.vivo){
      this.morrendoTimer-=dt;
      this.vy+=GRAV*dt*.6;
      this.y+=this.vy*dt;
      if(this.morrendoTimer<=0)Jogo.reviveJogador();
      return;
    }
    if(this.invul>0){this.invul-=dt;this.piscar+=dt*22;}
    if(this.impactoBrilho>0)this.impactoBrilho-=dt*2.6;
    if(this.comboT>0){this.comboT-=dt;if(this.comboT<=0)this.combo=0;}
    this.descendo=Ent.baixo;

    /* --- andar --- */
    const vMax=330, acel=this.noChao?2500:1650, atrito=this.noChao?2800:820;
    let alvo=0;
    if(Ent.esq)alvo-=1;
    if(Ent.dir)alvo+=1;
    if(alvo!==0){
      this.vx=aprox(this.vx,alvo*vMax,acel*dt);
      this.dir=alvo;
      this.animCaminho+=dt;
    }else{
      this.vx=aprox(this.vx,0,atrito*dt);
      this.animCaminho=0;
    }

    /* --- pular (com coyote time e buffer, um pulo só) --- */
    if(this.noChao)this.coyote=.11;
    else if(this.coyote>0)this.coyote-=dt;
    if(Ent.puloNovo)this.bufferPulo=.13;
    else if(this.bufferPulo>0)this.bufferPulo-=dt;

    if(this.bufferPulo>0&&this.coyote>0){
      this.vy=-VEL_PULO;this.coyote=0;this.bufferPulo=0;
      this.esticaX=.78;this.esticaY=1.26;
      Som.pulo();
      Part.solta(this.x+this.w/2,this.y+this.h,7,['#C7BEE6','#C99BFF'],{vel:130,vida:.35,tam:4,ang:-Math.PI/2});
    }
    if(!Ent.pulo&&this.vy<-300)this.vy=-300;

    /* --- a voz --- */
    if(this.vozRecarga>0)this.vozRecarga-=dt;
    if(this.podeCarregar&&Ent.voz&&this.vozRecarga<=0){
      this.vozCarga=Math.min(this.vozCarga+dt,.55);
      if(this.vozCarga>=.55&&Math.random()<.4)
        Part.solta(this.x+this.w/2+this.dir*20,this.y+18,1,['#A855F7','#FFC53D'],{vel:70,vida:.3,tam:4,grav:-40});
    }
    const soltou=this.podeCarregar?(!Ent.voz&&this.vozCarga>0):Ent.vozNova;
    if(soltou&&this.vozRecarga<=0){
      const forte=this.vozCarga>=.5;
      this.disparaVoz(forte);
      this.vozCarga=0;
      this.vozRecarga=forte?.5:.32;
    }

    /* --- física + medida da queda --- */
    const antesNoChao=this.noChao;
    const gr=this.vy<0?GRAV_SOBE:GRAV_DESCE;
    this.vy=Math.min(this.vy+gr*dt,GRAV_MAX);
    if(this.vy>0&&this.quedaDe===null)this.quedaDe=this.y;
    if(this.vy<0)this.quedaDe=null;

    moveCorpo(this,dt);

    if(this.noChao&&!antesNoChao&&this.quedaDe!==null){
      const queda=this.y-this.quedaDe;
      if(queda>=QUEDA_FORTE)this.impacto(queda);
      else if(queda>60){
        this.esticaX=1.18;this.esticaY=.84;
        Som.ruido(.06,.05,500);
      }
      this.quedaDe=null;
    }
    if(this.noChao)this.quedaDe=null;

    this.esticaX=aprox(this.esticaX,1,dt*4.2);
    this.esticaY=aprox(this.esticaY,1,dt*4.2);
    this.rabo=lerp(this.rabo,clamp(-this.vx*.05,-14,14),1-Math.pow(.002,dt));

    this.x=clamp(this.x,0,Mundo.larg-this.w);
    if(this.y>Mundo.alt+120)this.caiNoBuraco();
  },

  disparaVoz(forte){
    Som.voz();
    const px=this.x+this.w/2+this.dir*20, py=this.y+20;
    Mundo.projeteis.push({
      x:px-10,y:py-10,w:20,h:20,vx:this.dir*(forte?740:570),vy:0,
      dono:'jogador',dano:forte?2:1,vida:forte?1.3:1,
      atravessa:forte,forte:forte,raio:forte?18:12,anim:0
    });
    this.esticaX=1.14;this.esticaY=.9;
    Part.solta(px,py,forte?12:5,forte?['#A855F7','#FFC53D','#FFFFFF']:['#C99BFF','#FFFFFF'],
      {vel:forte?200:110,vida:.35,tam:forte?6:4,grav:0,ang:this.dir>0?0:Math.PI});
    if(forte)Cam.sacode(.2);
  },

  /* Queda de altura: racha muros e derruba quem estiver perto */
  impacto(queda){
    const forca=clamp((queda-QUEDA_FORTE)/300,0,1);
    this.esticaX=1.4;this.esticaY=.62;
    this.impactoBrilho=1;
    Cam.sacode(.35+forca*.4);
    Cam.soco(.045+forca*.03);
    Jogo.trava(.085);
    Som.impacto();
    const cx=this.x+this.w/2, py=this.y+this.h;
    for(let i=0;i<16;i++){
      const lado=i%2?1:-1;
      Part.solta(cx+lado*rnd(4,40),py,1,['#FFC53D','#F4F1FF','#C99BFF'],
        {vel:190,vida:.45,tam:5,grav:700,ang:lado>0?-.35:Math.PI+.35});
    }
    Mundo.enfeites.push({tipo:'onda',x:cx,y:py,r:10,max:150+forca*90,vida:.4});

    for(const e of Mundo.inimigos){
      if(!e.vivo)continue;
      const ecx=e.x+e.w/2, ecy=e.y+e.h/2;
      /* muro: a onda de choque da queda racha o "sempre foi assim" */
      if(e.tipo==='muro'){
        const perto=cx>e.x-135&&cx<e.x+e.w+135;
        const naAltura=py>e.y-20&&py<e.y+e.h+50;
        if(perto&&naAltura)machucaInimigo(e,99);
        continue;
      }
      if(Math.abs(ecy-py)>110)continue;
      const d=Math.abs(ecx-cx);
      if(d>150)continue;
      if(e.def.pisavel)machucaInimigo(e,2);
      else{e.atordoado=1.6;e.piscar=.2;}
    }
  },

  leva(dano,deX){
    if(this.invul>0||!this.vivo)return;
    this.vida-=dano;
    this.invul=Jogo.assistido?2.1:1.35;
    this.combo=0;
    Som.dano();
    Cam.sacode(.45);
    Jogo.trava(.06);
    const d=deX!==undefined?(sign(this.x+this.w/2-deX)||1):-this.dir;
    this.vx=d*290;this.vy=-330;
    Part.solta(this.x+this.w/2,this.y+this.h/2,14,['#FF5470','#FFC53D'],{vel:230,vida:.55,tam:5});
    Part.texto(this.x+this.w/2,this.y-6,'-'+dano,'#FF5470');
    if(this.vida<=0)this.morre();
  },
  caiNoBuraco(){
    if(!this.vivo)return;
    this.quedas++;
    if(!Jogo.assistido)this.vida-=1;   /* no modo tranquilo o buraco não custa coração */
    Som.morte();
    if(this.vida<=0){this.morre();return;}
    Interface.faixa('Cuidado com os buracos','sol');
    Jogo.reviveJogador();
  },
  morre(){
    this.vivo=false;this.vida=0;this.morrendoTimer=1.15;
    this.vy=-470;this.vx=0;this.quedas++;
    Som.morte();Cam.sacode(.7);
    Part.solta(this.x+this.w/2,this.y+this.h/2,26,['#FF5470','#C99BFF','#F4F1FF'],{vel:300,vida:.9,tam:6});
  },
  cura(n){
    if(this.vida>=this.vidaMax)return false;
    this.vida=Math.min(this.vidaMax,this.vida+n);
    Som.vida();
    Part.texto(this.x+this.w/2,this.y-6,'+'+n,'#43E098');
    return true;
  },
  /* quique ao derrubar alguém, com combo se emendar */
  quica(forte){
    Jogo.trava(forte?.07:.045);
    this.vy=forte?-620:-540;
    this.esticaX=1.24;this.esticaY=.78;
    this.combo++;this.comboT=1.4;
    if(this.combo>1){
      Part.texto(this.x+this.w/2,this.y-14,this.combo+'x',this.combo>2?'#FFC53D':'#43E098');
      this.pontos+=this.combo*40;
      Som.nota(520+this.combo*90,.1,'square',.09);
    }
  },
  ganha(p){this.pontos+=p;}
};

/* ============================================================
   10. INIMIGOS
   Cada um cai de um jeito. Só com andar e pular.
   ============================================================ */
const TIPOS={
  /* pisar em cima */
  piada:{nome:'Foi Só Brincadeira',w:48,h:44,vida:1,vel:66,cor:'#E08A2E',cor2:'#FFF0D6',
    pisavel:true,como:'pisar ou usar a voz',pontos:60},
  /* pisar, mas só com a tampa aberta */
  rotulo:{nome:'Lugar de Mulher',w:44,h:44,vida:2,vel:52,cor:'#8C6A44',cor2:'#D8A96A',
    pisavel:true,blindaFechado:true,como:'pisar ou gritar com a tampa aberta',pontos:90,
    recado:'Fechado ele aguenta tudo. Espere a tampa abrir.'},
  /* estourar por baixo */
  comentario:{nome:'Comentário',w:40,h:40,vida:2,vel:0,cor:'#2B4FA8',cor2:'#8FB6FF',
    pisavel:false,voa:true,como:'estourar por baixo ou calar com a voz',pontos:110,
    recado:'Por cima ele te acerta. Estoure por baixo — ou grite.'},
  /* pisar (são a guarda do Alfa) */
  seguidor:{nome:'Seguidor',w:26,h:26,vida:1,vel:0,cor:'#3E5FB5',cor2:'#A9C4FF',
    pisavel:true,voa:true,como:'pisar',pontos:70},
  /* o irmão. Não é discurso: é gente. Golpe nenhum funciona. */
  alfa:{nome:'O Alfa',w:56,h:66,vida:3,vel:52,cor:'#1E2A5C',cor2:'#6E86D8',
    pisavel:true,protegido:true,como:'derrubar os seguidores primeiro',pontos:260,
    recado:'Com plateia ele não cai. Derrube os seguidores primeiro.'},
  /* levar até um buraco */
  ciume:{nome:'O Ciúme',w:38,h:50,vida:4,vel:104,cor:'#6B1B3A',cor2:'#FF7AA8',
    pisavel:false,como:'levar até um buraco, ou insistir na voz',pontos:200,
    recado:'Espinho em cima: pisar não dá. Ele fica cego quando persegue.'},
  /* cair em cima de bem alto */
  /* Fase 1 — manda onda rasteira; fica exposta ao se recuperar */
  cobranca:{nome:'A Cobrança',w:46,h:54,vida:2,vel:34,cor:'#B0512E',cor2:'#FFB27A',
    pisavel:true,como:'pular a onda e pisar na recuperação',pontos:150,
    recado:'Ela manda onda pelo chão. Pule a onda e pise depois.'},
  /* Fase 2 — anda em bando; os outros aceleram quando um cai */
  turma:{nome:'A Turma',w:32,h:38,vida:1,vel:74,cor:'#2E7A63',cor2:'#7FE0B8',
    pisavel:true,como:'pisar um por um',pontos:70},
  /* Fase 3 — se multiplica se você demorar */
  bot:{nome:'O Bot',w:34,h:34,vida:1,vel:66,cor:'#1E3A8C',cor2:'#7FC4FF',
    pisavel:true,voa:true,como:'derrubar rápido, antes de copiar',pontos:100,
    recado:'Cada segundo vira mais um. Derrube rápido.'},
  /* Fase 4 — só existe de verdade quando aparece */
  ameaca:{nome:'A Ameaça',w:40,h:56,vida:3,vel:62,cor:'#4A1030',cor2:'#FF5470',
    pisavel:false,fantasma:true,como:'atacar só quando ela aparece',pontos:220,
    recado:'Some e volta. Só dá pra atingir quando ela aparece.'},
  muro:{nome:'Sempre Foi Assim',w:58,h:460,vida:4,vel:0,cor:'#4A3F5C',cor2:'#8C7BA8',
    pisavel:false,soVozForte:true,semDano:true,como:'cair de altura perto, ou voz carregada',pontos:180,
    recado:'Grito solto não racha frase feita. Caia de bem mais alto — ou carregue a voz.'}
};

function criaInimigo(tipo,x,y,op){
  op=op||{};
  const t=TIPOS[tipo];
  const e={
    tipo,x,y:y-t.h,w:t.w,h:t.h,vx:0,vy:0,dir:op.dir||-1,
    vida:t.vida,vidaMax:t.vida,noChao:false,timer:rnd(0,1.4),estado:'anda',
    piscar:0,atordoado:0,anim:rnd(0,6),vivo:true,morte:0,avisou:false,
    squash:1,tampa:1,alerta:0,vidaMostra:0,
    solidez:1,copias:0,bando:null,pressa:0,recarga:0,
    origemX:x,pontos:t.pontos,def:t,seguidores:null,orbita:null,
    vel:t.vel*(Jogo.assistido?.72:1)
  };
  if(t.voa)e.baseY=y-t.h-(op.altura||0), e.y=e.baseY;
  if(tipo==='rotulo')e.aberto=true;
  return e;
}

/* O Alfa nasce com sua plateia em volta */
function criaAlfa(x,y,op){
  op=op||{};
  const a=criaInimigo('alfa',x,y,op);
  a.seguidores=[];
  for(let i=0;i<3;i++){
    /* com irmão: o do meio da roda é o Téo */
    const s=criaInimigo('seguidor',x,y,{});
    s.orbita={dono:a,ang:(i/3)*Math.PI*2,raio:62};
    a.seguidores.push(s);
    Mundo.inimigos.push(s);
  }
  Mundo.inimigos.push(a);
  return a;
}
/* A Turma nasce em trio e reage quando um cai */
function criaTurma(x,y,n){
  const grupo=[];
  for(let i=0;i<(n||3);i++){
    const e=criaInimigo('turma',x+i*34,y,{dir:-1});
    e.bando=grupo;
    grupo.push(e);
    Mundo.inimigos.push(e);
  }
  return grupo;
}

function plateiaViva(a){
  if(!a.seguidores)return 0;
  let n=0;
  for(const s of a.seguidores)if(s.vivo)n++;
  return n;
}

function atualizaInimigo(e,dt){
  if(!e.vivo){e.morte-=dt;e.y+=110*dt;return;}
  if(e.piscar>0)e.piscar-=dt;
  if(e.alerta>0)e.alerta-=dt;
  if(e.vidaMostra>0)e.vidaMostra-=dt;
  e.squash=lerp(e.squash,1,1-Math.pow(.002,dt));
  e.anim+=dt;
  if(e.atordoado>0){
    e.atordoado-=dt;
    e.vx=0;
    if(!e.def.voa){e.vy=Math.min(e.vy+GRAV*dt,GRAV_MAX);moveCorpo(e,dt);}
    checaContato(e);
    return;
  }

  const jx=Jog.x+Jog.w/2, jy=Jog.y+Jog.h/2;
  const cx=e.x+e.w/2, cy=e.y+e.h/2;
  const d=dist(cx,cy,jx,jy);
  const t=e.def;

  switch(e.tipo){
    case 'piada':{
      e.vx=e.dir*e.vel;
      e.vy=Math.min(e.vy+GRAV*dt,GRAV_MAX);
      moveCorpo(e,dt);
      if(e.encostouParede)e.dir*=-1;
      if(e.noChao&&!chaoEm(e.x+e.w/2+e.dir*(e.w/2+8),e.y+e.h+2,40))e.dir*=-1;
      break;
    }
    case 'rotulo':{
      /* abre e fecha: só dá pra pisar com a tampa aberta */
      e.timer-=dt;
      if(e.timer<=0){
        e.aberto=!e.aberto;
        e.timer=e.aberto?1.6:2;
        if(e.aberto)Part.solta(cx,e.y,6,[t.cor2],{vel:80,vida:.3,tam:4,ang:-Math.PI/2});
        else Som.nota(220,.08,'square',.05);
      }
      /* a tampa não pula de estado: ela gira */
      e.tampa=lerp(e.tampa,e.aberto?1:0,1-Math.pow(.004,dt));
      e.vx=e.dir*(e.aberto?e.vel:e.vel*.45);
      e.vy=Math.min(e.vy+GRAV*dt,GRAV_MAX);
      moveCorpo(e,dt);
      if(e.encostouParede)e.dir*=-1;
      if(e.noChao&&!chaoEm(e.x+e.w/2+e.dir*(e.w/2+8),e.y+e.h+2,40))e.dir*=-1;
      break;
    }
    case 'comentario':{
      /* flutua, e mergulha quando você passa por baixo */
      if(e.estado==='anda'){
        e.y=e.baseY+Math.sin(e.anim*2.2)*20;
        if(d<230&&jy>cy){
          e.estado='mergulha';e.timer=.45;e.alvoX=jx;e.alerta=.45;
          Som.nota(600,.07,'square',.05);
        }
      }else if(e.estado==='mergulha'){
        e.timer-=dt;
        if(e.timer>0){e.y+=Math.sin(e.anim*30)*1.2;}
        else{
          e.vy=Math.min(e.vy+1500*dt,760);
          e.y+=e.vy*dt;
          e.x=aprox(e.x,e.alvoX-e.w/2,90*dt);
          if(chaoEm(cx,e.y+e.h,20)||e.y>e.baseY+320){e.estado='volta';e.vy=0;}
        }
      }else{
        e.y=aprox(e.y,e.baseY,190*dt);
        if(Math.abs(e.y-e.baseY)<3){e.estado='anda';e.timer=1.2;}
      }
      break;
    }
    case 'seguidor':{
      const a=e.orbita.dono;
      if(!a||!a.vivo){
        /* sem líder, some junto */
        machucaInimigo(e,99);
        break;
      }
      e.orbita.ang+=dt*1.9;
      const r=e.orbita.raio+Math.sin(e.anim*3)*7;
      e.x=a.x+a.w/2-e.w/2+Math.cos(e.orbita.ang)*r;
      e.y=a.y+a.h*.38-e.h/2+Math.sin(e.orbita.ang)*r*.42;
      break;
    }
    case 'alfa':{
      const plateia=plateiaViva(e);
      e.vx=e.dir*(plateia?e.vel:e.vel*.5);
      e.vy=Math.min(e.vy+GRAV*dt,GRAV_MAX);
      moveCorpo(e,dt);
      if(e.encostouParede)e.dir*=-1;
      if(e.noChao&&!chaoEm(e.x+e.w/2+e.dir*(e.w/2+8),e.y+e.h+2,40))e.dir*=-1;
      if(d<340)e.dir=sign(jx-cx)||e.dir;
      break;
    }
    case 'ciume':{
      /* persegue e fica cego: é assim que ele cai sozinho */
      e.vy=Math.min(e.vy+GRAV*dt,GRAV_MAX);
      if(e.estado==='anda'){
        e.vx=e.dir*40;
        if(d<330&&Math.abs(jy-cy)<170){
          e.estado='cego';e.timer=5.5;
          Part.texto(cx,e.y-8,'!','#FF7AA8');
          Som.nota(150,.22,'sawtooth',.08);
        }
        moveCorpo(e,dt);
        if(e.encostouParede)e.dir*=-1;
        if(e.noChao&&!chaoEm(e.x+e.w/2+e.dir*(e.w/2+8),e.y+e.h+2,40))e.dir*=-1;
      }else{
        e.timer-=dt;
        e.dir=sign(jx-cx)||e.dir;
        e.vx=e.dir*e.vel*(1+Math.sin(e.anim*8)*.1);
        /* de propósito: não olha a beirada */
        moveCorpo(e,dt);
        if(e.encostouParede)e.vx=0;
        if(Math.random()<.3)
          Part.solta(cx,cy+10,1,['#FF7AA8','#6B1B3A'],{vel:40,vida:.4,tam:4,grav:-30});
        if(e.timer<=0||d>520){e.estado='anda';e.vx=0;}
      }
      /* cai fora do mundo ou nos espinhos: morreu */
      if(e.y>Mundo.alt-40){
        machucaInimigo(e,99);
        Interface.faixa('O ciúme cego derruba quem o carrega','verde');
      }
      for(const p of Mundo.perigos){
        if(bate(e,p)){machucaInimigo(e,99);break;}
      }
      break;
    }
    /* --- A Cobrança: telegrafa, manda onda pelo chão, fica exposta --- */
    case 'cobranca':{
      e.vy=Math.min(e.vy+GRAV*dt,GRAV_MAX);
      if(e.estado==='anda'){
        e.vx=e.dir*e.vel;
        if(d<340&&Math.abs(jy-cy)<130){
          e.estado='mira';e.timer=.75;e.vx=0;
          e.dir=sign(jx-cx)||e.dir;
          Som.nota(280,.1,'square',.06);
        }
      }else if(e.estado==='mira'){
        e.vx=0;e.timer-=dt;
        if(Math.random()<.35)
          Part.solta(cx+e.dir*16,e.y+14,1,[t.cor2],{vel:60,vida:.3,tam:3,grav:-50});
        if(e.timer<=0){
          e.estado='exposta';e.timer=1.3;
          Mundo.projeteis.push({x:cx,y:e.y+e.h-24,w:26,h:24,vx:e.dir*260,vy:0,
            dono:'inimigo',dano:1,vida:3,raio:13,rasteira:true,anim:0});
          Som.nota(150,.24,'sawtooth',.1,-50);
          Cam.sacode(.16);
        }
      }else{
        /* exposta: parada, piscando, fácil de pisar */
        e.vx=0;e.timer-=dt;
        if(e.timer<=0)e.estado='anda';
      }
      moveCorpo(e,dt);
      if(e.estado==='anda'){
        if(e.encostouParede)e.dir*=-1;
        if(e.noChao&&!chaoEm(e.x+e.w/2+e.dir*(e.w/2+8),e.y+e.h+2,40))e.dir*=-1;
      }
      break;
    }

    /* --- A Turma: anda em bando e acelera quando um cai --- */
    case 'turma':{
      if(e.pressa>0)e.pressa-=dt;
      const v=e.vel*(e.pressa>0?1.5:1);
      if(e.pressa>0&&d<420)e.dir=sign(jx-cx)||e.dir;
      e.vx=e.dir*v;
      e.vy=Math.min(e.vy+GRAV*dt,GRAV_MAX);
      moveCorpo(e,dt);
      if(e.encostouParede)e.dir*=-1;
      if(e.noChao&&!chaoEm(e.x+e.w/2+e.dir*(e.w/2+7),e.y+e.h+2,40))e.dir*=-1;
      break;
    }

    /* --- O Bot: se multiplica se você demorar --- */
    case 'bot':{
      const alvo=d<520?jx-e.w/2:e.origemX;
      e.x=aprox(e.x,alvo,e.vel*dt);
      e.y=e.baseY+Math.sin(e.anim*2.6)*16;
      e.dir=sign(jx-cx)||e.dir;
      e.timer-=dt;
      if(e.timer<=0&&e.copias<2&&Mundo.inimigos.filter(o=>o.tipo==='bot'&&o.vivo).length<6){
        const lugar=lugarLivre(e.x,e.baseY,t.w,t.h,80,40);
        if(lugar){
          e.timer=5;
          e.copias++;
          const c=criaInimigo('bot',lugar.x,lugar.y+t.h,{});
          c.baseY=lugar.y;c.y=lugar.y;c.copias=1;c.timer=6;
          Mundo.inimigos.push(c);
          Part.solta(cx,cy,12,[t.cor2,'#FFFFFF'],{vel:150,vida:.5,tam:4,grav:0});
          Som.nota(700,.09,'square',.05,-200);
          Part.texto(cx,e.y-6,'copiou','#7FC4FF');
        }else e.timer=1.5;          /* sem espaço livre: tenta de novo daqui a pouco */
      }
      break;
    }

    /* --- A Ameaça: só existe quando aparece --- */
    case 'ameaca':{
      e.timer-=dt;
      if(e.estado==='anda'){                       /* visível */
        e.solidez=aprox(e.solidez,1,dt*4);
        if(d<400)e.dir=sign(jx-cx)||e.dir;
        e.vx=e.dir*e.vel;
        e.vy=Math.min(e.vy+GRAV*dt,GRAV_MAX);
        moveCorpo(e,dt);
        if(e.encostouParede)e.dir*=-1;
        if(e.noChao&&!chaoEm(e.x+e.w/2+e.dir*(e.w/2+8),e.y+e.h+2,40)){e.x-=e.vx*dt;e.vx=0;}
        if(e.timer<=0){e.estado='some';e.timer=2.1;Som.nota(180,.3,'sine',.06,-90);}
      }else{                                       /* sumida: intocável */
        e.solidez=aprox(e.solidez,.12,dt*4);
        e.vx=0;e.vy=0;
        if(e.timer<=1.9&&Math.random()<.25)
          Part.solta(cx,cy,1,[t.cor2],{vel:40,vida:.5,tam:3,grav:-20});
        if(e.timer<=0){
          e.estado='anda';e.timer=2.6;
          /* reaparece perto do jogador: nunca em cima dele, nunca dentro de parede */
          const lado=sign(cx-jx)||1;
          const tentativa=clamp(jx+lado*rnd(110,190)-e.w/2,20,Mundo.larg-e.w-20);
          const bom=lugarLivre(tentativa,e.y,e.w,e.h,60,20,true)||
                    lugarLivre(e.x,e.y,e.w,e.h,180,30,true);
          e.x=bom?bom.x:e.x;
          Part.solta(cx,cy,14,[t.cor,t.cor2],{vel:170,vida:.5,tam:5,grav:0});
          Som.nota(120,.2,'sawtooth',.08);
        }
      }
      break;
    }

    case 'muro':
      /* parado: ele É a parede. Só avisa quem esbarra. */
      if(!e.avisou&&Math.abs((Jog.x+Jog.w/2)-(e.x+e.w/2))<70&&Jog.noChao){
        e.avisou=true;
        Interface.faixa(t.recado,'sol');
      }
      break;
  }
  checaContato(e);
}

/* Pisão, cabeçada por baixo e dano por encostar */
function checaContato(e){
  if(!e.vivo||!Jog.vivo||!bate(Jog,e))return;
  const t=e.def;
  if(t.fantasma&&e.solidez<.6)return;      /* sumida: atravessa */
  if(e.tipo==='cobranca'&&e.estado!=='exposta'&&Jog.vy>80&&(Jog.y+Jog.h)-e.y<30){
    /* só dá pra pisar nela na recuperação */
    if(!e.avisou){e.avisou=true;Interface.faixa(t.recado,'sol');}
    e.vidaMostra=2;
    Jog.vy=-330;
    Som.bloqueado();
    return;
  }
  const pisando=Jog.vy>80&&(Jog.y+Jog.h)-e.y<30;
  const porBaixo=Jog.vy<-40&&(e.y+e.h)-Jog.y<30;

  /* estourar por baixo */
  if(porBaixo&&e.tipo==='comentario'){
    machucaInimigo(e,99);
    Jog.vy=-260;
    Jog.quica(false);
    return;
  }
  if(pisando){
    if(e.tipo==='alfa'&&plateiaViva(e)>0){
      e.vidaMostra=2;
      if(!e.avisou){e.avisou=true;Interface.faixa(t.recado,'sol');}
      Jog.leva(1,e.x+e.w/2);
      return;
    }
    if(e.tipo==='rotulo'&&!e.aberto){
      e.vidaMostra=2;e.squash=1.2;
      if(!e.avisou){e.avisou=true;Interface.faixa(t.recado,'sol');}
      Jog.vy=-330;
      Som.nota(150,.14,'square',.1);
      Cam.sacode(.15);
      return;
    }
    if(t.pisavel||e.atordoado>0){
      machucaInimigo(e,e.tipo==='alfa'?1:99);
      Jog.quica(e.tipo==='alfa');
      return;
    }
    if(!e.avisou&&t.recado){e.avisou=true;Interface.faixa(t.recado,'sol');}
  }
  if(t.semDano)return;                    /* parede não bate: só barra o caminho */
  if(Jog.invul<=0)Jog.leva(1,e.x+e.w/2);
}

/* Téo sai da roda. Não morre, não vira pontos: só senta e respira. */
function machucaInimigo(e,dano){
  if(!e.vivo)return;
  e.vida-=dano;e.piscar=.16;
  e.squash=1.42;
  e.vidaMostra=2.4;
  Part.solta(e.x+e.w/2,e.y+e.h/2,7,['#FFFFFF',e.def.cor2],{vel:170,vida:.35,tam:4});
  if(e.vida<=0){
    e.vivo=false;e.morte=.5;
    Jog.ganha(e.pontos);
    Som.acerto();
    Cam.sacode(.18);
    Jogo.trava(.07);
    Part.solta(e.x+e.w/2,e.y+e.h/2,20,[e.def.cor,e.def.cor2,'#FFFFFF'],{vel:260,vida:.75,tam:6});
    const av=AVISOS[e.tipo];
    if(av)Part.texto(e.x+e.w/2,e.y-4,pick(av),'#43E098');
    if(e.bando){
      for(const o of e.bando)if(o.vivo){o.pressa=2.2;o.vidaMostra=1.4;}
    }
    if(e.tipo==='muro'&&e.solido)e.solido.removido=true;
    if(Math.random()<.18)criaItem('vida',e.x+e.w/2-13,e.y+6);
  }else{
    Som.nota(300,.07,'square',.07,-80);
  }
}

/* ============================================================
   11. O CICLO — chefe em três voltas
   Só cai quando baixa a guarda. Pise na cabeça.
   ============================================================ */
const ARENA={esq:4520,dir:5780};
function criaChefe(x,chaoY){
  return {
    x,y:chaoY-330,w:150,h:162,hCheio:162,hCaido:112,
    chaoY,voo:chaoY-330,vida:9,vidaMax:9,
    fase:1,timer:2.4,estado:'entrada',anim:0,piscar:0,vivo:true,
    invul:0,dir:-1,anel:0,anelAlvo:0,marca:null,carga:0,tremeu:0,curou:0
  };
}
function atualizaChefe(b,dt){
  if(!b.vivo)return;
  b.anim+=dt;
  if(b.piscar>0)b.piscar-=dt;
  if(b.invul>0)b.invul-=dt;
  if(b.curou>0)b.curou-=dt;
  /* a roda das três voltas gira até a volta atual ficar em cima */
  b.anel=lerp(b.anel,b.anelAlvo,1-Math.pow(.006,dt));
  const jx=Jog.x+Jog.w/2;
  const cx=b.x+b.w/2;

  const faseAntes=b.fase;
  if(b.vida<=3)b.fase=3;
  else if(b.vida<=6)b.fase=2;
  if(b.fase!==faseAntes){
    b.estado='troca';b.timer=1.7;b.invul=1.5;
    b.h=b.hCheio;b.y=b.voo;b.marca=null;
    b.anelAlvo+=Math.PI*2/3;                 /* a roda gira: o ciclo virou */
    Cam.sacode(.9);Som.chefe();
    const nomes={2:'VOLTA 2 — EXPLOSÃO',3:'VOLTA 3 — LUA DE MEL'};
    const ditos={2:'"Agora você vai ver."',3:'"Eu mudei. Foi só dessa vez."'};
    Interface.faixa(nomes[b.fase]+'  ·  '+ditos[b.fase]);
    Part.solta(cx,b.y+b.h/2,44,['#C99BFF','#FF5470','#FFFFFF'],{vel:360,vida:1,tam:8});
  }

  b.timer-=dt;

  switch(b.estado){
    case 'entrada':
      b.y=b.voo+Math.sin(b.anim*2)*16;
      if(Jog.x+Jog.w/2<ARENA.esq-30){b.timer=1.2;break;}
      if(b.timer<=0){
        b.estado='ronda';b.timer=1.5;
        Interface.faixa('O CICLO — VOLTA 1 · TENSÃO');
        Cam.sacode(.5);Som.chefe();
      }
      break;

    case 'troca':
      b.y=b.voo+Math.sin(b.anim*2)*16;
      if(b.timer<=0){b.estado='ronda';b.timer=b.fase===1?1.45:(b.fase===2?1:1.2);}
      break;

    case 'ronda':{
      const lado=cx>jx?1:-1;
      const vel=b.fase===2?205:135;
      const alvo=clamp(jx+lado*285-b.w/2,ARENA.esq,ARENA.dir-b.w);
      b.x=aprox(b.x,alvo,vel*dt);
      b.y=b.voo+Math.sin(b.anim*(b.fase===3?2.8:1.9))*22;
      /* volta 1: leque de orbes. volta 3: presentes que parecem carinho */
      if(b.fase===1&&b.timer<.9&&b.timer+dt>=.9){
        for(let i=-2;i<=2;i++)
          Mundo.projeteis.push({x:cx-10,y:b.y+b.h*.7,w:20,h:20,vx:i*92,vy:200,dono:'chefe',
            dano:1,vida:3.4,raio:12,anim:0});
        Som.nota(180,.25,'sawtooth',.1,-60);
      }
      if(b.fase===3&&b.timer<1&&b.timer+dt>=1){
        for(let i=0;i<3;i++){
          const a=-Math.PI/2+rnd(-.9,.9);
          Mundo.projeteis.push({x:cx-11,y:b.y+b.h,w:22,h:22,vx:Math.cos(a)*rnd(110,230),
            vy:Math.sin(a)*230,dono:'chefe',dano:1,vida:4,raio:12,grav:460,presente:true,anim:0});
        }
        Som.nota(430,.2,'triangle',.08,-130);
      }
      if(b.timer<=0){
        /* da volta 2 em diante ele alterna baque e investida */
        if(b.fase>=2&&Math.random()<.5){b.estado='prepara';b.timer=.7;}
        else{b.estado='mira';b.timer=.62;b.marca=clamp(jx,ARENA.esq+40,ARENA.dir-40);}
      }
      break;
    }

    /* ---- baque: sobe, marca o chão e desaba ---- */
    case 'mira':{
      b.x=aprox(b.x,clamp(b.marca-b.w/2,ARENA.esq,ARENA.dir-b.w),300*dt);
      b.y=aprox(b.y,b.voo-80,340*dt);
      b.marca=lerp(b.marca,clamp(jx,ARENA.esq+40,ARENA.dir-40),1-Math.pow(.02,dt));
      if(Math.random()<.5)
        Part.solta(b.marca+rnd(-30,30),b.chaoY-4,1,['#FF5470'],{vel:70,vida:.35,tam:4,grav:-180});
      if(b.timer<=0)b.estado='baque';
      break;
    }
    case 'baque':{
      b.y+=2000*dt;
      if(b.y+b.h>=b.chaoY){
        b.y=b.chaoY-b.hCaido;b.h=b.hCaido;
        b.estado='caido';b.timer=b.fase===3?1.7:(b.fase===2?1.9:2.4);
        b.marca=null;
        Cam.sacode(1);Cam.soco(.05);
        Som.nota(70,.4,'sawtooth',.18,-25);
        Part.solta(cx,b.chaoY,30,['#FF5470','#FFC53D'],{vel:350,vida:.75,tam:7,ang:-Math.PI/2});
        Mundo.enfeites.push({tipo:'onda',x:cx,y:b.chaoY,r:12,max:280,vida:.5});
        for(const sg of[-1,1])
          Mundo.projeteis.push({x:cx,y:b.chaoY-28,w:28,h:28,vx:sg*330,vy:0,dono:'chefe',
            dano:1,vida:2.4,raio:15,rasteira:true,anim:0});
      }
      break;
    }

    /* ---- investida: atravessa a arena na horizontal, dá pra pular ---- */
    case 'prepara':{
      b.dir=sign(jx-cx)||b.dir;
      b.y=aprox(b.y,b.chaoY-108,360*dt);
      b.tremeu=Math.sin(b.anim*40)*4;
      if(Math.random()<.6)
        Part.solta(cx-b.dir*40,b.y+b.h*.6,1,['#FF5470','#FFC53D'],{vel:120,vida:.3,tam:4,grav:0,
          ang:b.dir>0?Math.PI:0});
      if(b.timer<=0){b.estado='investe';b.carga=1.5;Som.nota(120,.3,'sawtooth',.14,-40);}
      break;
    }
    case 'investe':{
      b.tremeu=0;
      b.carga-=dt;
      b.x+=b.dir*470*dt;
      b.y=b.chaoY-108+Math.sin(b.anim*18)*3;
      if(Math.random()<.8)
        Part.solta(cx-b.dir*30,b.y+b.h*.7,1,['#FF5470'],{vel:90,vida:.35,tam:5,grav:60});
      const bateu=b.x<=ARENA.esq||b.x>=ARENA.dir-b.w;
      if(bateu||b.carga<=0){
        b.x=clamp(b.x,ARENA.esq,ARENA.dir-b.w);
        b.y=b.chaoY-b.hCaido;b.h=b.hCaido;
        b.estado='caido';b.timer=2.5;      /* errou a investida: fica mais tempo exposto */
        Cam.sacode(.9);Som.nota(80,.35,'sawtooth',.16,-30);
        Part.solta(cx,b.y+b.h,24,['#FF5470','#C99BFF'],{vel:300,vida:.7,tam:6});
        Mundo.enfeites.push({tipo:'onda',x:cx,y:b.chaoY,r:12,max:200,vida:.45});
      }
      break;
    }

    case 'caido':{
      b.y=b.chaoY-b.hCaido+Math.sin(b.anim*22)*2;
      /* na lua de mel ele se recupera sozinho se você demorar */
      if(b.fase===3&&b.timer<.7&&b.curou<=0&&b.vida<b.vidaMax&&Math.random()<.02){
        b.vida=Math.min(b.vidaMax,b.vida+1);b.curou=1.4;
        Part.texto(cx,b.y-12,'+1','#FF8FB0');
        Interface.faixa('Ele se recupera no arrependimento. Presente não é mudança.');
      }
      if(b.timer<=0){b.estado='sobe';b.h=b.hCheio;}
      break;
    }
    case 'sobe':{
      b.y=aprox(b.y,b.voo,620*dt);
      if(Math.abs(b.y-b.voo)<4){b.estado='ronda';b.timer=b.fase===2?.95:1.25;}
      break;
    }
  }
  b.x=clamp(b.x,ARENA.esq,ARENA.dir-b.w);

  if(!Jog.vivo)return;
  if(b.estado==='caido'){
    const cabeca={x:b.x-8,y:b.y-46,w:b.w+16,h:82};
    if(bate(Jog,cabeca)&&Jog.vy>20){
      machucaChefe(b,1);
      Jog.quica(true);
      Jog.vy=-660;
      return;
    }
  }
  const corpo={x:b.x+12,y:b.y+10,w:b.w-24,h:b.h-14};
  if(bate(Jog,corpo)&&Jog.invul<=0&&b.estado!=='caido')Jog.leva(1,b.x+b.w/2);
}
function machucaChefe(b,dano){
  if(b.invul>0||!b.vivo)return;
  b.vida-=dano;b.piscar=.2;b.invul=.35;
  Som.acerto();
  Cam.sacode(.4);Cam.soco(.05);
  Jogo.trava(.1);
  Part.solta(b.x+b.w/2,b.y,16,['#FFFFFF','#C99BFF','#FFC53D'],{vel:250,vida:.5,tam:6});
  Part.texto(b.x+b.w/2,b.y-12,'!','#FFC53D');
  if(b.vida<=0){
    b.vivo=false;
    Cam.sacode(1.2);
    for(let i=0;i<10;i++){
      const a=(i/10)*Math.PI*2;
      Part.solta(b.x+b.w/2+Math.cos(a)*30,b.y+b.h/2+Math.sin(a)*36,6,
        ['#C99BFF','#8C6BD1','#FFFFFF'],{vel:300,vida:1.4,tam:11,grav:520,ang:a});
    }
    Part.solta(b.x+b.w/2,b.y+b.h/2,40,['#FFC53D','#43E098','#FFFFFF'],{vel:420,vida:1.3,tam:8});
    Part.texto(b.x+b.w/2,b.y+b.h/2,'não tinha ninguém atrás','#F4F1FF');
    Jog.ganha(2500);
    Jogo.venceChefe();
  }else{
    b.estado='sobe';b.h=b.hCheio;
  }
}

function criaItem(tipo,x,y,indice){
  const tam={letra:{w:34,h:40},vida:{w:26,h:24}}[tipo];
  Mundo.itens.push({tipo,x,y,w:tam.w,h:tam.h,baseY:y,anim:rnd(0,6),
    indice:indice===undefined?0:indice,letra:tipo==='letra'?PALAVRA[indice]:null});
}
function atualizaItens(dt){
  for(let i=Mundo.itens.length-1;i>=0;i--){
    const it=Mundo.itens[i];
    it.anim+=dt;
    it.y=it.baseY+Math.sin(it.anim*2.6)*5;
    if(!bate(Jog,it))continue;
    if(it.tipo==='letra'){
      Jogo.pegaLetra(it.indice);
      Part.solta(it.x+it.w/2,it.y+it.h/2,16,['#FFC53D','#FFFFFF','#C99BFF'],{vel:200,vida:.6,tam:5});
      Mundo.itens.splice(i,1);
    }else if(Jog.cura(1)){
      Part.solta(it.x+it.w/2,it.y+it.h/2,12,['#43E098','#FFFFFF'],{vel:170,vida:.5,tam:5});
      Mundo.itens.splice(i,1);
    }
  }
}

const L={
  bloco(x,y,w,h,cor){Mundo.solidos.push({x,y,w,h,tipo:'bloco',cor:cor||null});},
  passagem(x,y,w){Mundo.solidos.push({x,y,w,h:16,tipo:'passagem'});},
  movel(x,y,w,h,dx,dy,alcance,vel){
    Mundo.solidos.push({x,y,w,h,tipo:'bloco',movel:true,ox:x,oy:y,
      ex:dx,ey:dy,alcance,vel:vel||60,t:0,dx:0,dy:0});
  },
  quebra(x,y,w){Mundo.solidos.push({x,y,w,h:18,tipo:'bloco',quebrando:!Jogo.assistido,caindo:false,sumiu:false,timer:0,volta:0});},
  /* FASE 3 — o feed: some e volta no ritmo */
  pisca(x,y,w,defas,periodo){
    Mundo.solidos.push({x,y,w,h:18,tipo:'bloco',pisca:!Jogo.assistido,
      defas:defas||0,periodo:periodo||2.4,ligado:true,t:0});
  },
  /* FASE 4 — elevador: só sobe enquanto tem alguém em cima */
  elevador(x,y,w,curso,vel){
    Mundo.solidos.push({x,y,w,h:22,tipo:'bloco',elevador:true,
      oy:y,curso:curso||150,vel:vel||95,dx:0,dy:0,movel:true,carregado:false});
  },
  /* FASE 5 — rede de apoio: pise numa e a próxima acende */
  rede(x,y,w,grupo,ordem){
    Mundo.solidos.push({x,y,w,h:20,tipo:'bloco',rede:true,grupo,ordem,
      aceso:ordem===0,removido:ordem!==0,brilho:0});
  },
  /* micro-tutorial pintado no fundo */
  dica(x,y,titulo,linha){Mundo.dicas.push({x,y:y-150,titulo,linha,anim:rnd(0,6)});},
  turma(x,y,n){if(Jogo.assistido)return;criaTurma(x,y,n);},
  mola(x,y){Mundo.enfeites.push({tipo:'mola',x,y:y-18,w:46,h:18,carga:0});},
  espinho(x,y,w){if(Jogo.assistido)return;Mundo.perigos.push({tipo:'espinho',x,y:y-18,w,h:18});},
  letra(i,x,y){criaItem('letra',x,y,i);},
  vida(x,y){criaItem('vida',x,y);},
  inim(tipo,x,y,op){if(Jogo.assistido)return;Mundo.inimigos.push(criaInimigo(tipo,x,y,op));},
  alfa(x,y,op){if(Jogo.assistido)return;criaAlfa(x,y,op);},
  /* o muro é inimigo E parede: some quando racha */
  muro(x,y){
    if(Jogo.assistido)return;          /* sem inimigo e sem parede: o caminho fica livre */
    const e=criaInimigo('muro',x,y);
    Mundo.inimigos.push(e);
    const s={x:e.x,y:e.y,w:e.w,h:e.h,tipo:'bloco',cor:'#4A3F5C',ehMuro:true};
    e.solido=s;
    Mundo.solidos.push(s);
  },
  npc(x,y,id){Mundo.npcs.push({x,y:y-62,w:34,h:62,id,anim:rnd(0,6),falou:false,visual:VISUAIS[id]||null});},
  mural(x,y,dados){Mundo.murais.push({x:x-70,y:y-190,w:140,h:190,dados,disparado:false,anim:rnd(0,6)});},
  check(x,y){Mundo.checkpoints.push({x,y:y-70,w:26,h:70,ativo:false,anim:0});},
  saida(x,y){Mundo.saida={x,y:y-96,w:64,h:96,anim:0,aberta:false,avisoT:0};},
  /* portão da arena: barra o caminho até você ter as quatro letras */
  portao(x,y){
    const s={x,y:y-460,w:46,h:460,tipo:'bloco',cor:'#2A1250',ehPortao:true};
    Mundo.solidos.push(s);
    Mundo.portao={solido:s,x,y:y-460,w:46,h:460,aberto:false,selado:false,anim:0,avisoT:0};
  },
  deco(tipo,x,y,w,h,cor){Mundo.enfeites.push({tipo,x,y,w,h,cor,anim:rnd(0,6)});},
  piso(x0,x1,y,buracos,alt){
    alt=alt||220;
    /* modo tranquilo: chão inteiro, sem vão nenhum */
    const bs=Jogo.assistido?[]:(buracos||[]).slice().sort((a,b)=>a[0]-b[0]);
    let cur=x0;
    for(const b of bs){
      if(b[0]>cur)this.bloco(cur,y,b[0]-cur,alt);
      cur=Math.max(cur,b[1]);
    }
    if(cur<x1)this.bloco(cur,y,x1-cur,alt);
  }
};

const CONSTRUTORES=[fase1,fase2,fase3,fase4,fase5];

function montaFase(n){
  Mundo.limpa();
  Part.limpa();
  CONSTRUTORES[n-1]();
  /* altura do chão da fase: usada para escurecer o vão dos buracos */
  /* linha do chão: só blocos LARGOS contam. Paredes altas e estreitas
     (fundo da arena, muros, portão) faziam o horizonte subir e o subsolo
     escuro cobrir a fase inteira. */
  Mundo.chaoY=Math.min.apply(null,Mundo.solidos
    .filter(s=>s.h>=100&&s.w>=150&&!s.ehPortao&&!s.ehMuro).map(s=>s.y));
  /* dicas do arquivo de conteúdo, coladas na altura do chão */
  const dd=DICAS[n]||[];
  for(const [dx,tit,lin] of dd)L.dica(dx,Mundo.chaoY,tit,lin);
  /* Dica, mural e outra dica disputam a mesma parede. Em vez de empurrar
     em laço (que fica preso entre duas restrições), procuro a posição
     livre mais próxima da original. */
  for(const d of Mundo.dicas){
    const alvo=d.x;
    let melhor=null;
    for(let passo=0;passo<=720&&melhor===null;passo+=90){
      for(const lado of (passo?[-1,1]:[1])){
        const x=clamp(alvo+lado*passo,150,Mundo.larg-150);
        const bateMural=Mundo.murais.some(m=>Math.abs((m.x+m.w/2)-x)<185);
        const bateDica=Mundo.dicas.some(o=>o!==d&&Math.abs(o.x-x)<340);
        if(!bateMural&&!bateDica){melhor=x;break;}
      }
    }
    d.x=melhor===null?alvo:melhor;
  }
  Jog.novaFase(n);
  /* letras já coletadas não voltam a aparecer */
  for(let i=Mundo.itens.length-1;i>=0;i--){
    const it=Mundo.itens[i];
    if(it.tipo==='letra'&&Jogo.letras.has(it.indice))Mundo.itens.splice(i,1);
  }
  Jog.reinicia(Mundo.nascer);
  Cam.segue(Jog,Mundo,0,true);
}

/* ============================================================
   14. CENÁRIO VIVO
   ============================================================ */
/* Leva junto quem está em cima. Feito ANTES da física da Manu: assim,
   quando ela vai checar colisão, já está na posição certa da plataforma.
   Antes isso era feito depois, e ela ficava para trás nas beiradas. */
function carrega(s){
  if(!Jog.vivo||Jog.plataforma!==s)return;
  if(s.dx)Jog.x+=s.dx;
  if(s.dy)Jog.y+=s.dy;
}

function atualizaSolidos(dt){
  const T=Jogo.tempoTotal;
  for(const s of Mundo.solidos){
    /* o feed pisca: aceso 60% do ciclo, com aviso antes de sumir */
    if(s.pisca){
      const fase=((T+s.defas)%s.periodo)/s.periodo;
      const antes=s.ligado;
      s.ligado=fase<.68;   /* mais tempo aceso do que apagado */
      s.removido=!s.ligado;
      s.t=fase;
      if(antes&&!s.ligado&&Jog.plataforma===s)Jog.plataforma=null;
    }
    /* elevador: sobe com peso em cima, desce sozinho */
    if(s.elevador){
      const emCima=Jog.plataforma===s||(Jog.noChao&&Math.abs((Jog.y+Jog.h)-s.y)<6&&
        Jog.x+Jog.w>s.x&&Jog.x<s.x+s.w);
      s.carregado=emCima;
      const alvo=emCima?s.oy-s.curso:s.oy;
      const ny=aprox(s.y,alvo,s.vel*dt);
      s.dx=0;s.dy=ny-s.y;s.y=ny;
      carrega(s);
      continue;
    }
    if(s.movel&&!s.elevador){
      s.t+=dt*(s.vel/Math.max(1,s.alcance));
      /* começa em 0 e vai a 1 e volta, com desaceleração nas pontas.
         Com seno puro ela nascia no MEIO do trajeto e dava um salto
         de 100px no primeiro quadro, derrubando quem estivesse em cima. */
      const p=(1-Math.cos(s.t*Math.PI))/2;
      const nx=s.ox+s.ex*s.alcance*p, ny=s.oy+s.ey*s.alcance*p;
      s.dx=nx-s.x;s.dy=ny-s.y;s.x=nx;s.y=ny;
      carrega(s);
    }
    if(s.quebrando){
      if(s.caindo&&!s.sumiu){
        s.timer-=dt;
        if(s.timer<=0){
          s.sumiu=true;s.volta=3.2;
          Part.solta(s.x+s.w/2,s.y,10,['#8C7BA8','#C7BEE6'],{vel:130,vida:.6,tam:5});
        }
      }else if(s.sumiu){
        s.volta-=dt;
        if(s.volta<=0){s.sumiu=false;s.caindo=false;}
      }
    }
  }
}

function atualizaCenario(dt){
  for(let i=Mundo.enfeites.length-1;i>=0;i--){
    const d=Mundo.enfeites[i];
    if(d.tipo==='onda'){
      d.vida-=dt;
      d.r+=(d.max-d.r)*Math.min(1,dt*9);
      if(d.vida<=0)Mundo.enfeites.splice(i,1);
      continue;
    }
    if(d.tipo==='mola'){
      d.carga=Math.max(0,d.carga-dt*4);
      if(bate(Jog,{x:d.x,y:d.y-6,w:d.w,h:d.h+10})&&Jog.vy>0){
        Jog.vy=-1080;d.carga=1;Jog.quedaDe=null;
        Jog.esticaX=.68;Jog.esticaY=1.44;
        Som.nota(300,.2,'square',.13,420);
        Part.solta(d.x+d.w/2,d.y,12,['#FFC53D','#FFFFFF'],{vel:200,vida:.45,tam:5,ang:-Math.PI/2});
      }
    }
  }
  for(const p of Mundo.perigos){
    if(bate(Jog,{x:p.x+4,y:p.y+6,w:p.w-8,h:p.h-6})&&Jog.invul<=0&&Jog.vivo)
      Jog.leva(1,Jog.x+Jog.w/2);
  }
  /* rede de apoio: quem pisa numa acende a seguinte */
  const pl=Jog.plataforma;
  if(pl&&pl.rede&&pl.aceso){
    pl.brilho=1;
    for(const s of Mundo.solidos){
      if(s.rede&&s.grupo===pl.grupo&&s.ordem===pl.ordem+1&&!s.aceso){
        s.aceso=true;s.removido=false;s.brilho=1;
        Som.nota(520+pl.ordem*80,.14,'triangle',.08);
        Part.solta(s.x+s.w/2,s.y+8,12,['#C99BFF','#FFFFFF'],{vel:130,vida:.5,tam:4,grav:-40});
      }
    }
  }
  for(const s of Mundo.solidos)if(s.rede&&s.brilho>0)s.brilho-=dt*1.6;
  for(const c of Mundo.checkpoints){
    c.anim+=dt;
    if(!c.ativo&&bate(Jog,c)){
      c.ativo=true;
      Mundo.nascer={x:c.x-4,y:c.y+8};
      Jogo.ultimoCheck={fase:Jogo.fase,x:c.x};
      Som.vida();
      Interface.faixa('Ponto de retorno salvo','verde');
      Part.solta(c.x+13,c.y+20,16,['#43E098','#FFFFFF'],{vel:180,vida:.6,tam:5});
    }
  }
  /* murais: informam sem parar o jogo */
  for(const m of Mundo.murais){
    m.anim+=dt;
    if(m.disparado)continue;
    if(bate(Jog,m)){
      m.disparado=true;
      Jogo.leMural(m.dados);
    }
  }
  for(const n of Mundo.npcs){
    n.anim+=dt;
    if(n.falou||!Jog.noChao||!Jog.vivo)continue;
    if(bate(Jog,{x:n.x-46,y:n.y-20,w:n.w+92,h:n.h+40})){
      n.falou=true;
      Jogo.abreDialogo(n.id);
    }
  }
  /* portão da arena do chefe */
  const pt=Mundo.portao;
  if(pt){
    pt.anim+=dt;
    if(pt.avisoT>0)pt.avisoT-=dt;
    const perto=Math.abs((Jog.x+Jog.w/2)-(pt.x+pt.w/2));
    if(!pt.aberto){
      if(Jogo.letras.size>=PALAVRA.length&&perto<190){
        pt.aberto=true;
        pt.solido.removido=true;
        Som.fase();Cam.sacode(.5);
        Interface.faixa('C-I-E-E completo. O portão abriu.','verde');
        Part.solta(pt.x+pt.w/2,pt.y+pt.h/2,26,['#FFC53D','#C99BFF','#FFFFFF'],{vel:280,vida:.9,tam:6});
      }else if(perto<120&&pt.avisoT<=0){
        pt.avisoT=2.8;
        Som.bloqueado();
        Interface.faixa('Faltam '+(PALAVRA.length-Jogo.letras.size)+' letra(s) do CIEE','sol');
      }
    }else if(pt.selado&&Jog.x+Jog.w<pt.x-10){
      /* renasceu do lado de fora: reabre para não travar o jogo */
      pt.selado=false;
      pt.solido.removido=true;
      Interface.faixa('O portão reabriu. Volte quando estiver pronta.','verde');
    }else if(!pt.selado&&Jog.x>pt.x+pt.w+130){
      pt.selado=true;
      pt.solido.removido=false;
      Som.chefe();Cam.sacode(.7);
      Interface.faixa('Daqui só se sai atravessando.','sol');
      Part.solta(pt.x+pt.w/2,pt.y+pt.h/2,22,['#FF5470','#C99BFF'],{vel:220,vida:.8,tam:6});
    }
  }

  if(Mundo.saida){
    const sd=Mundo.saida;
    sd.anim+=dt;
    sd.aberta=Jogo.letras.size>=PALAVRA.length;
    if(bate(Jog,sd)&&Jog.vivo){
      if(sd.aberta)Jogo.completaFase();
      else if(sd.avisoT<=0){
        sd.avisoT=2.6;
        Som.bloqueado();
        Interface.faixa('Faltam '+(PALAVRA.length-Jogo.letras.size)+' letra(s) do CIEE','sol');
      }
    }
    if(sd.avisoT>0)sd.avisoT-=dt;
  }
}

/* ============================================================
   15. PROJÉTEIS (só o chefe usa)
   ============================================================ */
function atualizaProjeteis(dt){
  for(let i=Mundo.projeteis.length-1;i>=0;i--){
    const p=Mundo.projeteis[i];
    p.vida-=dt;p.anim+=dt;
    if(p.vida<=0){Mundo.projeteis.splice(i,1);continue;}
    if(p.grav)p.vy+=p.grav*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    let parou=false;
    if(!p.atravessa){
      for(const s of Mundo.solidos){
        if(!ativo(s)||s.tipo==='passagem')continue;
        if(s.ehMuro&&p.dono==='jogador')continue;   /* a voz alcança o muro */
        if(bate(p,s)){parou=true;break;}
      }
    }
    if(p.x<-60||p.x>Mundo.larg+60||p.y>Mundo.alt+80)parou=true;
    if(parou){
      Part.solta(p.x+p.w/2,p.y+p.h/2,5,[p.dono==='jogador'?'#C99BFF':'#FF5470','#FFFFFF'],
        {vel:110,vida:.3,tam:4,grav:0});
      Mundo.projeteis.splice(i,1);continue;
    }

    if(p.dono==='jogador'){
      let acertou=false;
      for(const e of Mundo.inimigos){
        if(!e.vivo||!bate(p,e))continue;
        /* quem não pode ser atingido (o Téo, a Ameaça sumida) deixa a voz
           passar em vez de engolir o tiro e virar escudo do que está atrás */
        const consumiu=vozAtinge(e,p);
        acertou=consumiu||acertou;
        if(consumiu&&!p.atravessa)break;
      }
      const b=Mundo.chefe;
      if(b&&b.vivo&&bate(p,b)){
        if(b.estado==='caido')machucaChefe(b,p.dano);
        else{Som.bloqueado();Part.texto(b.x+b.w/2,b.y-8,'de pé ele não escuta','#C7BEE6');}
        acertou=true;
      }
      if(acertou&&!p.atravessa){Mundo.projeteis.splice(i,1);continue;}
    }else if(bate(p,Jog)&&Jog.invul<=0&&Jog.vivo){
      Jog.leva(p.dano,p.x+p.w/2);
      Mundo.projeteis.splice(i,1);
    }
  }
}

/* A voz funciona em quase tudo — mas cada inimigo tem sua guarda */
function vozAtinge(e,p){
  const t=e.def;
  /* Devolve TRUE se o tiro foi consumido. Quem não pode ser atingido
     devolve FALSE, para não virar escudo do que está atrás. */
  if(t.fantasma&&e.solidez<.6){
    Part.texto(e.x+e.w/2,e.y-6,'atravessou','#C7BEE6');
    return false;
  }
  if(t.blindaFechado&&!e.aberto){
    Som.bloqueado();
    if(!e.avisou){e.avisou=true;Interface.faixa(t.recado,'sol');}
    return true;
  }
  if(t.protegido&&plateiaViva(e)>0){
    Som.bloqueado();
    if(!e.avisou){e.avisou=true;Interface.faixa(t.recado,'sol');}
    Part.texto(e.x+e.w/2,e.y-6,'a plateia protege','#C7BEE6');
    return true;
  }
  if(t.soVozForte&&!p.forte){
    Som.bloqueado();
    if(!e.avisou){e.avisou=true;Interface.faixa(t.recado,'sol');}
    return true;
  }
  machucaInimigo(e,p.dano);
  return true;
}
/* ============================================================
   16. DESENHO
   ============================================================ */
const Arte={
  faseAtual:FASES[0],
  _margemTopo:null,
  _cores:{},
  /* Mistura duas cores hex. Camadas de fundo pintadas com cor SÓLIDA já
     misturada com o céu ficam muito mais limpas do que várias camadas
     translúcidas empilhadas — que viram borrão. */
  mistura(a,b,t){
    const k=a+b+(t*100|0);
    if(this._cores[k])return this._cores[k];
    const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
    const r=Math.round(((pa>>16)&255)*(1-t)+((pb>>16)&255)*t);
    const v=Math.round(((pa>>8)&255)*(1-t)+((pb>>8)&255)*t);
    const z=Math.round((pa&255)*(1-t)+(pb&255)*t);
    return this._cores[k]='rgb('+r+','+v+','+z+')';
  },

  quadro(){
    const g=ctx;
    g.setTransform(Vista.dpr,0,0,Vista.dpr,0,0);
    this.ceu(g);
    g.save();
    const z=Cam.zoom;
    g.translate(Vista.cssL/2,Vista.cssA/2);
    g.scale(Vista.escala*z,Vista.escala*z);
    g.translate(-Vista.larg/2,-Vista.alt/2);
    g.translate(-Math.round(Cam.ox),-Math.round(Cam.oy));
    this.paralaxe(g);
    this.tempestade(g);
    this.murais(g);
    this.dicas(g);
    this.enfeites(g);
    this.solidos(g);
    this.perigos(g);
    this.checkpoints(g);
    this.saida(g);
    this.itens(g);
    this.npcs(g);
    this.inimigos(g);
    if(Mundo.chefe)this.chefe(g,Mundo.chefe);
    this.projeteis(g);
    if(!Jogo.vitrine)this.manu(g);
    this.ondas(g);
    Part.desenha(g);
    this.clarao(g);
    this.tinta(g);
    g.restore();
    this.vinheta(g);
    if(!Jogo.vitrine){this.perigo(g);this.hud(g);}
  },

  ceu(g){
    const f=this.faseAtual;
    /* O degradê termina na LINHA DO HORIZONTE, não no rodapé da tela.
       Antes a cor quente do amanhecer ficava escondida atrás do chão. */
    const linha=clamp((Mundo.chaoY-Cam.oy)*Vista.escala,Vista.cssA*.42,Vista.cssA*1.25);
    const grad=g.createLinearGradient(0,0,0,linha);
    grad.addColorStop(0,f.ceu[0]);
    grad.addColorStop(.52,f.ceu[1]);
    grad.addColorStop(1,f.ceu[2]);
    g.fillStyle=grad;
    g.fillRect(0,0,Vista.cssL,Vista.cssA);
  },
